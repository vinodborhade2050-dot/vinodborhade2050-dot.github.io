<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marriage Invitation Editor</title>

<style>
body{
    font-family: Arial;
    background:#f3f3f3;
    margin:0;
    padding:20px;
}

/* Controls */
.controls{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

input, select, button{
    padding:8px;
    margin:5px;
    width:100%;
    max-width:300px;
}

/* Card */
#cardWrapper{
    position:relative;
    width:100%;
    max-width:500px;
    margin:auto;
}

#bg{
    width:100%;
    border-radius:10px;
    display:block;
}

/* TEXT LAYER */
.text{
    position:absolute;
    transform:translate(-50%,-50%);
    color:#000;
    font-weight:bold;
    z-index:5;   /* IMPORTANT FIX */
}

/* Responsive */
@media(max-width:600px){
    .text{
        font-size:14px;
    }
}
</style>
</head>

<body>

<div class="controls">

<h3>Draft Settings</h3>

<input id="draftName" placeholder="Enter Draft Name">

<button onclick="saveDraft()">💾 Save Draft</button>

<br>

<select id="draftList" onchange="loadDraft()">
<option value="">-- Load Draft --</option>
</select>

<hr>

<h3>Content</h3>

<input id="name1" placeholder="Bride Name">
<input id="name2" placeholder="Groom Name">
<input id="date" placeholder="Date">
<input id="venue" placeholder="Venue">

<h3>Background</h3>
<input type="file" onchange="uploadBG(event)">

</div>

<div id="cardWrapper">
    <img id="bg">

    <div class="text" id="t1" style="top:30%; left:50%"></div>
    <div class="text" id="t2" style="top:40%; left:50%"></div>
    <div class="text" id="t3" style="top:50%; left:50%"></div>
    <div class="text" id="t4" style="top:60%; left:50%"></div>
</div>

<script>

/* LIVE TEXT UPDATE */
document.querySelectorAll("input").forEach(input=>{
    input.addEventListener("input", updateText);
});

function updateText(){
    t1.innerText = name1.value;
    t2.innerText = name2.value;
    t3.innerText = date.value;
    t4.innerText = venue.value;
}

/* UPLOAD BACKGROUND */
function uploadBG(e){
    const reader = new FileReader();
    reader.onload = ()=> bg.src = reader.result;
    reader.readAsDataURL(e.target.files[0]);
}

/* SAVE DRAFT */
function saveDraft(){

    const name = draftName.value;
    if(!name){ alert("Enter draft name"); return; }

    const data = {
        name1:name1.value,
        name2:name2.value,
        date:date.value,
        venue:venue.value,
        bg:bg.src
    };

    localStorage.setItem("draft_"+name, JSON.stringify(data));

    loadDraftList();
    alert("Draft Saved!");
}

/* LOAD LIST */
function loadDraftList(){

    draftList.innerHTML = "<option>-- Load Draft --</option>";

    Object.keys(localStorage).forEach(key=>{
        if(key.startsWith("draft_")){
            const name = key.replace("draft_","");
            draftList.innerHTML += `<option value="${name}">${name}</option>`;
        }
    });
}

/* LOAD DRAFT */
function loadDraft(){

    const name = draftList.value;
    const data = JSON.parse(localStorage.getItem("draft_"+name));

    if(!data) return;

    name1.value = data.name1;
    name2.value = data.name2;
    date.value = data.date;
    venue.value = data.venue;
    bg.src = data.bg;

    updateText();
}

/* INIT */
loadDraftList();

</script>

</body>
</html>
