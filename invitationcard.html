<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Invitation Builder</title>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:#f5f5f5;
}

#canvas{
    width:800px;
    height:500px;
    margin:20px auto;
    border:2px dashed #aaa;
    position:relative;
    background-size:cover;
    background-position:center;
    touch-action:none;
}

.draggable{
    position:absolute;
    width:150px;
    touch-action:none;
}

button{
    padding:10px 20px;
    margin:10px;
    font-size:16px;
}
</style>
</head>

<body>

<h2>💍 Invitation Builder</h2>

Upload Template:
<input type="file" id="bgUpload"><br><br>

Upload Photo:
<input type="file" id="imgUpload"><br><br>

<button onclick="previewCard()">Preview</button>
<button onclick="downloadCard()">Download</button>

<div id="canvas"></div>

<script>
const canvas = document.getElementById("canvas");

// Background upload
bgUpload.onchange = function(e){
    const reader = new FileReader();
    reader.onload = () => canvas.style.backgroundImage = `url(${reader.result})`;
    reader.readAsDataURL(e.target.files[0]);
};

// Image upload one by one
imgUpload.onchange = function(e){
    const file = e.target.files[0];
    const reader = new FileReader();

    reader.onload = function(){
        let img = document.createElement("img");
        img.src = reader.result;
        img.className = "draggable";
        img.style.top = "50px";
        img.style.left = "50px";
        canvas.appendChild(img);
        enableTouch(img);
    };

    reader.readAsDataURL(file);
    e.target.value="";
};

function getDistance(touches){
    let dx = touches[0].clientX - touches[1].clientX;
    let dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx*dx + dy*dy);
}

function enableTouch(el){
    let startX, startY, startWidth;
    let dragging=false, resizing=false, startDist;

    el.addEventListener("touchstart", e=>{
        if(e.touches.length===1){
            dragging=true;
            startX=e.touches[0].clientX-el.offsetLeft;
            startY=e.touches[0].clientY-el.offsetTop;
        }
        if(e.touches.length===2){
            resizing=true;
            startDist=getDistance(e.touches);
            startWidth=el.offsetWidth;
        }
    });

    el.addEventListener("touchmove", e=>{
        e.preventDefault();
        if(dragging && e.touches.length===1){
            el.style.left=(e.touches[0].clientX-startX)+"px";
            el.style.top=(e.touches[0].clientY-startY)+"px";
        }
        if(resizing && e.touches.length===2){
            let newDist=getDistance(e.touches);
            let scale=newDist/startDist;
            el.style.width=(startWidth*scale)+"px";
        }
    });

    el.addEventListener("touchend", ()=>{
        dragging=false;
        resizing=false;
    });
}

// PREVIEW
function previewCard(){
    html2canvas(canvas).then(c=>{
        let win = window.open("");
        win.document.body.appendChild(c);
    });
}

// DOWNLOAD
function downloadCard(){
    html2canvas(canvas).then(c=>{
        let link = document.createElement("a");
        link.download="invitation.png";
        link.href = c.toDataURL();
        link.click();
    });
}
</script>

</body>
</html>
