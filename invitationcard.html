<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation Editor</title>

<style>

body{
    font-family:Arial;
    background:#f5f5f5;
    padding:15px;
}

.controls{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

button,input{
    padding:8px;
    margin:5px;
}

#canvas{
    position:relative;
    max-width:500px;
    margin:auto;
    border:3px dashed #ccc;
    overflow:hidden;
}

#bg{
    width:100%;
    display:block;
}

.element{
    position:absolute;
    cursor:grab;
    user-select:none;
    touch-action:none;
}

.text{
    font-size:28px;
    font-weight:bold;
}

.dragImg{
    width:120px;
}

</style>
</head>

<body>

<div class="controls">

<h3>Upload Template</h3>
<input type="file" onchange="uploadBG(event)">

<hr>

<input id="textInput" placeholder="Enter text">
<input type="color" id="colorPicker">
<button onclick="addText()">Add Text</button>

<hr>

<input type="file" onchange="addImage(event)">

</div>

<div id="canvas">
<img id="bg">
</div>

<script>

const canvas=document.getElementById("canvas");
const bg=document.getElementById("bg");

let active=null;
let shiftX=0, shiftY=0;
let initialDistance=0;
let initialSize=0;

/* ---------- DISTANCE BETWEEN TWO TOUCHES ---------- */

function getDistance(t1,t2){
    return Math.hypot(
        t2.clientX - t1.clientX,
        t2.clientY - t1.clientY
    );
}

/* ---------- DRAG + PINCH HANDLER ---------- */

canvas.addEventListener("pointermove", e=>{

    if(!active) return;

    /* ----- PINCH RESIZE ----- */
    if(e.pointerType==="touch" && e.isPrimary===false){

        const touches = Array.from(canvas.getPointerCapture ? [] : []);

    }

});

/* ---------- POINTER SYSTEM ---------- */

canvas.addEventListener("pointerdown", e=>{

    if(!e.target.classList.contains("element")) return;

    active = e.target;

    const rect = active.getBoundingClientRect();

    shiftX = e.clientX - rect.left;
    shiftY = e.clientY - rect.top;

    active.setPointerCapture(e.pointerId);

});

canvas.addEventListener("pointermove", e=>{

    if(!active) return;

    if(e.pressure===0) return;

    const rect = canvas.getBoundingClientRect();

    let x = e.clientX - rect.left - shiftX;
    let y = e.clientY - rect.top - shiftY;

    x = Math.max(0, Math.min(x, canvas.clientWidth - active.offsetWidth));
    y = Math.max(0, Math.min(y, canvas.clientHeight - active.offsetHeight));

    active.style.left = x+"px";
    active.style.top = y+"px";

});

canvas.addEventListener("pointerup", ()=> active=null);

/* ---------- MOBILE PINCH RESIZE ---------- */

canvas.addEventListener("touchstart", e=>{

    if(e.touches.length===2 && active){

        initialDistance = getDistance(e.touches[0], e.touches[1]);

        if(active.tagName==="IMG")
            initialSize = active.offsetWidth;
        else
            initialSize = parseFloat(getComputedStyle(active).fontSize);

    }

});

canvas.addEventListener("touchmove", e=>{

    if(e.touches.length===2 && active){

        e.preventDefault();

        const newDist = getDistance(e.touches[0], e.touches[1]);

        const scale = newDist / initialDistance;

        if(active.tagName==="IMG"){
            active.style.width = initialSize * scale + "px";
        } else {
            active.style.fontSize = initialSize * scale + "px";
        }

    }

});

/* ---------- TEMPLATE ---------- */

function uploadBG(e){
    const reader=new FileReader();
    reader.onload=()=> bg.src=reader.result;
    reader.readAsDataURL(e.target.files[0]);
}

/* ---------- ADD TEXT ---------- */

function addText(){

    const txt=document.getElementById("textInput").value;
    const color=document.getElementById("colorPicker").value;

    const div=document.createElement("div");
    div.className="element text";
    div.innerText=txt;
    div.style.color=color;
    div.style.left="50px";
    div.style.top="50px";

    canvas.appendChild(div);
}

/* ---------- ADD IMAGE ---------- */

function addImage(e){

    const reader=new FileReader();

    reader.onload=()=>{
        const img=document.createElement("img");
        img.src=reader.result;
        img.className="element dragImg";
        img.style.left="50px";
        img.style.top="50px";

        canvas.appendChild(img);
    }

    reader.readAsDataURL(e.target.files[0]);
}

</script>

</body>
</html>
