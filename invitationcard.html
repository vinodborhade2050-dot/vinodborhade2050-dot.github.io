<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation Editor</title>

<style>

body{
    font-family:Arial;
    background:#f5f5f5;
    padding:15px;
}

.controls{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

button,input,select{
    padding:8px;
    margin:5px;
}

#canvas{
    position:relative;
    max-width:500px;
    margin:auto;
    border:3px dashed #ccc;
    overflow:hidden;
}

#bg{
    width:100%;
    display:block;
}

.element{
    position:absolute;
    cursor:grab;
    user-select:none;
}

.text{
    font-size:28px;
    font-weight:bold;
}

.dragImg{
    width:120px;
}

</style>
</head>

<body>

<div class="controls">

<h3>Upload invitation Template</h3>
<input type="file" onchange="uploadBG(event)">

<hr>

<input id="textInput" placeholder="Enter text">
<input type="color" id="colorPicker">
<button onclick="addText()">Add Text</button>

<hr>

<input type="file" onchange="addImage(event)">

</div>

<div id="canvas">
<img id="bg">
</div>

<script>

const canvas=document.getElementById("canvas");
const bg=document.getElementById("bg");

/* ---------- PERFECT DRAG FUNCTION ---------- */

function makeDraggable(el){

let shiftX, shiftY;

el.onpointerdown = e => {

    const rect = el.getBoundingClientRect();

    shiftX = e.clientX - rect.left;
    shiftY = e.clientY - rect.top;

    el.setPointerCapture(e.pointerId);

};

el.onpointermove = e => {

    if(!el.hasPointerCapture(e.pointerId)) return;

    const canvasRect = canvas.getBoundingClientRect();

    let newX = e.clientX - canvasRect.left - shiftX;
    let newY = e.clientY - canvasRect.top - shiftY;

    /* ----- KEEP INSIDE CANVAS ----- */
    newX = Math.max(0, Math.min(newX, canvas.clientWidth - el.offsetWidth));
    newY = Math.max(0, Math.min(newY, canvas.clientHeight - el.offsetHeight));

    el.style.left = newX + "px";
    el.style.top = newY + "px";
};

}

/* ---------- TEMPLATE ---------- */

function uploadBG(e){
    const reader=new FileReader();
    reader.onload=()=> bg.src=reader.result;
    reader.readAsDataURL(e.target.files[0]);
}

/* ---------- ADD TEXT ---------- */

function addText(){

    const txt=document.getElementById("textInput").value;
    const color=document.getElementById("colorPicker").value;

    const div=document.createElement("div");
    div.className="element text";
    div.innerText=txt;
    div.style.color=color;
    div.style.left="50px";
    div.style.top="50px";

    canvas.appendChild(div);
    makeDraggable(div);
}

/* ---------- ADD IMAGE ---------- */

function addImage(e){

    const reader=new FileReader();

    reader.onload=()=>{
        const img=document.createElement("img");
        img.src=reader.result;
        img.className="element dragImg";
        img.style.left="50px";
        img.style.top="50px";

        canvas.appendChild(img);
        makeDraggable(img);
    }

    reader.readAsDataURL(e.target.files[0]);
}

</script>

</body>
</html>
