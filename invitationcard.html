
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marriage Invitation Editor</title>

<style>
@font-face{
font-family:"ganesha";
src:url("fonts/ams-ganesha.ttf") format("truetype");
}
@font-face{
font-family:"matarani";
src:url("fonts/ams-matarani.ttf") format("truetype");
}

body{margin:0;font-family:Arial;background:#f0f0f0;text-align:center}

#toolbar{
background:white;
padding:10px;
box-shadow:0 2px 5px rgba(0,0,0,.2);
position:sticky;top:0;z-index:999;
}

button,select,input{padding:6px;margin:4px}

#canvas{
width:100%;
max-width:600px;
height:850px;
margin:10px auto;
position:relative;
background:white;
overflow:hidden;
touch-action:none;
}

.template{
position:absolute;
width:100%;
height:100%;
object-fit:contain;
z-index:0;
}

.element{
position:absolute;
touch-action:none;
z-index:5;
}

.selected{
outline:2px dashed #2196f3;
}

.text{
font-size:28px;
font-weight:bold;
}

.delete{
position:absolute;
top:-12px;
right:-12px;
background:red;
color:white;
border-radius:50%;
width:22px;height:22px;
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
cursor:pointer;
}

.dragImg{width:150px}
</style>
</head>

<body>

<div id="toolbar">
<input type="file" onchange="loadTemplate(event)">
<input type="file" onchange="addImage(event)">

<input id="txt" placeholder="Enter text">

<select id="font">
<option value="Arial">Arial</option>
<option value="ganesha" style="font-family:ganesha">Ganesha</option>
<option value="matarani" style="font-family:matarani">Matarani</option>
</select>

<input type="color" id="color">

<button onclick="addText()">Add Text</button>
<button onclick="undo()">Undo</button>

<input id="draftName" placeholder="Draft name">
<button onclick="saveDraft()">Save</button>

<select id="drafts"></select>
<button onclick="loadDraft()">Load</button>

<button onclick="download()">Download</button>
</div>

<div id="canvas"></div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script>
const canvas=document.getElementById("canvas");
const drafts=document.getElementById("drafts");
let history=[];
let selected=null;

/* SAVE STATE */
function saveState(){
history.push(canvas.innerHTML);
if(history.length>30)history.shift();
}

/* UNDO */
function undo(){
if(history.length){
canvas.innerHTML=history.pop();
initElements();
}
}

/* TEMPLATE */
function loadTemplate(e){
saveState();
let r=new FileReader();
r.onload=()=>{
canvas.innerHTML=`<img src="${r.result}" class="template">`;
}
r.readAsDataURL(e.target.files[0]);
}

/* SELECT */
function select(el){
document.querySelectorAll(".element").forEach(e=>e.classList.remove("selected"));
selected=el;
el.classList.add("selected");
}

/* DELETE BUTTON */
function addDelete(el){
let d=document.createElement("div");
d.className="delete";
d.innerHTML="✖";

d.addEventListener("touchstart",(e)=>{
e.stopPropagation();
e.preventDefault();
saveState();
el.remove();
selected=null;
});

d.addEventListener("click",(e)=>{
e.stopPropagation();
saveState();
el.remove();
selected=null;
});

el.appendChild(d);
}

/* ADD IMAGE */
function addImage(e){
saveState();
let r=new FileReader();
r.onload=()=>{
let img=document.createElement("img");
img.src=r.result;
img.className="element dragImg";
img.style.left="50px";
img.style.top="50px";
canvas.appendChild(img);
initElement(img);
};
r.readAsDataURL(e.target.files[0]);
}

/* ADD TEXT */
function addText(){
saveState();
let div=document.createElement("div");
div.className="element text";
div.innerText=document.getElementById("txt").value;
div.style.color=document.getElementById("color").value;
div.style.fontFamily=document.getElementById("font").value;
div.style.left="80px";
div.style.top="80px";
canvas.appendChild(div);
initElement(div);
}

/* INIT ELEMENT */
function initElement(el){
addDelete(el);

let startX,startY,initX,initY;

el.addEventListener("touchstart",(e)=>{
select(el);
if(e.touches.length===1){
startX=e.touches[0].clientX;
startY=e.touches[0].clientY;
initX=parseFloat(el.style.left)||0;
initY=parseFloat(el.style.top)||0;
}
});

el.addEventListener("touchmove",(e)=>{
if(selected!==el)return;
if(e.touches.length===1){
let dx=e.touches[0].clientX-startX;
let dy=e.touches[0].clientY-startY;
el.style.left=(initX+dx)+"px";
el.style.top=(initY+dy)+"px";
}
});
}

/* GLOBAL PINCH RESIZE */
let startDist=0,startWidth=0;

canvas.addEventListener("touchstart",(e)=>{
if(e.touches.length===2 && selected){
e.preventDefault();
startDist=getDist(e);
startWidth=selected.offsetWidth;
}
},{passive:false});

canvas.addEventListener("touchmove",(e)=>{
if(e.touches.length===2 && selected){
e.preventDefault();
let newDist=getDist(e);
let scale=newDist/startDist;
selected.style.width=(startWidth*scale)+"px";
}
},{passive:false});

function getDist(e){
return Math.hypot(
e.touches[0].clientX-e.touches[1].clientX,
e.touches[0].clientY-e.touches[1].clientY
);
}

/* DOWNLOAD */
function download(){
html2canvas(canvas).then(c=>{
let a=document.createElement("a");
a.download="invitation.png";
a.href=c.toDataURL();
a.click();
});
}

/* SAVE DRAFT */
function saveDraft(){
let name=draftName.value;
if(!name)return alert("Enter draft name");
localStorage.setItem("draft_"+name,canvas.innerHTML);
loadDraftList();
}

/* LOAD DRAFT */
function loadDraft(){
let key=drafts.value;
canvas.innerHTML=localStorage.getItem(key);
initElements();
}

/* LIST DRAFTS */
function loadDraftList(){
drafts.innerHTML="";
for(let k in localStorage){
if(k.startsWith("draft_")){
drafts.innerHTML+=`<option value="${k}">${k.replace("draft_","")}</option>`;
}
}
}

/* REINIT */
function initElements(){
document.querySelectorAll(".element").forEach(el=>initElement(el));
}

/* INIT */
loadDraftList();
</script>

</body>
</html>
