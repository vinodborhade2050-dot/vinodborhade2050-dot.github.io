<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Wedding Invitation Builder</title>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
body{
    font-family: Arial;
    text-align:center;
    background:#f0f0f0;
}

#canvas{
    width:800px;
    height:1200px;
    margin:20px auto;
    border:3px solid #444;
    position:relative;
    overflow:hidden;
}

/* TEMPLATE IMAGE */
#templateImg{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:contain;
    top:0;
    left:0;
    z-index:0;
}

/* USER IMAGES */
.draggable{
    position:absolute;
    width:200px;
    touch-action:none;
    border:2px dashed transparent;
    z-index:10;
}

.selected{
    border:2px dashed red;
}

button{
    padding:10px 20px;
    margin:8px;
    font-size:16px;
}
</style>
</head>

<body>

<h2>💍 Wedding Invitation Builder</h2>

Upload Template:
<input type="file" id="bgUpload"><br><br>

Upload Photo:
<input type="file" id="imgUpload"><br><br>

<button onclick="deleteImage()">Delete Selected</button>
<button onclick="previewCard()">Preview</button>
<button onclick="downloadCard()">Download</button>

<div id="canvas">
    <img id="templateImg">
</div>

<script>
const canvas = document.getElementById("canvas");
const templateImg = document.getElementById("templateImg");
let selectedElement = null;

// TEMPLATE AUTO FIT
bgUpload.onchange = e=>{
    const reader = new FileReader();
    reader.onload = ()=> templateImg.src = reader.result;
    reader.readAsDataURL(e.target.files[0]);
};

// Upload photos
imgUpload.onchange = e=>{
    const file = e.target.files[0];
    const reader = new FileReader();

    reader.onload = ()=>{
        let img = document.createElement("img");
        img.src = reader.result;
        img.className = "draggable";
        img.style.top="100px";
        img.style.left="100px";

        img.onclick = ()=>{
            document.querySelectorAll(".draggable")
                .forEach(i=>i.classList.remove("selected"));
            img.classList.add("selected");
            selectedElement = img;
        };

        canvas.appendChild(img);
        enableTouch(img);
    };

    reader.readAsDataURL(file);
    e.target.value="";
};

// DELETE
function deleteImage(){
    if(selectedElement){
        selectedElement.remove();
        selectedElement = null;
    }
}

// TOUCH
function getDistance(t){
    let dx=t[0].clientX-t[1].clientX;
    let dy=t[0].clientY-t[1].clientY;
    return Math.sqrt(dx*dx+dy*dy);
}

function enableTouch(el){
    let startX,startY,startWidth;
    let dragging=false,resizing=false,startDist;

    el.addEventListener("touchstart", e=>{
        el.click();

        if(e.touches.length===1){
            dragging=true;
            startX=e.touches[0].clientX-el.offsetLeft;
            startY=e.touches[0].clientY-el.offsetTop;
        }

        if(e.touches.length===2){
            resizing=true;
            startDist=getDistance(e.touches);
            startWidth=el.offsetWidth;
        }
    });

    el.addEventListener("touchmove", e=>{
        e.preventDefault();

        if(dragging && e.touches.length===1){
            el.style.left=(e.touches[0].clientX-startX)+"px";
            el.style.top=(e.touches[0].clientY-startY)+"px";
        }

        if(resizing && e.touches.length===2){
            let newDist=getDistance(e.touches);
            let scale=newDist/startDist;
            el.style.width=(startWidth*scale)+"px";
        }
    });

    el.addEventListener("touchend", ()=>{
        dragging=false;
        resizing=false;
    });
}

// PREVIEW
function previewCard(){
    html2canvas(canvas).then(c=>{
        let win=window.open("");
        win.document.body.appendChild(c);
    });
}

// DOWNLOAD
function downloadCard(){
    html2canvas(canvas).then(c=>{
        let link=document.createElement("a");
        link.download="wedding-card.png";
        link.href=c.toDataURL();
        link.click();
    });
}
</script>

</body>
</html>
