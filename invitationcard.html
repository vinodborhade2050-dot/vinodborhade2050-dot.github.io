
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#f3f3f3;text-align:center}

#toolbar{background:white;padding:10px;position:sticky;top:0;z-index:999}

#canvas{
width:100%;
max-width:600px;
height:850px;
margin:auto;
background:white;
position:relative;
overflow:hidden;
touch-action:none;
}

.template{
position:absolute;width:100%;height:100%;object-fit:contain;
}

.element{
position:absolute;
touch-action:none;
}

.selected{
outline:2px dashed #2196f3;
}

.delete{
position:absolute;
top:-12px;right:-12px;
background:red;color:white;
border-radius:50%;
width:22px;height:22px;
display:flex;align-items:center;justify-content:center;
font-size:12px;cursor:pointer;
}
</style>
</head>

<body>

<div id="toolbar">
<input type="file" onchange="loadTemplate(event)">
<input type="file" onchange="addImage(event)">
<input id="txt" placeholder="Text">
<input type="color" id="color">
<button onclick="addText()">Add Text</button>
<button onclick="undo()">Undo</button>
<button onclick="download()">Download</button>
</div>

<div id="canvas"></div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script>

const canvas=document.getElementById("canvas");
let selected=null;
let history=[];

/* ---------- SAVE STATE ---------- */
function saveState(){
history.push(canvas.innerHTML);
if(history.length>30)history.shift();
}

/* ---------- UNDO ---------- */
function undo(){
if(history.length){
canvas.innerHTML=history.pop();
initAll();
}
}

/* ---------- SELECT ELEMENT ---------- */
function select(el){
document.querySelectorAll(".element").forEach(e=>e.classList.remove("selected"));
selected=el;
el.classList.add("selected");
}

/* ---------- DELETE ---------- */
function addDelete(el){
let d=document.createElement("div");
d.className="delete";
d.innerHTML="✖";
d.onclick=(e)=>{
e.stopPropagation();
saveState();
el.remove();
selected=null;
};
el.appendChild(d);
}

/* ---------- TEMPLATE ---------- */
function loadTemplate(e){
saveState();
let r=new FileReader();
r.onload=()=>{
canvas.innerHTML=`<img src="${r.result}" class="template">`;
}
r.readAsDataURL(e.target.files[0]);
}

/* ---------- ADD IMAGE ---------- */
function addImage(e){
saveState();
let r=new FileReader();
r.onload=()=>{
let img=document.createElement("img");
img.src=r.result;
img.className="element";
img.style.width="150px";
img.style.left="50px";
img.style.top="50px";
canvas.appendChild(img);
initElement(img);
};
r.readAsDataURL(e.target.files[0]);
}

/* ---------- ADD TEXT ---------- */
function addText(){
saveState();
let div=document.createElement("div");
div.className="element";
div.innerText=txt.value;
div.style.color=color.value;
div.style.fontSize="28px";
div.style.left="80px";
div.style.top="80px";
canvas.appendChild(div);
initElement(div);
}

/* ---------- INIT ELEMENT ---------- */
function initElement(el){

addDelete(el);

el.addEventListener("click",(e)=>{
e.stopPropagation();
select(el);
});

let startX,startY,initX,initY;

el.addEventListener("touchstart",e=>{
select(el);
if(e.touches.length===1){
startX=e.touches[0].clientX;
startY=e.touches[0].clientY;
initX=parseFloat(el.style.left)||0;
initY=parseFloat(el.style.top)||0;
}
});

el.addEventListener("touchmove",e=>{
if(selected!==el)return;
if(e.touches.length===1){
let dx=e.touches[0].clientX-startX;
let dy=e.touches[0].clientY-startY;
el.style.left=(initX+dx)+"px";
el.style.top=(initY+dy)+"px";
}
});
}

/* ---------- GLOBAL PINCH RESIZE ---------- */
let startDist, startWidth;

canvas.addEventListener("touchstart",e=>{
if(e.touches.length===2 && selected){
startDist=getDist(e);
startWidth=selected.offsetWidth;
}
});

canvas.addEventListener("touchmove",e=>{
if(e.touches.length===2 && selected){
let newDist=getDist(e);
let scale=newDist/startDist;
selected.style.width=(startWidth*scale)+"px";
}
});

function getDist(e){
return Math.hypot(
e.touches[0].clientX-e.touches[1].clientX,
e.touches[0].clientY-e.touches[1].clientY
);
}

/* ---------- CLICK OUTSIDE ---------- */
canvas.addEventListener("click",()=>{
document.querySelectorAll(".element").forEach(e=>e.classList.remove("selected"));
selected=null;
});

/* ---------- DOWNLOAD ---------- */
function download(){
html2canvas(canvas).then(c=>{
let a=document.createElement("a");
a.download="card.png";
a.href=c.toDataURL();
a.click();
});
}

/* ---------- REINIT ---------- */
function initAll(){
document.querySelectorAll(".element").forEach(initElement);
}

</script>

</body>
</html>
