<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation Builder</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Pacifico&family=Playfair+Display&family=Dancing+Script&family=Lobster&display=swap" rel="stylesheet">

<style>
body{font-family:Arial;margin:0;background:#f5f5f5;text-align:center}

#toolbar{
position:sticky;top:0;background:white;padding:10px;
box-shadow:0 2px 5px rgba(0,0,0,.2);z-index:10
}

button,input,select{margin:5px;padding:8px}

#canvas{
width:800px;height:1200px;background:white;
margin:20px auto;border:3px solid #333;
position:relative;overflow:hidden
}

.template{position:absolute}

.draggable{position:absolute;touch-action:none}

.selected{border:2px dashed red}

.deleteBtn{
position:absolute;top:-15px;right:-15px;
background:red;color:white;border-radius:50%;
width:25px;height:25px;cursor:pointer;
display:none;font-size:18px;line-height:25px;text-align:center
}

.textBox{
font-size:40px;font-weight:bold;
min-width:100px;text-align:center
}
</style>
</head>

<body>

<div id="toolbar">

Template:
<input type="file" id="templateUpload">

Image:
<input type="file" id="imgUpload">

<br>

<input id="textInput" placeholder="Enter text">

<select id="fontSelect">
<option style="font-family:Great Vibes" value="Great Vibes">Great Vibes</option>
<option style="font-family:Pacifico" value="Pacifico">Pacifico</option>
<option style="font-family:Playfair Display" value="Playfair Display">Playfair</option>
<option style="font-family:Dancing Script" value="Dancing Script">Dancing</option>
<option style="font-family:Lobster" value="Lobster">Lobster</option>
</select>

<input type="color" id="colorPicker">

<button onclick="addText()">Add Text</button>

<br>

<input id="draftName" placeholder="Draft Name">
<button onclick="saveDraft()">Save Draft</button>

<select id="draftList" onchange="loadDraft()">
<option>Load Draft</option>
</select>

<button onclick="download()">Download</button>

</div>

<div id="canvas"></div>

<script>
let canvas=document.getElementById("canvas")
let selected=null

/* TEMPLATE AUTO FIT */
templateUpload.onchange=e=>{
let file=e.target.files[0]
let reader=new FileReader()

reader.onload=function(){
let img=new Image()

img.onload=function(){
canvas.innerHTML=""

let cw=canvas.clientWidth
let ch=canvas.clientHeight
let iw=img.width
let ih=img.height

let scale=Math.min(cw/iw,ch/ih)

let nw=iw*scale
let nh=ih*scale

img.className="template"
img.style.width=nw+"px"
img.style.height=nh+"px"
img.style.left=(cw-nw)/2+"px"
img.style.top=(ch-nh)/2+"px"

canvas.appendChild(img)
}

img.src=reader.result
}

reader.readAsDataURL(file)
}

/* ADD IMAGE */
imgUpload.onchange=e=>{
let file=e.target.files[0]
let reader=new FileReader()
reader.onload=function(){createElement(reader.result,true)}
reader.readAsDataURL(file)
}

/* ADD TEXT */
function addText(){
let txt=textInput.value
if(!txt)return

let div=document.createElement("div")
div.innerText=txt
div.className="textBox"
div.style.fontFamily=fontSelect.value
div.style.color=colorPicker.value

createElement(div,false)
}

/* CREATE ELEMENT */
function createElement(content,isImage){

let wrap=document.createElement("div")
wrap.className="draggable"
wrap.style.left="100px"
wrap.style.top="100px"

let del=document.createElement("div")
del.innerText="×"
del.className="deleteBtn"
del.onclick=e=>{e.stopPropagation();wrap.remove()}

if(isImage){
let img=document.createElement("img")
img.src=content
img.style.width="200px"
wrap.appendChild(img)
}else{
wrap.appendChild(content)
}

wrap.appendChild(del)
canvas.appendChild(wrap)

enableTouch(wrap)

wrap.onclick=()=>{
document.querySelectorAll(".draggable").forEach(d=>{
d.classList.remove("selected")
if(d.lastChild)d.lastChild.style.display="none"
})
wrap.classList.add("selected")
del.style.display="block"
selected=wrap
}
}

/* DRAG + RESIZE */
function enableTouch(el){
let startX,startY,scale=1

el.onpointerdown=e=>{
startX=e.clientX-el.offsetLeft
startY=e.clientY-el.offsetTop
el.setPointerCapture(e.pointerId)
}

el.onpointermove=e=>{
if(e.pressure>0){
el.style.left=e.clientX-startX+"px"
el.style.top=e.clientY-startY+"px"
}
}

el.addEventListener("wheel",e=>{
e.preventDefault()
scale+=e.deltaY*-0.001
scale=Math.min(Math.max(.5,scale),3)
el.style.transform=`scale(${scale})`
})
}

/* SAVE DRAFT */
function saveDraft(){
let name=draftName.value
if(!name)return alert("Enter name")
localStorage.setItem("draft_"+name,canvas.innerHTML)
loadDraftList()
alert("Saved!")
}

/* LOAD LIST */
function loadDraftList(){
draftList.innerHTML="<option>Load Draft</option>"
Object.keys(localStorage).forEach(k=>{
if(k.startsWith("draft_")){
let opt=document.createElement("option")
opt.value=k
opt.innerText=k.replace("draft_","")
draftList.appendChild(opt)
}
})
}
loadDraftList()

/* LOAD DRAFT */
function loadDraft(){
canvas.innerHTML=localStorage.getItem(draftList.value)
}

/* DOWNLOAD */
function download(){
html2canvas(canvas).then(c=>{
let a=document.createElement("a")
a.download="invitation.png"
a.href=c.toDataURL()
a.click()
})
}

/* HTML2CANVAS */
let s=document.createElement("script")
s.src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"
document.body.appendChild(s)
</script>

</body>
</html>
