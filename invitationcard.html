<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation Editor</title>

<style>
body{
    font-family:Arial;
    background:#f2f2f2;
    margin:0;
    padding:20px;
}

.controls{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

button,input,select{
    margin:5px;
    padding:8px;
}

#canvas{
    position:relative;
    max-width:500px;
    margin:auto;
}

#bg{
    width:100%;
    border-radius:10px;
}

.element{
    position:absolute;
    cursor:move;
    user-select:none;
}

.text{
    font-weight:bold;
}

img.dragImg{
    width:120px;
}
</style>
</head>

<body>

<div class="controls">

<h3>Draft</h3>
<input id="draftName" placeholder="Draft Name">
<button onclick="saveDraft()">Save Draft</button>

<select id="draftList" onchange="loadDraft()">
<option>Load Draft</option>
</select>

<hr>

<h3>Background</h3>
<input type="file" onchange="uploadBG(event)">

<hr>

<h3>Add Text</h3>
<input id="textInput" placeholder="Enter text">
<input type="color" id="colorPicker">
<button onclick="addText()">Add Text</button>

<hr>

<h3>Add Image</h3>
<input type="file" onchange="addImage(event)">

</div>

<div id="canvas">
    <img id="bg">
</div>

<script>

let elements=[];

/* ---------- DRAG FUNCTION ---------- */
function makeDraggable(el){

    let offsetX, offsetY, isDown=false;

    el.onmousedown=e=>{
        isDown=true;
        offsetX=e.offsetX;
        offsetY=e.offsetY;
    };

    document.onmouseup=()=> isDown=false;

    document.onmousemove=e=>{
        if(!isDown) return;

        const rect=canvas.getBoundingClientRect();
        el.style.left=(e.clientX-rect.left-offsetX)+"px";
        el.style.top=(e.clientY-rect.top-offsetY)+"px";
    };
}

/* ---------- BACKGROUND ---------- */
function uploadBG(e){
    const reader=new FileReader();
    reader.onload=()=> bg.src=reader.result;
    reader.readAsDataURL(e.target.files[0]);
}

/* ---------- ADD TEXT ---------- */
function addText(){

    const text=textInput.value;
    const color=colorPicker.value;

    const div=document.createElement("div");
    div.className="element text";
    div.innerText=text;
    div.style.color=color;
    div.style.left="50px";
    div.style.top="50px";

    canvas.appendChild(div);
    makeDraggable(div);

    elements.push(div.outerHTML);
}

/* ---------- ADD IMAGE ---------- */
function addImage(e){

    const reader=new FileReader();

    reader.onload=()=>{

        const img=document.createElement("img");
        img.src=reader.result;
        img.className="element dragImg";
        img.style.left="50px";
        img.style.top="50px";

        canvas.appendChild(img);
        makeDraggable(img);

        elements.push(img.outerHTML);
    };

    reader.readAsDataURL(e.target.files[0]);
}

/* ---------- SAVE DRAFT ---------- */
function saveDraft(){

    const name=draftName.value;
    if(!name) return alert("Enter name");

    const data={
        bg:bg.src,
        html:canvas.innerHTML
    };

    localStorage.setItem("draft_"+name,JSON.stringify(data));
    loadList();

    alert("Saved!");
}

/* ---------- LOAD LIST ---------- */
function loadList(){

    draftList.innerHTML="<option>Load Draft</option>";

    Object.keys(localStorage).forEach(k=>{
        if(k.startsWith("draft_")){
            const name=k.replace("draft_","");
            draftList.innerHTML+=`<option>${name}</option>`;
        }
    });
}

/* ---------- LOAD DRAFT ---------- */
function loadDraft(){

    const name=draftList.value;
    const data=JSON.parse(localStorage.getItem("draft_"+name));

    canvas.innerHTML=data.html;
    bg.src=data.bg;

    document.querySelectorAll(".element").forEach(makeDraggable);
}

/* INIT */
loadList();

</script>

</body>
</html>
