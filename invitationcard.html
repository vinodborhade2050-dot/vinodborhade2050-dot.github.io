<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Pacifico&family=Playfair+Display&family=Dancing+Script&family=Lobster&display=swap" rel="stylesheet">

<style>
body{font-family:Arial;text-align:center;background:#f0f0f0}

#toolbar{background:white;padding:10px;position:sticky;top:0}

#canvas{
width:800px;height:1200px;background:white;
margin:20px auto;border:3px solid #333;
position:relative;overflow:hidden
}

.template{position:absolute}

.draggable{position:absolute;touch-action:none}

.deleteBtn{
position:absolute;top:-15px;right:-15px;
background:red;color:white;border-radius:50%;
width:25px;height:25px;cursor:pointer;
display:none;text-align:center;line-height:25px
}

.textBox{font-size:40px;font-weight:bold;text-align:center}
</style>
</head>

<body>

<div id="toolbar">

<input type="file" id="templateUpload">
<input type="file" id="imgUpload">

<input id="textInput">
<select id="fontSelect">
<option value="Great Vibes">Great Vibes</option>
<option value="Pacifico">Pacifico</option>
<option value="Playfair Display">Playfair</option>
<option value="Dancing Script">Dancing</option>
<option value="Lobster">Lobster</option>
</select>

<input type="color" id="colorPicker">

<button onclick="addText()">Add Text</button>

<br>

<input id="draftName" placeholder="Draft Name">
<button onclick="saveDraft()">Save Draft</button>

<select id="draftList" onchange="loadDraft()">
<option>Load Draft</option>
</select>

<button onclick="download()">Download</button>

</div>

<div id="canvas"></div>

<script>
let canvas=document.getElementById("canvas")

/* TEMPLATE */
templateUpload.onchange=e=>{
let r=new FileReader()
r.onload=function(){
let img=new Image()
img.onload=function(){
canvas.innerHTML=""

let scale=Math.min(canvas.clientWidth/img.width,canvas.clientHeight/img.height)

img.className="template"
img.style.width=img.width*scale+"px"
img.style.height=img.height*scale+"px"
img.style.left=(canvas.clientWidth-img.width*scale)/2+"px"
img.style.top=(canvas.clientHeight-img.height*scale)/2+"px"

canvas.appendChild(img)
}
img.src=r.result
}
r.readAsDataURL(e.target.files[0])
}

/* CREATE ELEMENT */
function createElement(data){

let wrap=document.createElement("div")
wrap.className="draggable"
wrap.style.left=data.left
wrap.style.top=data.top
wrap.style.transform=data.transform||"scale(1)"

let del=document.createElement("div")
del.innerText="×"
del.className="deleteBtn"
del.onclick=e=>{e.stopPropagation();wrap.remove()}

if(data.type=="img"){
let img=document.createElement("img")
img.src=data.src
img.style.width=data.width
wrap.appendChild(img)
}else{
let t=document.createElement("div")
t.innerText=data.text
t.className="textBox"
t.style.fontFamily=data.font
t.style.color=data.color
wrap.appendChild(t)
}

wrap.appendChild(del)
canvas.appendChild(wrap)
enableDrag(wrap)

wrap.onclick=()=>{
document.querySelectorAll(".deleteBtn").forEach(b=>b.style.display="none")
del.style.display="block"
}
}

/* ADD IMAGE */
imgUpload.onchange=e=>{
let r=new FileReader()
r.onload=function(){
createElement({
type:"img",
src:r.result,
left:"100px",
top:"100px",
width:"200px"
})
}
r.readAsDataURL(e.target.files[0])
}

/* ADD TEXT */
function addText(){
createElement({
type:"text",
text:textInput.value,
font:fontSelect.value,
color:colorPicker.value,
left:"150px",
top:"200px"
})
}

/* DRAG */
function enableDrag(el){
let startX,startY,scale=1

el.onpointerdown=e=>{
startX=e.clientX-el.offsetLeft
startY=e.clientY-el.offsetTop
el.setPointerCapture(e.pointerId)
}

el.onpointermove=e=>{
if(e.pressure>0){
el.style.left=e.clientX-startX+"px"
el.style.top=e.clientY-startY+"px"
}
}

el.addEventListener("wheel",e=>{
e.preventDefault()
scale+=e.deltaY*-0.001
scale=Math.min(Math.max(.5,scale),3)
el.style.transform=`scale(${scale})`
})
}

/* SAVE DRAFT */
function saveDraft(){
let name=draftName.value
if(!name)return alert("Enter name")

let data=[]
canvas.querySelectorAll(".draggable").forEach(el=>{
let obj={
left:el.style.left,
top:el.style.top,
transform:el.style.transform
}

if(el.querySelector("img")){
obj.type="img"
obj.src=el.querySelector("img").src
obj.width=el.querySelector("img").style.width
}else{
let t=el.querySelector(".textBox")
obj.type="text"
obj.text=t.innerText
obj.font=t.style.fontFamily
obj.color=t.style.color
}
data.push(obj)
})

localStorage.setItem("draft_"+name,JSON.stringify(data))
loadDraftList()
alert("Saved!")
}

/* LOAD LIST */
function loadDraftList(){
draftList.innerHTML="<option>Load Draft</option>"
Object.keys(localStorage).forEach(k=>{
if(k.startsWith("draft_")){
let o=document.createElement("option")
o.value=k
o.innerText=k.replace("draft_","")
draftList.appendChild(o)
}
})
}
loadDraftList()

/* LOAD DRAFT */
function loadDraft(){
canvas.innerHTML=""
let data=JSON.parse(localStorage.getItem(draftList.value))
data.forEach(createElement)
}

/* DOWNLOAD */
function download(){
html2canvas(canvas).then(c=>{
let a=document.createElement("a")
a.href=c.toDataURL()
a.download="invitation.png"
a.click()
})
}

let s=document.createElement("script")
s.src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"
document.body.appendChild(s)
</script>

</body>
</html>
