<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Card PRO Editor</title>

<style>
body{font-family:Arial;background:#f5f5f5;padding:15px}
.controls{background:white;padding:15px;border-radius:10px;margin-bottom:15px}
button,input,select{padding:8px;margin:5px}

#canvas{
position:relative;
max-width:500px;
margin:auto;
border:3px dashed #ccc;
overflow:hidden;
}

#bg{width:100%}

.element{
position:absolute;
cursor:grab;
touch-action:none;
user-select:none;
}

.active{outline:3px solid #2196F3}
.text{font-size:28px;font-weight:bold}
.dragImg{width:120px}

.deleteBtn{
position:absolute;top:-12px;right:-12px;background:red;color:white;
border-radius:50%;width:22px;height:22px;
display:flex;align-items:center;justify-content:center;
font-size:14px;cursor:pointer;
}
</style>
</head>

<body>

<div class="controls">

<input type="file" onchange="uploadBG(event)">

<br>

<input id="textInput" placeholder="Text">
<input type="color" id="colorPicker">
<button onclick="addText()">Add Text</button>

<br>

<input type="file" onchange="addImage(event)">

<br>

<button onclick="undo()">Undo</button>

<hr>

<input id="draftName" placeholder="Draft Name">
<button onclick="saveDraft()">Save Draft</button>

<select id="draftList" onchange="loadDraft()">
<option>Load Draft</option>
</select>

<hr>

<button onclick="preview()">Preview</button>
<button onclick="download()">Download</button>

</div>

<div id="canvas">
<img id="bg">
</div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script>

const canvas=document.getElementById("canvas");
const bg=document.getElementById("bg");

let active=null;
let shiftX=0,shiftY=0;
let startDist=0,startSize=0;

let history=[];

/* ---------- STATE ---------- */

function saveState(){
history.push(canvas.innerHTML);
if(history.length>30) history.shift();
}

/* ---------- UNDO ---------- */

function undo(){
if(history.length==0) return;
canvas.innerHTML=history.pop();
attachEvents();
}

/* ---------- SELECT ---------- */

function select(el){
document.querySelectorAll(".element").forEach(e=>e.classList.remove("active"));
active=el;
el.classList.add("active");
}

/* ---------- DRAG ---------- */

canvas.addEventListener("pointerdown",e=>{
if(!e.target.classList.contains("element")) return;

select(e.target);
saveState();

const rect=active.getBoundingClientRect();
shiftX=e.clientX-rect.left;
shiftY=e.clientY-rect.top;
});

canvas.addEventListener("pointermove",e=>{
if(!active) return;

const rect=canvas.getBoundingClientRect();
let x=e.clientX-rect.left-shiftX;
let y=e.clientY-rect.top-shiftY;

active.style.left=x+"px";
active.style.top=y+"px";
});

/* ---------- PINCH ANYWHERE ---------- */

canvas.addEventListener("touchstart",e=>{
if(e.touches.length==2 && active){
saveState();

startDist=Math.hypot(
e.touches[0].clientX-e.touches[1].clientX,
e.touches[0].clientY-e.touches[1].clientY
);

startSize=active.tagName=="IMG"
?active.offsetWidth
:parseFloat(getComputedStyle(active).fontSize);
}
});

canvas.addEventListener("touchmove",e=>{
if(e.touches.length==2 && active){
e.preventDefault();

let newDist=Math.hypot(
e.touches[0].clientX-e.touches[1].clientX,
e.touches[0].clientY-e.touches[1].clientY
);

let scale=newDist/startDist;

if(active.tagName=="IMG")
active.style.width=startSize*scale+"px";
else
active.style.fontSize=startSize*scale+"px";
}
});

/* ---------- DELETE ---------- */

function addDelete(el){
let btn=document.createElement("div");
btn.className="deleteBtn";
btn.innerHTML="✖";

btn.onclick=(e)=>{
e.stopPropagation();
saveState();
el.remove();
};

el.appendChild(btn);
}

/* ---------- TEMPLATE ---------- */

function uploadBG(e){
const r=new FileReader();
r.onload=()=>bg.src=r.result;
r.readAsDataURL(e.target.files[0]);
}

/* ---------- TEXT ---------- */

function addText(){
saveState();

let div=document.createElement("div");
div.className="element text";
div.innerText=textInput.value;
div.style.color=colorPicker.value;
div.style.left="50px";
div.style.top="50px";

div.onclick=()=>select(div);

addDelete(div);
canvas.appendChild(div);
}

/* ---------- IMAGE ---------- */

function addImage(e){
const r=new FileReader();
r.onload=()=>{
saveState();

let img=document.createElement("img");
img.src=r.result;
img.className="element dragImg";
img.style.left="50px";
img.style.top="50px";

img.onclick=()=>select(img);

addDelete(img);
canvas.appendChild(img);
};
r.readAsDataURL(e.target.files[0]);
}

/* ---------- DRAFT ---------- */

function saveDraft(){
const name=draftName.value;
if(!name) return alert("Enter name");

localStorage.setItem("draft_"+name,canvas.innerHTML);
loadList();
alert("Saved");
}

function loadList(){
draftList.innerHTML="<option>Load Draft</option>";
Object.keys(localStorage).forEach(k=>{
if(k.startsWith("draft_"))
draftList.innerHTML+=`<option>${k.replace("draft_","")}</option>`;
});
}

function loadDraft(){
canvas.innerHTML=localStorage.getItem("draft_"+draftList.value);
attachEvents();
}

/* ---------- PREVIEW ---------- */

function preview(){
html2canvas(canvas).then(c=>{
let w=window.open("");
w.document.body.appendChild(c);
});
}

/* ---------- DOWNLOAD ---------- */

function download(){
html2canvas(canvas).then(c=>{
let link=document.createElement("a");
link.download="invitation.png";
link.href=c.toDataURL();
link.click();
});
}

/* ---------- REATTACH EVENTS ---------- */

function attachEvents(){
document.querySelectorAll(".element").forEach(el=>{
el.onclick=()=>select(el);
});
}

loadList();

</script>
</body>
</html>
