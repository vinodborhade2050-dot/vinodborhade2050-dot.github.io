<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<title>Template Text Overlay Builder</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;700&family=Tiro+Devanagari+Marathi&family=Hind&display=swap" rel="stylesheet">

<style>
body{
    font-family: Arial;
    background:#eee;
    text-align:center;
}

/* CANVAS */
.card{
    width:1000px;
    height:1500px;
    margin:20px auto;
    position:relative;
    border:6px solid #444;
    background-size:cover;
}

/* TEXT */
.layer{
    position:absolute;
    transform:translate(-50%,-50%);
    font-size:36px;
    font-weight:bold;
    color:#000;
}

/* PANEL */
.controls{
    background:white;
    padding:20px;
    margin:20px;
    box-shadow:0 0 10px #ccc;
}

input{
    padding:6px;
    margin:5px;
    width:120px;
}

select{
    padding:6px;
}

button{
    padding:10px 20px;
    background:#333;
    color:white;
    border:none;
}
</style>
</head>

<body>

<div class="controls">

<h2>🖼️ Upload Template + Add Text</h2>

Upload Template:
<input type="file" id="templateUpload"><br><br>

Font:
<select id="fontSelect">
<option value="'Noto Serif Devanagari'">Classic Marathi</option>
<option value="'Tiro Devanagari Marathi'">Royal Marathi</option>
<option value="'Hind'">Simple Clean</option>
</select>

<hr>

<h3>Text + Position</h3>

Groom:
<input id="groomText" placeholder="Text">
Top<input id="gTop" value="500">
Left<input id="gLeft" value="500"><br>

Bride:
<input id="brideText" placeholder="Text">
Top<input id="bTop" value="600">
Left<input id="bLeft" value="500"><br>

Date:
<input id="dateText" placeholder="Text">
Top<input id="dTop" value="900">
Left<input id="dLeft" value="500"><br>

Venue:
<input id="venueText" placeholder="Text">
Top<input id="vTop" value="1000">
Left<input id="vLeft" value="500"><br><br>

<button onclick="updateCard()">Update</button>
<button onclick="window.print()">Download PDF</button>

</div>

<div class="card" id="card">

<div class="layer" id="groom"></div>
<div class="layer" id="bride"></div>
<div class="layer" id="date"></div>
<div class="layer" id="venue"></div>

</div>

<script>

/* TEMPLATE UPLOAD */
templateUpload.addEventListener("change", function(){
    const reader = new FileReader();
    reader.onload = e => {
        card.style.backgroundImage = `url(${e.target.result})`;
    }
    reader.readAsDataURL(this.files[0]);
});


function updateCard(){

    const font = fontSelect.value;

    // apply font
    document.querySelectorAll(".layer").forEach(el=>{
        el.style.fontFamily = font;
    });

    // text
    groom.innerText = groomText.value;
    bride.innerText = brideText.value;
    date.innerText = dateText.value;
    venue.innerText = venueText.value;

    // position
    groom.style.top = gTop.value + "px";
    groom.style.left = gLeft.value + "px";

    bride.style.top = bTop.value + "px";
    bride.style.left = bLeft.value + "px";

    date.style.top = dTop.value + "px";
    date.style.left = dLeft.value + "px";

    venue.style.top = vTop.value + "px";
    venue.style.left = vLeft.value + "px";
}

</script>

</body>
</html>
