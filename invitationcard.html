<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation Card Editor</title>

<style>

body{
    font-family:Arial;
    background:#f3f3f3;
    padding:15px;
}

.controls{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

button,input,select{
    padding:8px;
    margin:5px;
}

#canvas{
    position:relative;
    max-width:500px;
    margin:auto;
    border:3px dashed #ccc;
}

#bg{
    width:100%;
    display:block;
}

.element{
    position:absolute;
    cursor:move;
    user-select:none;
}

.text{
    font-size:28px;
    font-weight:bold;
}

.dragImg{
    width:120px;
}

</style>
</head>

<body>

<div class="controls">

<h3>📂 invitation Draft</h3>
<input id="draftName" placeholder="Draft Name">
<button onclick="saveDraft()">Save</button>

<select id="draftList" onchange="loadDraft()">
<option>Load Draft</option>
</select>

<hr>

<h3>🖼 Upload Template</h3>
<input type="file" onchange="uploadBG(event)">

<hr>

<h3>✍ Add Text</h3>
<input id="textInput" placeholder="Enter text">
<input type="color" id="colorPicker" value="#000000">
<button onclick="addText()">Add Text</button>

<hr>

<h3>📷 Add Image</h3>
<input type="file" onchange="addImage(event)">

</div>

<div id="canvas">
<img id="bg">
</div>

<script>

const canvas = document.getElementById("canvas");
const bg = document.getElementById("bg");

/* ---------- DRAG FUNCTION (Mobile + Desktop) ---------- */

function makeDraggable(el){

let startX=0,startY=0;

el.onpointerdown = e => {
    startX = e.clientX - el.offsetLeft;
    startY = e.clientY - el.offsetTop;
    el.setPointerCapture(e.pointerId);
};

el.onpointermove = e => {
    if(e.pressure===0) return;

    const rect = canvas.getBoundingClientRect();

    let x = e.clientX - rect.left - startX;
    let y = e.clientY - rect.top - startY;

    el.style.left = x + "px";
    el.style.top = y + "px";
};

}

/* ---------- TEMPLATE UPLOAD ---------- */

function uploadBG(e){
    const reader=new FileReader();
    reader.onload=()=>{
        bg.src=reader.result;
    }
    reader.readAsDataURL(e.target.files[0]);
}

/* ---------- ADD TEXT ---------- */

function addText(){

    const txt=document.getElementById("textInput").value;
    const color=document.getElementById("colorPicker").value;

    const div=document.createElement("div");
    div.className="element text";
    div.innerText=txt;
    div.style.color=color;
    div.style.left="50px";
    div.style.top="50px";

    canvas.appendChild(div);
    makeDraggable(div);
}

/* ---------- ADD IMAGE ---------- */

function addImage(e){

    const reader=new FileReader();

    reader.onload=()=>{
        const img=document.createElement("img");
        img.src=reader.result;
        img.className="element dragImg";
        img.style.left="50px";
        img.style.top="50px";

        canvas.appendChild(img);
        makeDraggable(img);
    }

    reader.readAsDataURL(e.target.files[0]);
}

/* ---------- SAVE DRAFT ---------- */

function saveDraft(){

    const name=document.getElementById("draftName").value;

    if(!name){
        alert("Enter draft name");
        return;
    }

    const data={
        bg:bg.src,
        html:canvas.innerHTML
    };

    localStorage.setItem("draft_"+name,JSON.stringify(data));

    loadDraftList();
    alert("Draft Saved");
}

/* ---------- LOAD LIST ---------- */

function loadDraftList(){

    const list=document.getElementById("draftList");
    list.innerHTML="<option>Load Draft</option>";

    Object.keys(localStorage).forEach(k=>{
        if(k.startsWith("draft_")){
            const name=k.replace("draft_","");
            list.innerHTML+=`<option>${name}</option>`;
        }
    });
}

/* ---------- LOAD DRAFT ---------- */

function loadDraft(){

    const name=document.getElementById("draftList").value;

    const data=JSON.parse(localStorage.getItem("draft_"+name));

    canvas.innerHTML=data.html;
    bg.src=data.bg;

    document.querySelectorAll(".element").forEach(makeDraggable);
}

/* INIT */
loadDraftList();

</script>

</body>
</html>
