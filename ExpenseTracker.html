<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker (Recurring)</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  padding: 15px;
}

.container {
  max-width: 420px;
  margin: auto;
  background: #fff;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

h2 {
  text-align: center;
}

input, select, button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  font-size: 16px;
}

.checkbox {
  display: flex;
  align-items: center;
  margin-top: 8px;
}

.checkbox input {
  width: auto;
  margin-right: 8px;
}

button {
  background: #1a73e8;
  color: white;
  border: none;
  border-radius: 6px;
}

.list {
  margin-top: 15px;
}

.item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #eef2f7;
  padding: 8px;
  margin-top: 6px;
  border-radius: 6px;
}

.recurring {
  font-size: 12px;
  color: green;
}

.delete-btn {
  background: #e53935;
  color: white;
  border: none;
  padding: 4px 8px;
  border-radius: 4px;
  cursor: pointer;
}

.total {
  margin-top: 12px;
  font-weight: bold;
  text-align: right;
}
</style>
</head>

<body>

<div class="container">
  <h2>Expense Tracker</h2>

  <input id="title" placeholder="Expense title">
  <input id="amount" type="number" placeholder="Amount">

  <select id="month"></select>
  <select id="year"></select>

  <div class="checkbox">
    <input type="checkbox" id="repeat">
    <label for="repeat">Repeat every month</label>
  </div>

  <button onclick="addExpense()">Add Expense</button>

  <div class="list" id="list"></div>
  <div class="total" id="total"></div>
</div>

<script>
const monthSelect = document.getElementById("month");
const yearSelect = document.getElementById("year");
const list = document.getElementById("list");
const totalDiv = document.getElementById("total");

const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
months.forEach((m,i)=>monthSelect.innerHTML += `<option value="${i}">${m}</option>`);

const currentYear = new Date().getFullYear();
for(let y=currentYear-5; y<=currentYear+5; y++){
  yearSelect.innerHTML += `<option value="${y}">${y}</option>`;
}

monthSelect.value = new Date().getMonth();
yearSelect.value = currentYear;

function key(y, m) {
  return `expense_${y}_${m}`;
}

function getData(y, m) {
  return JSON.parse(localStorage.getItem(key(y, m))) || [];
}

function saveData(y, m, data) {
  localStorage.setItem(key(y, m), JSON.stringify(data));
}

function addExpense() {
  const title = document.getElementById("title").value.trim();
  const amount = Number(document.getElementById("amount").value);
  const repeat = document.getElementById("repeat").checked;

  if (!title || amount <= 0) {
    alert("Enter valid details");
    return;
  }

  const y = yearSelect.value;
  const m = monthSelect.value;

  const data = getData(y, m);
  data.push({ title, amount, repeat });
  saveData(y, m, data);

  document.getElementById("title").value = "";
  document.getElementById("amount").value = "";
  document.getElementById("repeat").checked = false;

  loadExpenses();
}

function loadExpenses() {
  const y = Number(yearSelect.value);
  const m = Number(monthSelect.value);

  // Pull recurring from previous month
  const prevM = m === 0 ? 11 : m - 1;
  const prevY = m === 0 ? y - 1 : y;

  const current = getData(y, m);
  const previous = getData(prevY, prevM);

  previous.forEach(p => {
    if (p.repeat && !current.some(c => c.title === p.title)) {
      current.push({ ...p });
    }
  });

  saveData(y, m, current);

  list.innerHTML = "";
  let total = 0;

  current.forEach((e, i) => {
    total += e.amount;
    list.innerHTML += `
      <div class="item">
        <span>
          ${e.title}
          ${e.repeat ? '<div class="recurring">Recurring</div>' : ''}
        </span>
        <span>
          ₹${e.amount}
          <button class="delete-btn" onclick="deleteExpense(${i})">Delete</button>
        </span>
      </div>
    `;
  });

  totalDiv.innerText = "Total: ₹" + total;
}

function deleteExpense(index) {
  if (!confirm("Delete this expense?")) return;

  const data = getData(yearSelect.value, monthSelect.value);
  data.splice(index, 1);
  saveData(yearSelect.value, monthSelect.value, data);
  loadExpenses();
}

monthSelect.onchange = loadExpenses;
yearSelect.onchange = loadExpenses;

loadExpenses();
</script>

</body>
</html>
