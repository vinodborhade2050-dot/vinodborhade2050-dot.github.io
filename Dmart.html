<!DOCTYPE html>
<html>
<head>
  <title>Dmart Product Scanner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; padding: 15px; }
    input, button { padding: 8px; margin: 5px 0; width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: center; }
    th { background: #f2f2f2; }
    .delete-btn { background: red; color: white; border: none; padding: 5px; cursor: pointer; }
    .total-box { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>

<h2>Dmart Product Scanner</h2>

<label>Scan Barcode</label>
<input type="text" id="barcode" placeholder="Scan barcode here">

<label>Product Name</label>
<input type="text" id="name">

<label>Cost Price</label>
<input type="number" id="cost">

<label>Selling Price</label>
<input type="number" id="sell">

<label>Purchase Date</label>
<input type="date" id="date">

<button onclick="addProduct()">Add Product</button>

<table>
  <thead>
    <tr>
      <th>Barcode</th>
      <th>Name</th>
      <th>Qty</th>
      <th>Cost</th>
      <th>Selling</th>
      <th>Profit</th>
      <th>Date</th>
      <th>Delete</th>
    </tr>
  </thead>
  <tbody id="productList"></tbody>
</table>

<div class="total-box">
  Total Amount: ₹<span id="totalAmount">0</span><br>
  Total Profit: ₹<span id="totalProfit">0</span>
</div>

<script>
let products = JSON.parse(localStorage.getItem("products")) || [];

function saveData() {
  localStorage.setItem("products", JSON.stringify(products));
}

function addProduct() {
  let barcode = document.getElementById("barcode").value.trim();
  let name = document.getElementById("name").value.trim();
  let cost = parseFloat(document.getElementById("cost").value);
  let sell = parseFloat(document.getElementById("sell").value);
  let date = document.getElementById("date").value;

  if (!barcode || !name || !cost || !sell || !date) {
    alert("Fill all fields");
    return;
  }

  let existing = products.find(p => p.barcode === barcode);

  if (existing) {
    existing.qty += 1;
  } else {
    products.push({
      barcode,
      name,
      qty: 1,
      cost,
      sell,
      date
    });
  }

  saveData();
  renderTable();
  clearFields();
}

function renderTable() {
  let list = document.getElementById("productList");
  list.innerHTML = "";
  let totalAmount = 0;
  let totalProfit = 0;

  products.forEach((p, index) => {
    let profit = (p.sell - p.cost) * p.qty;
    totalAmount += p.sell * p.qty;
    totalProfit += profit;

    list.innerHTML += `
      <tr>
        <td>${p.barcode}</td>
        <td>${p.name}</td>
        <td>${p.qty}</td>
        <td>${p.cost}</td>
        <td>${p.sell}</td>
        <td>${profit.toFixed(2)}</td>
        <td>${p.date}</td>
        <td><button class="delete-btn" onclick="deleteProduct(${index})">X</button></td>
      </tr>
    `;
  });

  document.getElementById("totalAmount").innerText = totalAmount.toFixed(2);
  document.getElementById("totalProfit").innerText = totalProfit.toFixed(2);
}

function deleteProduct(index) {
  products.splice(index, 1);
  saveData();
  renderTable();
}

function clearFields() {
  document.getElementById("barcode").value = "";
  document.getElementById("name").value = "";
  document.getElementById("cost").value = "";
  document.getElementById("sell").value = "";
}

renderTable();
</script>

</body>
</html>
