<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Invitation Card Maker</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f2f2f2;
}

.toolbar{
  background:#fff;
  padding:10px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

button,select,input{
  padding:6px 8px;
}

.canvas{
  width:350px;
  height:500px;
  margin:20px auto;
  background:#fff;
  border:2px solid #ddd;
  position:relative;
  overflow:hidden;
  background-size:cover;
  background-position:center;
}

.textBox,.imgBox{
  position:absolute;
  min-width:60px;
  min-height:30px;
  cursor:move;
  border:1px dashed transparent;
  padding:4px;
}

.selected{
  border:1px dashed #000;
}

.guideH,.guideV{
  position:absolute;
  background:red;
  z-index:1000;
  display:none;
}

.guideH{
  height:1px;
  width:100%;
}

.guideV{
  width:1px;
  height:100%;
}
</style>
</head>

<body>

<div class="toolbar">

<button onclick="addText()">Add Text</button>

<input type="color" id="fontColor" onchange="changeColor()">

<button onclick="centerText()">Center Text</button>

<input type="file" onchange="uploadBackground(event)">

<input type="text" id="draftName" placeholder="Draft name">

<button onclick="saveDraft()">Save Draft</button>

<select id="draftList" onchange="loadDraft()">
<option value="">Load Draft</option>
</select>

</div>

<div class="canvas" id="canvas"></div>

<script>

const canvas=document.getElementById("canvas");
let selected=null;

/* ================= ADD TEXT ================= */

function addText(){
  const el=document.createElement("div");
  el.className="textBox";
  el.contentEditable=true;
  el.innerText="Edit Text";
  el.style.left="100px";
  el.style.top="100px";
  canvas.appendChild(el);
  setupDrag(el);
  select(el);
}

/* ================= SELECT ================= */

function select(el){
  document.querySelectorAll(".textBox,.imgBox").forEach(e=>e.classList.remove("selected"));
  selected=el;
  el.classList.add("selected");
}

/* ================= CHANGE COLOR ================= */

function changeColor(){
  if(selected){
    selected.style.color=document.getElementById("fontColor").value;
  }
}

/* ================= CENTER TEXT ================= */

function centerText(){
  if(selected){
    selected.style.textAlign="center";
  }
}

/* ================= UPLOAD BACKGROUND ================= */

function uploadBackground(e){
  const reader=new FileReader();
  reader.onload=function(event){
    canvas.style.backgroundImage=`url(${event.target.result})`;
  };
  reader.readAsDataURL(e.target.files[0]);
}

/* ================= DRAG ================= */

function setupDrag(el){

  el.onmousedown=function(e){
    select(el);

    const rect=canvas.getBoundingClientRect();
    const elRect=el.getBoundingClientRect();

    let offsetX=e.clientX-elRect.left;
    let offsetY=e.clientY-elRect.top;

    function move(ev){

      let x=ev.clientX-rect.left-offsetX;
      let y=ev.clientY-rect.top-offsetY;

      el.style.left=x+"px";
      el.style.top=y+"px";

      showGuides(el);
    }

    document.addEventListener("mousemove",move);

    document.addEventListener("mouseup",function(){
      document.removeEventListener("mousemove",move);
      hideGuides();
    },{once:true});
  };
}

/* ================= ALIGN GUIDES ================= */

let guideH=document.createElement("div");
guideH.className="guideH";
canvas.appendChild(guideH);

let guideV=document.createElement("div");
guideV.className="guideV";
canvas.appendChild(guideV);

function showGuides(el){

  const centerX=canvas.clientWidth/2;
  const centerY=canvas.clientHeight/2;

  const elRect=el.getBoundingClientRect();
  const canvasRect=canvas.getBoundingClientRect();

  const elCenterX=elRect.left-canvasRect.left+elRect.width/2;
  const elCenterY=elRect.top-canvasRect.top+elRect.height/2;

  if(Math.abs(elCenterX-centerX)<5){
    guideV.style.left=centerX+"px";
    guideV.style.display="block";
  }else{
    guideV.style.display="none";
  }

  if(Math.abs(elCenterY-centerY)<5){
    guideH.style.top=centerY+"px";
    guideH.style.display="block";
  }else{
    guideH.style.display="none";
  }
}

function hideGuides(){
  guideH.style.display="none";
  guideV.style.display="none";
}

/* ================= SAVE DRAFT ================= */

function saveDraft(){

  const name=document.getElementById("draftName").value;
  if(!name){
    alert("Enter draft name");
    return;
  }

  const elements=[];
  document.querySelectorAll(".textBox,.imgBox").forEach(el=>{
    elements.push({
      type:el.classList.contains("textBox")?"text":"img",
      html:el.innerHTML,
      left:el.style.left,
      top:el.style.top,
      color:el.style.color,
      align:el.style.textAlign
    });
  });

  const data={
    bg:canvas.style.backgroundImage,
    elements:elements
  };

  localStorage.setItem("draft_"+name,JSON.stringify(data));
  updateDraftList();
  alert("Draft saved successfully!");
}

/* ================= LOAD DRAFT ================= */

function loadDraft(){

  const name=document.getElementById("draftList").value;
  if(!name) return;

  const data=JSON.parse(localStorage.getItem("draft_"+name));
  if(!data) return;

  canvas.innerHTML="";
  canvas.style.backgroundImage=data.bg;

  data.elements.forEach(item=>{

    const el=document.createElement("div");
    el.className=item.type==="text"?"textBox":"imgBox";
    el.innerHTML=item.html;

    if(item.type==="text"){
      el.contentEditable=true;   // FIXED
    }

    el.style.left=item.left;
    el.style.top=item.top;
    el.style.color=item.color;
    el.style.textAlign=item.align;

    canvas.appendChild(el);
    setupDrag(el);
  });

  canvas.appendChild(guideH);
  canvas.appendChild(guideV);
}

/* ================= UPDATE DRAFT LIST ================= */

function updateDraftList(){

  const list=document.getElementById("draftList");
  list.innerHTML='<option value="">Load Draft</option>';

  Object.keys(localStorage).forEach(key=>{
    if(key.startsWith("draft_")){
      const name=key.replace("draft_","");
      const opt=document.createElement("option");
      opt.value=name;
      opt.textContent=name;
      list.appendChild(opt);
    }
  });
}

updateDraftList();

</script>

</body>
</html>
