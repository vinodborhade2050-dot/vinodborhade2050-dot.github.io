<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Card Builder</title>

<style>

@font-face {
    font-family: 'ganesha';
    src: url('fonts/ams-ganesha.ttf') format('truetype');
}

/* ===== PAGE ===== */
body{
    margin:0;
    font-family: Arial;
    background:#f5f5f5;
}

/* ===== TOOLBAR ===== */
.toolbar{
    padding:10px;
    background:#333;
    color:white;
    position:fixed;
    top:0;
    width:100%;
    z-index:999;
}

.toolbar button, select{
    padding:6px;
    margin:4px;
}

/* ===== CANVAS ===== */
#canvas{
    margin-top:90px; /* space for toolbar */
    padding:20px;
    text-align:center;
}

/* ===== CARD ===== */
.template{
    width:600px;
    height:850px;
    background:white;
    border:3px solid gold;
    margin:auto;
    position:relative;
}

/* ===== TEXT BOX ===== */
.text-box{
    position:absolute;
    padding:5px;
    cursor:move;
    font-size:22px;
    font-family:'ganesha';
    border:1px dashed transparent;
    user-select:none;
}

.text-box.active{
    border:1px dashed red;
}

.resize{
    width:10px;
    height:10px;
    background:red;
    position:absolute;
    right:-5px;
    bottom:-5px;
    cursor:se-resize;
}

</style>
</head>

<body>

<div class="toolbar">
    <button onclick="addText()">Add Text</button>
    <button onclick="saveDraft()">Save</button>
    <button onclick="clearDraft()">Clear</button>

    Font:
    <select id="fontSelect">
        <option value="ganesha">Marathi</option>
        <option value="Arial">Arial</option>
    </select>

    Size:
    <input type="range" min="16" max="80" value="22" id="sizeSlider">
</div>

<div id="canvas">
    <div class="template" id="template"></div>
</div>

<script>

let selected=null, offsetX, offsetY, resizing=false;

/* ADD TEXT */
function addText(){
    createBox({
        text:"Edit Text",
        left:100,
        top:100,
        font:"ganesha",
        size:22
    });
}

function createBox(d){
    let box=document.createElement("div");
    box.className="text-box";
    box.contentEditable=true;
    box.innerText=d.text;

    box.style.left=d.left+"px";
    box.style.top=d.top+"px";
    box.style.fontFamily=d.font;
    box.style.fontSize=d.size+"px";

    let r=document.createElement("div");
    r.className="resize";
    box.appendChild(r);

    template.appendChild(box);
    box.onclick=()=>select(box);
}

function select(b){
    document.querySelectorAll(".text-box").forEach(x=>x.classList.remove("active"));
    selected=b;
    b.classList.add("active");
}

/* DRAG */
document.addEventListener("mousedown",e=>{
    if(e.target.classList.contains("text-box")){
        select(e.target);
        offsetX=e.clientX-selected.offsetLeft;
        offsetY=e.clientY-selected.offsetTop;
    }
    if(e.target.classList.contains("resize")){
        resizing=true;
        selected=e.target.parentElement;
    }
});

document.addEventListener("mousemove",e=>{
    if(selected && !resizing && e.buttons===1){
        selected.style.left=(e.clientX-offsetX)+"px";
        selected.style.top=(e.clientY-offsetY)+"px";
    }
    if(resizing){
        selected.style.width=e.offsetX+"px";
        selected.style.height=e.offsetY+"px";
    }
});

document.addEventListener("mouseup",()=>resizing=false);

/* DELETE */
document.addEventListener("keydown",e=>{
    if(e.key==="Delete" && selected) selected.remove();
});

/* FONT SIZE */
fontSelect.onchange=()=>selected && (selected.style.fontFamily=fontSelect.value);
sizeSlider.oninput=()=>selected && (selected.style.fontSize=sizeSlider.value+"px");

/* SAVE DRAFT */
function saveDraft(){
    let data=[];
    document.querySelectorAll(".text-box").forEach(b=>{
        data.push({
            text:b.innerText,
            left:b.offsetLeft,
            top:b.offsetTop,
            font:b.style.fontFamily,
            size:parseInt(b.style.fontSize)
        });
    });
    localStorage.setItem("draft",JSON.stringify(data));
    alert("Saved");
}

/* LOAD */
function load(){
    let d=localStorage.getItem("draft");
    if(!d) return;
    JSON.parse(d).forEach(createBox);
}

function clearDraft(){
    localStorage.removeItem("draft");
    location.reload();
}

window.onload=load;

</script>

</body>
</html>
