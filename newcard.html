<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation Card Maker</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f3f3f3;
}

#toolbar{
  background:white;
  padding:8px;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
  position:sticky;
  top:0;
  z-index:1000;
}

#canvas{
  width:100%;
  max-width:400px;
  height:600px;
  margin:10px auto;
  background:#fff;
  position:relative;
  overflow:hidden;
  border-radius:12px;
  box-shadow:0 4px 15px rgba(0,0,0,0.15);
  background-size:cover;
  background-position:center;
}

.textBox, .imgBox{
  position:absolute;
  cursor:move;
  user-select:none;
  touch-action:none;
}

.selected{
  outline:2px dashed red;
}

.guide{
  position:absolute;
  background:red;
  z-index:999;
  pointer-events:none;
}

.guide.vertical{
  width:1px;
  height:100%;
}

.guide.horizontal{
  height:1px;
  width:100%;
}

.textBox{
  min-width:50px;
  text-align:center;
}
</style>
</head>

<body>

<div id="toolbar">

<button onclick="addText()">Add Text</button>
<input type="color" id="colorPicker">
<input type="number" id="fontSize" placeholder="Size" style="width:60px">
<button onclick="applyStyle()">Apply</button>

<button onclick="alignLeft()">Left</button>
<button onclick="alignCenter()">Center</button>
<button onclick="alignRight()">Right</button>

<input type="file" onchange="addImage(event)">

<input type="text" id="draftName" placeholder="Draft Name" style="width:100px">
<select id="draftList"></select>
<button onclick="saveDraft()">Save</button>
<button onclick="loadDraft()">Load</button>

</div>

<div id="canvas"></div>

<script>
const canvas = document.getElementById("canvas");
let selected = null;

/* ================= ADD TEXT ================= */
function addText(){
  const div=document.createElement("div");
  div.className="textBox";
  div.contentEditable=true;
  div.innerText="Your Text";
  div.style.top="200px";
  div.style.left="100px";
  div.style.fontSize="20px";
  div.style.color="#000";
  canvas.appendChild(div);
  setupElement(div);
}

/* ================= ADD IMAGE ================= */
function addImage(e){
  const reader=new FileReader();
  reader.onload=function(){
    const div=document.createElement("div");
    div.className="imgBox";
    div.style.top="150px";
    div.style.left="80px";
    div.innerHTML=`<img src="${reader.result}" style="width:150px">`;
    canvas.appendChild(div);
    setupElement(div);
  };
  reader.readAsDataURL(e.target.files[0]);
}

/* ================= SELECT ================= */
function selectElement(el){
  document.querySelectorAll(".textBox,.imgBox").forEach(e=>e.classList.remove("selected"));
  selected=el;
  el.classList.add("selected");
}

/* ================= MOVE WITH CENTER ================= */
function setupElement(el){

  let offsetX, offsetY;

  el.addEventListener("pointerdown", e=>{
    selectElement(el);
    const rect=el.getBoundingClientRect();
    offsetX = rect.width/2;
    offsetY = rect.height/2;
    el.setPointerCapture(e.pointerId);
  });

  el.addEventListener("pointermove", e=>{
    if(!el.hasPointerCapture(e.pointerId)) return;

    const canvasRect=canvas.getBoundingClientRect();

    let x=e.clientX - canvasRect.left - offsetX;
    let y=e.clientY - canvasRect.top - offsetY;

    el.style.left=x+"px";
    el.style.top=y+"px";

    showGuides(el);
  });

  el.addEventListener("pointerup", e=>{
    el.releasePointerCapture(e.pointerId);
    removeGuides();
  });

  /* Pinch resize */
  let startDist=0;

  el.addEventListener("touchstart", e=>{
    if(e.touches.length===2){
      startDist=getDistance(e.touches);
    }
  });

  el.addEventListener("touchmove", e=>{
    if(e.touches.length===2){
      const dist=getDistance(e.touches);
      const scale=dist/startDist;
      const img=el.querySelector("img");
      if(img){
        img.style.width=(img.offsetWidth*scale)+"px";
      }
      startDist=dist;
    }
  });
}

function getDistance(t){
  return Math.hypot(
    t[0].clientX - t[1].clientX,
    t[0].clientY - t[1].clientY
  );
}

/* ================= ALIGNMENT GUIDES ================= */
function showGuides(el){
  removeGuides();

  const rect=el.getBoundingClientRect();
  const canvasRect=canvas.getBoundingClientRect();

  const centerX = rect.left - canvasRect.left + rect.width/2;
  const centerY = rect.top - canvasRect.top + rect.height/2;

  document.querySelectorAll(".textBox,.imgBox").forEach(other=>{
    if(other===el) return;

    const r=other.getBoundingClientRect();
    const oCenterX=r.left - canvasRect.left + r.width/2;
    const oCenterY=r.top - canvasRect.top + r.height/2;

    if(Math.abs(centerX - oCenterX)<5){
      const v=document.createElement("div");
      v.className="guide vertical";
      v.style.left=oCenterX+"px";
      canvas.appendChild(v);
    }

    if(Math.abs(centerY - oCenterY)<5){
      const h=document.createElement("div");
      h.className="guide horizontal";
      h.style.top=oCenterY+"px";
      canvas.appendChild(h);
    }
  });
}

function removeGuides(){
  document.querySelectorAll(".guide").forEach(g=>g.remove());
}

/* ================= TEXT STYLE ================= */
function applyStyle(){
  if(!selected) return;
  selected.style.color=document.getElementById("colorPicker").value;
  const size=document.getElementById("fontSize").value;
  if(size) selected.style.fontSize=size+"px";
}

function alignLeft(){ if(selected) selected.style.textAlign="left"; }
function alignCenter(){ if(selected) selected.style.textAlign="center"; }
function alignRight(){ if(selected) selected.style.textAlign="right"; }

/* ================= DRAFT SYSTEM ================= */
function getDrafts(){
  return JSON.parse(localStorage.getItem("invDrafts")||"{}");
}

function saveDrafts(obj){
  localStorage.setItem("invDrafts",JSON.stringify(obj));
}

function saveDraft(){
  const name=document.getElementById("draftName").value.trim();
  if(!name){ alert("Enter draft name"); return;}

  const drafts=getDrafts();

  const data={
    bg:canvas.style.backgroundImage,
    elements:[]
  };

  document.querySelectorAll(".textBox,.imgBox").forEach(el=>{
    data.elements.push({
      type:el.classList.contains("textBox")?"text":"image",
      html:el.innerHTML,
      top:el.style.top,
      left:el.style.left,
      color:el.style.color,
      fontSize:el.style.fontSize,
      textAlign:el.style.textAlign,
      width:el.querySelector("img")?.style.width
    });
  });

  drafts[name]=data;
  saveDrafts(drafts);
  loadDraftList();
  alert("Saved ✅");
}

function loadDraft(){
  const name=document.getElementById("draftList").value;
  if(!name) return;

  const drafts=getDrafts();
  const data=drafts[name];
  if(!data) return;

  canvas.innerHTML="";
  canvas.style.backgroundImage=data.bg||"";

  data.elements.forEach(item=>{
    const el=document.createElement("div");
    el.className=item.type==="text"?"textBox":"imgBox";
    el.innerHTML=item.html;
    el.style.top=item.top;
    el.style.left=item.left;
    el.style.color=item.color;
    el.style.fontSize=item.fontSize;
    el.style.textAlign=item.textAlign;
    if(item.type==="image" && el.querySelector("img"))
      el.querySelector("img").style.width=item.width;

    canvas.appendChild(el);
    setupElement(el);
  });

  alert("Loaded ✅");
}

function loadDraftList(){
  const select=document.getElementById("draftList");
  select.innerHTML="";
  const drafts=getDrafts();
  for(let k in drafts){
    const opt=document.createElement("option");
    opt.value=k;
    opt.textContent=k;
    select.appendChild(opt);
  }
}

loadDraftList();
</script>

</body>
</html>
