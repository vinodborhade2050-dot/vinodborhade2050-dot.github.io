<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Invitation Editor PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Marathi:wght@400;700&family=Noto+Sans+Devanagari:wght@300;400;700&family=Noto+Serif+Devanagari:wght@400;700&family=Yatra+One&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body{margin:0;font-family:'Noto Sans Devanagari';background:#eee;}

.toolbar{
  background:white;padding:10px;display:flex;gap:10px;
  overflow:auto;box-shadow:0 2px 10px rgba(0,0,0,.1);
}

button{padding:8px 12px;border:none;background:#e57373;color:white;cursor:pointer;}

.canvas{
  width:500px;height:700px;margin:20px auto;
  background:#fff;position:relative;border-radius:12px;
  overflow:hidden;background-size:cover;background-position:center;
}

.textBox,.imgBox{
  position:absolute;
  cursor:move;
  padding:4px;
  user-select:none;
}

.textBox{
  font-size:24px;
  color:#000;
}

.imgBox img{
  width:150px;
}

.active{
  outline:2px dashed red;
}

/* Center Guide Lines */
.guideX,.guideY{
  position:absolute;
  background:red;
  pointer-events:none;
  display:none;
}
.guideX{width:100%;height:1px;}
.guideY{height:100%;width:1px;}
</style>
</head>

<body>

<div class="toolbar">
<input type="file" id="bgUpload" accept="image/*">
<button onclick="addText()">Add Text</button>
<input type="file" id="imgUpload" accept="image/*">

<input type="color" id="colorPicker" onchange="changeColor()">

<select id="fontPicker" onchange="changeFont()">
<option value="'Tiro Devanagari Marathi', serif">Traditional</option>
<option value="'Noto Serif Devanagari', serif">Wedding Classic</option>
<option value="'Yatra One', cursive">Decorative</option>
<option value="'Noto Sans Devanagari', sans-serif">Modern</option>
</select>

<input type="number" id="fontSize" placeholder="Font Size" onchange="changeFontSize()" style="width:90px">

<button onclick="saveDraft()">Save</button>
<button onclick="loadDraft()">Load</button>
<button onclick="clearDraft()">Clear</button>
<button onclick="downloadImage()">Download</button>
</div>

<div id="canvas" class="canvas">
<div class="guideX" id="guideX"></div>
<div class="guideY" id="guideY"></div>
</div>

<script>

let active=null;
const canvas=document.getElementById("canvas");
const guideX=document.getElementById("guideX");
const guideY=document.getElementById("guideY");

function select(el){
  document.querySelectorAll(".textBox,.imgBox").forEach(e=>e.classList.remove("active"));
  active=el;
  el.classList.add("active");

  if(el.classList.contains("textBox")){
    document.getElementById("fontSize").value=parseInt(window.getComputedStyle(el).fontSize);
    document.getElementById("colorPicker").value=rgbToHex(window.getComputedStyle(el).color);
  }
}

function addText(){
  const d=document.createElement("div");
  d.className="textBox";
  d.innerText="डबल क्लिक करून मजकूर बदला";
  d.style.top="100px";
  d.style.left="100px";
  d.style.color="#000";
  canvas.appendChild(d);
  setupElement(d);

  d.ondblclick=()=>{
    let t=prompt("Edit",d.innerText);
    if(t)d.innerText=t;
  };
}

imgUpload.onchange=e=>{
  const r=new FileReader();
  r.onload=()=>{
    const box=document.createElement("div");
    box.className="imgBox";
    const img=document.createElement("img");
    img.src=r.result;
    box.appendChild(img);
    box.style.top="120px";
    box.style.left="120px";
    canvas.appendChild(box);
    setupElement(box);
  };
  r.readAsDataURL(e.target.files[0]);
};

bgUpload.onchange=e=>{
  const r=new FileReader();
  r.onload=()=>canvas.style.backgroundImage=`url(${r.result})`;
  r.readAsDataURL(e.target.files[0]);
};

function setupElement(el){

  select(el);

  /* Desktop Drag */
  el.onmousedown=function(e){
    select(el);

    const rect=canvas.getBoundingClientRect();
    const elRect=el.getBoundingClientRect();

    let offsetX=e.clientX-elRect.left;
    let offsetY=e.clientY-elRect.top;

    function move(ev){
      let x=ev.clientX-rect.left-offsetX;
      let y=ev.clientY-rect.top-offsetY;

      el.style.left=x+"px";
      el.style.top=y+"px";

      showGuides(x,y,el);
    }

    document.addEventListener("mousemove",move);
    document.addEventListener("mouseup",()=>{
      document.removeEventListener("mousemove",move);
      hideGuides();
    },{once:true});
  };

  /* Mobile Drag + Pinch */
  let startDist=0,startWidth=0;

  el.addEventListener("touchstart",e=>{
    select(el);
    if(e.touches.length===2){
      startDist=getDistance(e.touches);
      if(el.classList.contains("imgBox"))
        startWidth=el.querySelector("img").offsetWidth;
    }
  });

  el.addEventListener("touchmove",e=>{
    e.preventDefault();

    const rect=canvas.getBoundingClientRect();

    if(e.touches.length===1){
      let x=e.touches[0].clientX-rect.left-50;
      let y=e.touches[0].clientY-rect.top-20;

      el.style.left=x+"px";
      el.style.top=y+"px";
      showGuides(x,y,el);
    }

    if(e.touches.length===2 && el.classList.contains("imgBox")){
      let newWidth=startWidth+(getDistance(e.touches)-startDist);
      el.querySelector("img").style.width=newWidth+"px";
    }
  });

  el.addEventListener("touchend",hideGuides);
}

function getDistance(t){
  return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
}

/* Alignment Guides */
function showGuides(x,y,el){
  const centerX=canvas.clientWidth/2;
  const centerY=canvas.clientHeight/2;

  if(Math.abs(x+el.offsetWidth/2-centerX)<5){
    guideY.style.left=centerX+"px";
    guideY.style.display="block";
  } else guideY.style.display="none";

  if(Math.abs(y+el.offsetHeight/2-centerY)<5){
    guideX.style.top=centerY+"px";
    guideX.style.display="block";
  } else guideX.style.display="none";
}

function hideGuides(){
  guideX.style.display="none";
  guideY.style.display="none";
}

/* Styling */
function changeColor(){
  if(active && active.classList.contains("textBox"))
    active.style.color=document.getElementById("colorPicker").value;
}

function changeFont(){
  if(active && active.classList.contains("textBox"))
    active.style.fontFamily=document.getElementById("fontPicker").value;
}

function changeFontSize(){
  if(active && active.classList.contains("textBox"))
    active.style.fontSize=document.getElementById("fontSize").value+"px";
}

/* Download Image */
function downloadImage(){
  html2canvas(canvas).then(canvasImg=>{
    const link=document.createElement("a");
    link.download="invitation.png";
    link.href=canvasImg.toDataURL();
    link.click();
  });
}

/* Draft System */
function saveDraft(){
  const data={
    bg:canvas.style.backgroundImage,
    elements:[]
  };

  document.querySelectorAll(".textBox,.imgBox").forEach(el=>{
    data.elements.push({
      type:el.classList.contains("textBox")?"text":"image",
      html:el.innerHTML,
      top:el.style.top,
      left:el.style.left,
      fontSize:el.style.fontSize,
      color:el.style.color,
      fontFamily:el.style.fontFamily,
      width:el.querySelector("img")?.style.width
    });
  });

  localStorage.setItem("invitationDraft",JSON.stringify(data));
  alert("Draft Saved");
}

function loadDraft(){
  const saved=localStorage.getItem("invitationDraft");
  if(!saved) return alert("No Draft Found");

  const data=JSON.parse(saved);
  canvas.innerHTML='<div class="guideX" id="guideX"></div><div class="guideY" id="guideY"></div>';
  canvas.style.backgroundImage=data.bg;

  data.elements.forEach(item=>{
    const el=document.createElement("div");
    el.className=item.type==="text"?"textBox":"imgBox";
    el.innerHTML=item.html;
    el.style.top=item.top;
    el.style.left=item.left;
    el.style.fontSize=item.fontSize;
    el.style.color=item.color;
    el.style.fontFamily=item.fontFamily;

    if(item.type==="image")
      el.querySelector("img").style.width=item.width;

    canvas.appendChild(el);
    setupElement(el);
  });

  alert("Draft Loaded");
}

function clearDraft(){
  localStorage.removeItem("invitationDraft");
  alert("Draft Cleared");
}

function rgbToHex(rgb){
  const result=rgb.match(/\d+/g);
  return "#"+((1<<24)+(parseInt(result[0])<<16)+(parseInt(result[1])<<8)+parseInt(result[2])).toString(16).slice(1);
}

</script>
</body>
</html>
