<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marathi Wedding Card Builder</title>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>

@font-face{
  font-family: ganesha;
  src:url("fonts/ganesha.ttf");
}

@font-face{
  font-family: matarani;
  src:url("fonts/matarani.ttf");
}

body{
  margin:0;
  font-family: Arial;
  background:#f3f3f3;
}

.controls{
  background:white;
  padding:10px;
  position:sticky;
  top:0;
  z-index:1000;
}

.controls input, select, button{
  width:100%;
  padding:10px;
  margin:6px 0;
  font-size:16px;
}

.card{
  width:95%;
  max-width:400px;
  margin:20px auto;
  border:2px solid #ccc;
  position:relative;
  background-size:contain;
  background-repeat:no-repeat;
  background-position:center;
  background-color:white;
  overflow:hidden;
  aspect-ratio:2/3;
}

.textBox{
  position:absolute;
  cursor:move;
  user-select:none;
  font-weight:bold;
  color:#000;
}

</style>
</head>

<body>

<div class="controls">

<label>Upload Card Template</label>
<input type="file" onchange="loadBackground(event)">

<label>Enter Marathi Text</label>
<input type="text" id="textInput" placeholder="उदा: शुभ विवाह">

<label>Select Font</label>
<select id="fontSelect">
  <option value="ganesha">Ganesha</option>
  <option value="matarani">Matarani</option>
  <option value="Arial">Arial</option>
</select>

<label>Font Size</label>
<input type="number" id="fontSize" value="28">

<button onclick="addText()">Add Text</button>
<button onclick="downloadCard()">Download Card</button>

</div>

<div id="card" class="card"></div>

<script>

function loadBackground(event){
  const reader = new FileReader();
  reader.onload = function(){
    const img = new Image();
    img.onload = function(){
      const card = document.getElementById("card");

      // Auto adjust card ratio to template
      card.style.aspectRatio = img.width + "/" + img.height;

      card.style.backgroundImage = "url("+reader.result+")";
    }
    img.src = reader.result;
  }
  reader.readAsDataURL(event.target.files[0]);
}

function addText(){
  const text = document.getElementById("textInput").value;
  if(!text) return;

  const font = document.getElementById("fontSelect").value;
  const size = document.getElementById("fontSize").value;

  const div = document.createElement("div");
  div.className="textBox";
  div.innerText = text;
  div.style.fontFamily = font;
  div.style.fontSize = size+"px";
  div.style.top = "50px";
  div.style.left = "50px";

  makeDraggable(div);

  document.getElementById("card").appendChild(div);
}

function makeDraggable(el){
  let pos1=0,pos2=0,pos3=0,pos4=0;

  el.onpointerdown = dragStart;

  function dragStart(e){
    e.preventDefault();
    pos3 = e.clientX;
    pos4 = e.clientY;
    document.onpointerup = stopDrag;
    document.onpointermove = drag;
  }

  function drag(e){
    e.preventDefault();
    pos1 = pos3 - e.clientX;
    pos2 = pos4 - e.clientY;
    pos3 = e.clientX;
    pos4 = e.clientY;
    el.style.top = (el.offsetTop - pos2) + "px";
    el.style.left = (el.offsetLeft - pos1) + "px";
  }

  function stopDrag(){
    document.onpointerup = null;
    document.onpointermove = null;
  }
}

function downloadCard(){
  html2canvas(document.getElementById("card")).then(canvas=>{
    const link = document.createElement("a");
    link.download = "marathi_wedding_card.png";
    link.href = canvas.toDataURL();
    link.click();
  });
}

</script>

</body>
</html>
