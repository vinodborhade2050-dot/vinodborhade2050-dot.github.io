<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Invitation Editor Stable</title>

<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Marathi:wght@400;700&family=Noto+Sans+Devanagari:wght@300;400;700&family=Noto+Serif+Devanagari:wght@400;700&family=Hind:wght@400;700&family=Yatra+One&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body{margin:0;font-family:'Noto Sans Devanagari';background:#eee;}

.toolbar{
  background:white;padding:10px;display:flex;
  gap:8px;flex-wrap:wrap;
  box-shadow:0 2px 10px rgba(0,0,0,.1);
}

button,input,select{
  padding:6px;border-radius:6px;border:1px solid #ccc;
}

button{
  background:#c62828;color:white;border:none;cursor:pointer;
}

.canvas{
  width:500px;height:700px;margin:20px auto;background:#ddd;
  position:relative;border-radius:12px;overflow:hidden;
  background-size:cover;background-position:center;
  touch-action:none;
}

.textBox,.imgBox{
  position:absolute;
  cursor:move;
  border:1px dashed transparent;
}

.textBox{
  font-size:30px;
  color:#000;
  padding:4px;
}

.imgBox img{
  width:150px;
  display:block;
}

.active{border-color:red;}

</style>
</head>

<body>

<div class="toolbar">

<input type="file" id="bgUpload" accept="image/*">
<input type="file" id="imgUpload" accept="image/*">
<button onclick="addText()">Add Text</button>

<input type="color" id="colorPicker" onchange="changeColor()">

<select id="fontPicker" onchange="changeFont()">
<option value="'Tiro Devanagari Marathi', serif">Traditional</option>
<option value="'Noto Serif Devanagari', serif">Classic</option>
<option value="'Hind', sans-serif">Bold</option>
<option value="'Yatra One', cursive">Decorative</option>
<option value="'Noto Sans Devanagari', sans-serif">Modern</option>
</select>

<input type="number" id="fontSizeInput" value="30" min="10" max="200" onchange="changeFontSize()">

<button onclick="saveDraft()">Save</button>
<button onclick="loadDraft()">Load</button>
<button onclick="downloadImage()">Download</button>

</div>

<div id="canvas" class="canvas"></div>

<script>

const canvas=document.getElementById("canvas");

let active=null,startDist=0,startWidth=0;

/* Background */
bgUpload.onchange=e=>{
 const r=new FileReader();
 r.onload=()=>canvas.style.backgroundImage=`url(${r.result})`;
 r.readAsDataURL(e.target.files[0]);
};

/* Add Text */
function addText(){
 const d=document.createElement("div");
 d.className="textBox";
 d.innerText="|| शुभ विवाह ||";
 d.style.left="100px";
 d.style.top="100px";
 d.style.fontFamily="'Tiro Devanagari Marathi'";
 canvas.appendChild(d);
 setupDrag(d);
 select(d);
}

/* Upload Image */
imgUpload.onchange=e=>{
 const r=new FileReader();
 r.onload=()=>{
   const box=document.createElement("div");
   box.className="imgBox";
   box.style.left="120px";
   box.style.top="120px";

   const img=document.createElement("img");
   img.src=r.result;
   box.appendChild(img);

   canvas.appendChild(box);
   setupDrag(box);
   setupPinchResize(box);
   select(box);
 };
 r.readAsDataURL(e.target.files[0]);
};

/* Select */
function select(el){
 document.querySelectorAll(".textBox,.imgBox")
   .forEach(e=>e.classList.remove("active"));
 active=el;
 el.classList.add("active");

 if(el.classList.contains("textBox")){
   fontSizeInput.value=parseInt(window.getComputedStyle(el).fontSize);
   colorPicker.value=rgbToHex(window.getComputedStyle(el).color);
 }
}

canvas.onclick=e=>{
 const el=e.target.closest(".textBox,.imgBox");
 if(el) select(el);
};

/* Drag */
function setupDrag(el){

 el.onmousedown=e=>{
   select(el);
   let offsetX=e.offsetX;
   let offsetY=e.offsetY;

   document.onmousemove=ev=>{
     el.style.left=(ev.pageX-offsetX)+"px";
     el.style.top=(ev.pageY-offsetY)+"px";
   };

   document.onmouseup=()=>document.onmousemove=null;
 };

}

/* Pinch Resize Image */
function setupPinchResize(el){

 el.addEventListener("touchstart",e=>{
   if(e.touches.length===2){
     startDist=getDistance(e.touches);
     startWidth=el.querySelector("img").offsetWidth;
   }
 });

 el.addEventListener("touchmove",e=>{
   if(e.touches.length===2){
     e.preventDefault();
     let newDist=getDistance(e.touches);
     let newWidth=startWidth+(newDist-startDist);
     if(newWidth>30)
       el.querySelector("img").style.width=newWidth+"px";
   }
 });

}

/* Helpers */
function getDistance(t){
 return Math.hypot(
   t[0].clientX-t[1].clientX,
   t[0].clientY-t[1].clientY
 );
}

/* Text Controls */
function changeColor(){
 if(active?.classList.contains("textBox"))
   active.style.color=colorPicker.value;
}

function changeFont(){
 if(active?.classList.contains("textBox"))
   active.style.fontFamily=fontPicker.value;
}

function changeFontSize(){
 if(active?.classList.contains("textBox"))
   active.style.fontSize=fontSizeInput.value+"px";
}

/* Download */
function downloadImage(){
 document.fonts.ready.then(()=>{
   html2canvas(canvas,{scale:2}).then(c=>{
     const link=document.createElement("a");
     link.download="invitation.png";
     link.href=c.toDataURL();
     link.click();
   });
 });
}

/* Save Draft */
function saveDraft(){
 const data={
   bg:canvas.style.backgroundImage,
   elements:[]
 };

 document.querySelectorAll(".textBox,.imgBox").forEach(el=>{
   const obj={
     type:el.classList.contains("textBox")?"text":"image",
     html:el.innerHTML,
     left:el.style.left,
     top:el.style.top,
     font:el.style.fontFamily,
     size:el.style.fontSize,
     color:window.getComputedStyle(el).color
   };

   if(obj.type==="image"){
     obj.width=el.querySelector("img").style.width;
   }

   data.elements.push(obj);
 });

 localStorage.setItem("draft",JSON.stringify(data));
 alert("Draft Saved ✅");
}

/* Load Draft */
function loadDraft(){

 const saved=localStorage.getItem("draft");
 if(!saved) return alert("No Draft Found");

 const data=JSON.parse(saved);
 canvas.innerHTML="";
 canvas.style.backgroundImage=data.bg;

 data.elements.forEach(item=>{
   const el=document.createElement("div");
   el.className=item.type==="text"?"textBox":"imgBox";
   el.innerHTML=item.html;
   el.style.left=item.left;
   el.style.top=item.top;
   el.style.fontFamily=item.font;
   el.style.fontSize=item.size;
   el.style.color=item.color;

   if(item.type==="image"){
     el.querySelector("img").style.width=item.width;
     setupPinchResize(el);
   }

   canvas.appendChild(el);
   setupDrag(el);
 });

 alert("Draft Loaded ✅");
}

/* RGB to HEX */
function rgbToHex(rgb){
 const nums=rgb.match(/\d+/g);
 return "#"+((1<<24)+(parseInt(nums[0])<<16)+(parseInt(nums[1])<<8)+parseInt(nums[2])).toString(16).slice(1);
}

</script>
</body>
</html>
