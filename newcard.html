<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marriage Invitation Builder</title>

<style>

@font-face {
    font-family: 'ganesha';
    src: url('fonts/ams-ganesha.ttf') format('truetype');
}

body{
    margin:0;
    font-family: Arial;
    background:#f5f5f5;
    overflow:hidden;
}

.toolbar{
    padding:10px;
    background:#333;
    color:white;
}

.toolbar button, select{
    padding:8px;
    margin-right:8px;
}

#canvas{
    width:100%;
    height:calc(100vh - 60px);
    display:flex;
    justify-content:center;
    align-items:center;
}

.template{
    width:600px;
    height:850px;
    background:white;
    position:relative;
    border:3px solid #caa94c;
    overflow:hidden;
}

.text-box{
    position:absolute;
    min-width:80px;
    min-height:30px;
    padding:5px;
    cursor:move;
    font-size:22px;
    font-family:'ganesha';
    border:1px dashed transparent;
    user-select:none;
}

.text-box.active{
    border:1px dashed red;
}

.resize{
    width:10px;
    height:10px;
    background:red;
    position:absolute;
    right:-5px;
    bottom:-5px;
    cursor:se-resize;
}

</style>
</head>

<body>

<div class="toolbar">
    <button onclick="addText()">Add Text</button>
    <button onclick="saveDraft()">💾 Save Draft</button>
    <button onclick="clearDraft()">🗑 Clear</button>

    Font:
    <select id="fontSelect">
        <option value="ganesha">Marathi Ganesha</option>
        <option value="Arial">Arial</option>
        <option value="Times New Roman">Times</option>
    </select>

    Size:
    <input type="range" min="16" max="80" value="22" id="sizeSlider">
</div>

<div id="canvas">
    <div class="template" id="template"></div>
</div>

<script>

let selected=null;
let offsetX, offsetY;
let resizing=false;

/* ===== Add Text ===== */
function addText(){
    createTextBox({
        text:"Edit Text",
        left:100,
        top:100,
        font:"ganesha",
        size:22
    });
}

/* ===== Create Text Box ===== */
function createTextBox(data){
    let box=document.createElement("div");
    box.className="text-box";
    box.contentEditable=true;
    box.innerText=data.text;

    box.style.left=data.left+"px";
    box.style.top=data.top+"px";
    box.style.fontFamily=data.font;
    box.style.fontSize=data.size+"px";

    let resize=document.createElement("div");
    resize.className="resize";
    box.appendChild(resize);

    document.getElementById("template").appendChild(box);

    box.onclick=()=>selectBox(box);
}

/* ===== Select ===== */
function selectBox(box){
    document.querySelectorAll(".text-box").forEach(e=>e.classList.remove("active"));
    selected=box;
    box.classList.add("active");
}

/* ===== Drag ===== */
document.addEventListener("mousedown", e=>{
    if(e.target.classList.contains("text-box")){
        selectBox(e.target);
        offsetX=e.clientX-selected.offsetLeft;
        offsetY=e.clientY-selected.offsetTop;
    }

    if(e.target.classList.contains("resize")){
        resizing=true;
        selected=e.target.parentElement;
    }
});

document.addEventListener("mousemove", e=>{
    if(selected && !resizing && e.buttons===1){
        selected.style.left=(e.clientX-offsetX)+"px";
        selected.style.top=(e.clientY-offsetY)+"px";
    }

    if(resizing){
        selected.style.width=e.offsetX+"px";
        selected.style.height=e.offsetY+"px";
    }
});

document.addEventListener("mouseup",()=>resizing=false);

/* ===== Delete ===== */
document.addEventListener("keydown", e=>{
    if(e.key==="Delete" && selected){
        selected.remove();
    }
});

/* ===== Font Change ===== */
fontSelect.onchange=()=>{
    if(selected) selected.style.fontFamily=fontSelect.value;
};

/* ===== Size ===== */
sizeSlider.oninput=()=>{
    if(selected) selected.style.fontSize=sizeSlider.value+"px";
};




/* ============================
   SAVE / LOAD DRAFT (JSON)
============================ */

function saveDraft(){

    let data=[];

    document.querySelectorAll(".text-box").forEach(box=>{
        data.push({
            text:box.innerText,
            left:box.offsetLeft,
            top:box.offsetTop,
            font:box.style.fontFamily,
            size:parseInt(box.style.fontSize)
        });
    });

    localStorage.setItem("weddingDraft",JSON.stringify(data));
    alert("Draft Saved ✅");
}


/* ===== Load Draft ===== */
function loadDraft(){

    let saved=localStorage.getItem("weddingDraft");
    if(!saved) return;

    JSON.parse(saved).forEach(createTextBox);
}

/* ===== Clear Draft ===== */
function clearDraft(){
    localStorage.removeItem("weddingDraft");
    location.reload();
}

/* ===== Auto Load on Page Open ===== */
window.onload=loadDraft;

</script>

</body>
</html>
