<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation Editor PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Marathi:wght@400;700&family=Noto+Sans+Devanagari:wght@300;400;700&family=Noto+Serif+Devanagari:wght@400;700&family=Yatra+One&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Marathi:wght@400;700&family=Noto+Sans+Devanagari:wght@300;400;700&family=Noto+Serif+Devanagari:wght@400;700&family=Yatra+One&family=Baloo+2:wght@400;600;800&family=Hind:wght@400;700&family=Mukta:wght@300;400;600;700&family=Rasa:wght@400;700&family=Kalapi&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Kalam:wght@300;400;700&family=Mukta+Vaani:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
  @font-face {
  font-family: 'Baloo2 ExtraBold';
  src: url('../fonts/Baloo2 ExtraBold.ttf') format('truetype');
  font-weight: 800; /* extra bold */
  font-style: normal;
}

  .textBox{
  text-align: center;
}

body{margin:0;font-family:'Noto Sans Devanagari';background:#eee;}

.toolbar{
  background:white;padding:10px;display:flex;gap:10px;
  overflow:auto;box-shadow:0 2px 10px rgba(0,0,0,.1);
}

button{
  padding:8px 12px;
  border:none;
  background:#e57373;
  color:white;
  cursor:pointer;
}

.canvas{
  width:500px;
  height:700px;
  margin:20px auto;
  background:#fff;
  position:relative;
  border-radius:12px;
  overflow:hidden;
  background-size:cover;
  background-position:center;
}

.textBox,.imgBox{
  position:absolute;
  cursor:move;
  padding:4px;
  user-select:none;
}

.textBox{
  font-size:24px;
  color:#000;
  min-width:100px;
  max-width:90%;
  word-wrap:break-word;
  white-space:normal;
  resize:none;
  position:absolute;
}

.resizeHandle{
  position:absolute;
  right:-6px;
  top:0;
  width:12px;
  height:100%;
  cursor:ew-resize;
  background:transparent;
}

.textBox.active .resizeHandle{
  background:rgba(255,0,0,0.3);
}


.imgBox img{
  width:150px;
}

.active{
  outline:2px dashed red;
}

.duplicateBtn{
  position:absolute;
  top:-10px;      /* slightly above the top edge */
  left:-10px;     /* slightly left outside */
  background:green;
  color:white;
  width:22px;
  height:22px;
  border-radius:50%;
  font-size:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  z-index:1000;
}


 
</style>
</head>

<body>

<div class="toolbar">

<input type="file" id="bgUpload" accept="image/*">
<button onclick="addText()">Add Text</button>
  

<input type="file" id="imgUpload" accept="image/*">

<input type="color" id="colorPicker" onchange="changeColor()">
<select id="fontPicker" onchange="changeFont()">
  <option value="'Baloo2 ExtraBold', cursive">Baloo 2 Extra Bold</option>
  <option value="'Tiro Devanagari Marathi', serif">Traditional</option>
  <option value="'Noto Serif Devanagari', serif">Wedding Classic</option> 
  <option value="'Yatra One', cursive">Decorative</option>
  <option value="'Noto Sans Devanagari', sans-serif">Modern</option>
  <option value="'Yatra One', cursive">Yatra One (Decor)</option>
  <option value="'Kalam', cursive">Kalam (Stylish)</option>
  <option value="'Mukta Vaani', sans-serif">Mukta Vaani (Soft)</option>

  <!-- readable but not decorative -->
  <option value="'Tiro Devanagari Marathi', serif">Tiro Marathi</option>
  <option value="'Noto Serif Devanagari', serif">Noto Serif Devanagari</option>
  <option value="'Noto Sans Devanagari', sans-serif">Noto Sans Devanagari</option>
  <option value="'Hind', sans-serif">Hind (Bold)</option>

  <option value="'Tiro Devanagari Marathi', serif">Traditional Marathi</option>
  <option value="'Noto Serif Devanagari', serif">Elegant Serif</option>
  <option value="'Yatra One', cursive">Decorative Script</option>
  <option value="'Baloo 2', cursive">Festival Style</option>
  <option value="'Mukta', sans-serif">Clean Body Text</option>
  <option value="'Hind', sans-serif">Bold Headings</option>
  <option value="'Kalapi', cursive">Handwritten</option>
  <option value="'Rasa', serif">Semi-Calligraphic</option>
  <option value="'Tangerine', serif">Fancy Cursive</option>
</select>

<input type="number" id="fontSize" placeholder="Font Size" onchange="changeFontSize()" style="width:90px">


<input type="text" id="draftName" placeholder="Draft Name" style="width:120px">

<select id="draftList"></select>

<button onclick="saveDraft()">Save</button>
<input type="file" id="loadDraftFile" accept=".json" onchange="loadDraftFromFile(event)">


<button onclick="downloadImage()">Download</button>

</div>

<div id="canvas" class="canvas"></div>

<script>
console.log("card");
  
let active=null;
const canvas=document.getElementById("canvas");
let selectedElement = null;

/* ================= SELECT ================= */

function select(el){ 
  document.querySelectorAll(".textBox,.imgBox") 
    .forEach(e=>{e.classList.remove("active");
                const oldBtn = e.querySelector(".deleteBtn");
      if(oldBtn) oldBtn.remove();} 
            );
  active=el; 
  el.classList.add("active"); 
  addDeleteButton(el);
  // Add Duplicate button (bottom-right)
  if(!el.querySelector(".duplicateBtn")){
    const dup = document.createElement("div");
    dup.className = "duplicateBtn";
    dup.innerHTML = "⧉"; // duplicate icon

    dup.onclick = function(e){
      e.stopPropagation();

      const clone = el.cloneNode(true);
      clone.style.top = (parseInt(el.style.top || 0) + 20) + "px";
      clone.style.left = (parseInt(el.style.left || 0) + 20) + "px";

      canvas.appendChild(clone);
      setupElement(clone); // make it movable/selectable
      
    };

    el.appendChild(dup);
  }
  selectedElement = el;
}
function addDeleteButton(el){

  // remove old button if exists
  let old = el.querySelector(".deleteBtn");
  if(old) old.remove();

  const btn = document.createElement("div");
  btn.className = "deleteBtn";
  btn.innerHTML = "✕";

  btn.style.position = "absolute";
  btn.style.top = "-12px";
  btn.style.right = "-12px";
  btn.style.width = "26px";
  btn.style.height = "26px";
  btn.style.background = "red";
  btn.style.color = "white";
  btn.style.borderRadius = "50%";
  btn.style.display = "flex";
  btn.style.alignItems = "center";
  btn.style.justifyContent = "center";
  btn.style.fontSize = "16px";
  btn.style.cursor = "pointer";
  btn.style.zIndex = "9999";
  btn.style.touchAction = "manipulation";

  // MOBILE FIX
  btn.addEventListener("touchstart", function(e){
    e.stopPropagation();
    e.preventDefault();
    el.remove();
    selectedElement = null;
  });

  btn.addEventListener("pointerdown", function(e){
    e.stopPropagation();
    e.preventDefault();

    el.remove();
    selectedElement = null;
});

  // DESKTOP SUPPORT
  btn.addEventListener("click", function(e){
    e.stopPropagation();
    el.remove();
    selectedElement = null;
  });

  el.appendChild(btn);
  canvas.addEventListener("click", function(e){
  if(!e.target.closest(".textBox,.imgBox")){
    document.querySelectorAll(".textBox,.imgBox")
      .forEach(el=>{el.classList.remove("active");
                   const btn = el.querySelector(".deleteBtn");
        if(btn) btn.remove();
                  const dup = el.querySelector(".duplicateBtn");
      if(dup) dup.remove();  
                   });
  }
});
}
function toggleBold(){

  if(!active) return;

  if(!active.classList.contains("textBox")) return;

  let weight = window.getComputedStyle(active).fontWeight;

  if(weight === "700" || weight === "bold"){
    active.style.fontWeight = "400";
  }else{
    active.style.fontWeight = "700";
  }

}


/* ================= ADD TEXT ================= */

function addText(){

  const d=document.createElement("div");
  d.className="textBox";
  d.contentEditable = true;
  d.innerText="डबल क्लिक करून मजकूर बदला";
  d.style.top="100px";
  d.style.left="100px";
  d.style.width="200px";
  d.style.color="#000";

  // Create resize handle
  const handle=document.createElement("div");
  handle.className="resizeHandle";
  d.appendChild(handle);

  canvas.appendChild(d);
  setupElement(d);

  d.ondblclick=()=>{
    let t=prompt("Edit",d.firstChild.textContent);
    if(t!==null) d.childNodes[0].textContent=t;
  };

  setupResize(d,handle);
}

function setupResize(box, handle){

  handle.addEventListener("mousedown", function(e){
    e.stopPropagation();

    let startX = e.clientX;
    let startWidth = box.offsetWidth;

    function resize(e2){
      let newWidth = startWidth + (e2.clientX - startX);
      if(newWidth > 50){
        box.style.width = newWidth + "px";
      }
    }

    document.addEventListener("mousemove", resize);
    document.addEventListener("mouseup", ()=>{
      document.removeEventListener("mousemove", resize);
    }, {once:true});
  });

  // Mobile
  handle.addEventListener("touchmove", function(e){
    e.stopPropagation();
    let touch = e.touches[0];
    let newWidth = touch.clientX - box.getBoundingClientRect().left;
    if(newWidth > 50){
      box.style.width = newWidth + "px";
    }
  });
}

/* ================= IMAGE ================= */

imgUpload.onchange=e=>{
  const r=new FileReader();
  r.onload=()=>{
    const box=document.createElement("div");
    box.className="imgBox";

    const img=document.createElement("img");
    img.src=r.result;

    box.appendChild(img);
    box.style.top="120px";
    box.style.left="120px";

    canvas.appendChild(box);
    setupElement(box);
  };
  r.readAsDataURL(e.target.files[0]);
};

/* ================= BACKGROUND ================= */

bgUpload.onchange=e=>{
  const r=new FileReader();
  r.onload=()=>{
    canvas.style.backgroundImage=`url(${r.result})`;
  };
  r.readAsDataURL(e.target.files[0]);
};

/* ================= DRAG (CENTERED) ================= */

function setupElement(el){
  // 🔥 CREATE RESIZE HANDLE IF NOT EXISTS
  let handle = el.querySelector(".resizeHandle");

  if(!handle){
    handle = document.createElement("div");
    handle.className = "resizeHandle";
    handle.style.width = "15px";
    handle.style.height = "15px";
    handle.style.position = "absolute";
    handle.style.right = "0";
    handle.style.bottom = "0";
    handle.style.background = "red";
    handle.style.cursor = "se-resize";

    el.appendChild(handle);
  }

  // 🔥 Setup resize
  setupResize(el, handle);
el.addEventListener("touchstart", function(e){

    select(el);
});

el.addEventListener("click", function(){
  select(el);
});

  

  /* ======================
     DESKTOP DRAG
  ====================== */
  el.onmousedown = function(e){
    select(el);

    const rect = canvas.getBoundingClientRect();
    const elRect = el.getBoundingClientRect();

    let offsetX = e.clientX - elRect.left;
    let offsetY = e.clientY - elRect.top;

    function move(ev){
      let x = ev.clientX - rect.left - offsetX;
      let y = ev.clientY - rect.top - offsetY;

      el.style.left = x + "px";
      el.style.top = y + "px";
    }

    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", function(){
      document.removeEventListener("mousemove", move);
    }, { once:true });
  };


  /* ======================
     MOBILE TOUCH SUPPORT
  ====================== */

  let startX, startY, startLeft, startTop;
  let initialDistance = null;
  let initialWidth = null;

  el.addEventListener("touchstart", function(e){

    select(el);

    // ONE FINGER MOVE
    if(e.touches.length === 1){
      const rect = canvas.getBoundingClientRect();

      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;

      startLeft = el.offsetLeft;
      startTop  = el.offsetTop;
    }

    // TWO FINGER PINCH
    if(e.touches.length === 2){
      initialDistance = getDistance(e.touches[0], e.touches[1]);

      if(el.querySelector("img")){
        initialWidth = el.querySelector("img").offsetWidth;
      } else {
        initialWidth = el.offsetWidth;
      }
    }

  }, { passive:false });


  el.addEventListener("touchmove", function(e){
    e.preventDefault();

    // MOVE
    if(e.touches.length === 1){
      let dx = e.touches[0].clientX - startX;
      let dy = e.touches[0].clientY - startY;

      el.style.left = startLeft + dx + "px";
      el.style.top  = startTop  + dy + "px";
    }

    // PINCH RESIZE
    if(e.touches.length === 2 && initialDistance){
      let newDistance = getDistance(e.touches[0], e.touches[1]);
      let scale = newDistance / initialDistance;

      let newWidth = initialWidth * scale;

      if(el.querySelector("img")){
        el.querySelector("img").style.width = newWidth + "px";
      } else {
        el.style.width = newWidth + "px";
      }
    }

  }, { passive:false });

}

function getDistance(touch1, touch2){
  let dx = touch2.clientX - touch1.clientX;
  let dy = touch2.clientY - touch1.clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

/* ================= STYLE ================= */

function changeColor(){
  if(active && active.classList.contains("textBox"))
    active.style.color=document.getElementById("colorPicker").value;
}

function changeFont(){
  if(active && active.classList.contains("textBox"))
    active.style.fontFamily=document.getElementById("fontPicker").value;
}

function changeFontSize(){
  if(active && active.classList.contains("textBox"))
    active.style.fontSize=document.getElementById("fontSize").value+"px";
}

function changeAlignment(val){
  if(active && active.classList.contains("textBox"))
    active.style.textAlign=val;
}

/* ================= DOWNLOAD IMAGE ================= */

function downloadImage(){
  html2canvas(canvas).then(c=>{
    const link=document.createElement("a");
    link.download="invitation.png";
    link.href=c.toDataURL();
    link.click();
  });
}

/* ================= MULTI DRAFT SYSTEM ================= */

function getAllDrafts(){
  return JSON.parse(localStorage.getItem("allInvitationDrafts") || "{}");
}

function saveAllDrafts(obj){
  localStorage.setItem("allInvitationDrafts", JSON.stringify(obj));
}
function saveDraft(){

  const name=document.getElementById("draftName").value.trim();

  if(!name){
    alert("Please enter draft name");
    return;
  }

  const data={
    bg:canvas.style.backgroundImage,
    elements:[]
  };
document.querySelectorAll(".textBox,.imgBox").forEach(el=>{

  
    let cleanHTML = el.cloneNode(true);
    cleanHTML.querySelectorAll(
  ".resizeHandle,.duplicateBtn,.deleteBtn"
).forEach(e => e.remove());

    data.elements.push({
      type:el.classList.contains("textBox")?"text":"image",
      html:cleanHTML.innerHTML,
      top:el.style.top,
      left:el.style.left,
      color:el.style.color,
      fontSize:el.style.fontSize,
      fontFamily:el.style.fontFamily,
      textAlign:el.style.textAlign,
      width:el.querySelector("img")?.style.width
    });
  });

  const blob = new Blob([JSON.stringify(data)], {type:"application/json"});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = name + ".json";
  link.click();

  alert("Draft Downloaded ✅");
}

function loadDraftFromFile(event){

  const file = event.target.files[0];
  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){
    const data = JSON.parse(e.target.result);
    applyDraft(data);
  };

  reader.readAsText(file);
}
  function applyDraft(data){

  // 🔥 Clear old elements
  document.querySelectorAll(".textBox,.imgBox").forEach(el=>el.remove());

  // 🔥 Restore background
  canvas.style.backgroundImage = data.bg || "";

  // 🔥 Recreate elements
  data.elements.forEach(item=>{

    let el;

    if(item.type === "text"){
      el = document.createElement("div");
      el.className = "textBox";
      el.innerHTML = item.html;
    }
    else{
      el = document.createElement("div");
      el.className = "imgBox";
      el.innerHTML = item.html;
    }

    el.style.top = item.top;
    el.style.left = item.left;
    el.style.color = item.color;
    el.style.fontSize = item.fontSize;
    el.style.fontFamily = item.fontFamily;
    el.style.textAlign = item.textAlign;

    canvas.appendChild(el);

    // 🔥 Re-enable drag + resize + duplicate
    setupElement(el);

  });

  }
function loadDraft(){

  const name=document.getElementById("draftList").value;

  if(!name){
    alert("Select Draft");
    return;
  }

  let drafts=getAllDrafts();
  if(!drafts[name]){
    alert("Draft Not Found");
    return;
  }

  const data=drafts[name];

  canvas.innerHTML="";
  canvas.style.backgroundImage=data.bg || "";

  data.elements.forEach(item=>{
    const el=document.createElement("div");
    el.className=item.type==="text"?"textBox":"imgBox";
    el.innerHTML=item.html;
    if(item.type==="text"){
    el.ondblclick = () => {
        let t = prompt("Edit", el.innerText);
        if(t !== null) el.innerText = t;
    };
}


    el.style.top=item.top;
    el.style.left=item.left;
    el.style.color=item.color;
    el.style.fontSize=item.fontSize;
    el.style.fontFamily=item.fontFamily;
    el.style.textAlign=item.textAlign;

    if(item.type==="image" && el.querySelector("img"))
      el.querySelector("img").style.width=item.width;

    canvas.appendChild(el);
    setupElement(el);
  });

  alert("Draft Loaded Successfully ✅");
}

function deleteDraft(){

  const name=document.getElementById("draftList").value;
  if(!name) return;

  let drafts=getAllDrafts();
  delete drafts[name];
  saveAllDrafts(drafts);

  loadDraftList();
}

function loadDraftList(){

  const select=document.getElementById("draftList");
  select.innerHTML="";

  let drafts=getAllDrafts();

  for(let key in drafts){
    let option=document.createElement("option");
    option.value=key;
    option.textContent=key;
    select.appendChild(option);
  }
}

loadDraftList();

</script>
</body>
</html>
