<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Invitation Editor PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Marathi:wght@400;700&family=Noto+Sans+Devanagari:wght@300;400;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

body{
  margin:0;
  font-family:'Noto Sans Devanagari';
  background:#eee;
}

.toolbar{
  background:white;
  padding:10px;
  display:flex;
  gap:10px;
  overflow:auto;
  box-shadow:0 2px 10px rgba(0,0,0,.1);
}

button{
  padding:8px 12px;
  border:none;
  background:#e57373;
  color:white;
  cursor:pointer;
}

.canvas{
  width:500px;
  height:700px;
  margin:20px auto;
  background:#ddd;
  position:relative;
  border-radius:12px;
  overflow:hidden;
  background-size:cover;
  background-position:center;
  touch-action:none;
}

.textBox,.imgBox{
  position:absolute;
  cursor:move;
  border:1px dashed transparent;
}

.textBox{
  font-size:24px;
  color:#000; /* default black */
  padding:4px;
}

.imgBox img{
  width:120px;
}

.active{
  border-color:red;
}

</style>
</head>

<body>

<div class="toolbar">

<input type="file" id="bgUpload" accept="image/*">
<button onclick="addText()">Add Text</button>
<input type="file" id="imgUpload" accept="image/*">

<input type="color" id="colorPicker" onchange="changeColor()">

<select id="fontPicker" onchange="changeFont()">
<option value="'Tiro Devanagari Marathi'">Traditional</option>
<option value="'Noto Sans Devanagari'">Modern</option>
</select>

<select id="weightPicker" onchange="changeWeight()">
<option value="300">Light</option>
<option value="400">Normal</option>
<option value="700">Bold</option>
</select>

<button onclick="saveDraft()">💾 Save</button>
<button onclick="loadDraft()">🔄 Load</button>
<button onclick="clearDraft()">🗑 Clear</button>

<button onclick="deleteElement()">Delete</button>
<button onclick="downloadImage()">Download Image</button>

</div>

<div id="canvas" class="canvas"></div>

<script>

let active=null,startDist=0,startSize=0;

/* Background Upload */
bgUpload.onchange=e=>{
  const r=new FileReader();
  r.onload=()=> canvas.style.backgroundImage=`url(${r.result})`;
  r.readAsDataURL(e.target.files[0]);
};

/* Add Text */
function addText(){
  const d=document.createElement("div");
  d.className="textBox";
  d.innerText="डबल क्लिक करून मजकूर बदला";
  d.style.top="100px"; 
  d.style.left="100px";
  d.style.color="#000"; // default black
  canvas.appendChild(d); 
  setupElement(d);

  d.ondblclick=()=>{
    let t=prompt("Edit",d.innerText); 
    if(t)d.innerText=t; 
  };
}

/* Upload Image */
imgUpload.onchange=e=>{
  const r=new FileReader();
  r.onload=()=>{
    const box=document.createElement("div");
    box.className="imgBox";
    const img=document.createElement("img");
    img.src=r.result; 
    box.appendChild(img);
    box.style.top="120px"; 
    box.style.left="120px";
    canvas.appendChild(box); 
    setupElement(box);
  };
  r.readAsDataURL(e.target.files[0]);
};

/* Selection */
function select(el){
  document.querySelectorAll(".textBox,.imgBox")
    .forEach(e=>e.classList.remove("active"));
  active=el; 
  el.classList.add("active");
}

canvas.onclick=e=>{
  const el=e.target.closest(".textBox,.imgBox");
  if(el) select(el);
};

/* Drag & Resize */
function setupElement(el){
  select(el);
  let offsetX,offsetY;

  el.addEventListener("touchstart",e=>{
    select(el);
    if(e.touches.length===1){
      offsetX=e.touches[0].clientX-el.offsetLeft;
      offsetY=e.touches[0].clientY-el.offsetTop;
    }
    if(e.touches.length===2){
      startDist=getDistance(e.touches);
      startSize=el.offsetWidth;
    }
  });

  el.addEventListener("touchmove",e=>{
    e.preventDefault();
    if(e.touches.length===1){
      el.style.left=(e.touches[0].clientX-offsetX)+"px";
      el.style.top=(e.touches[0].clientY-offsetY)+"px";
    }
    if(e.touches.length===2){
      let newSize=startSize+(getDistance(e.touches)-startDist);
      if(el.classList.contains("imgBox"))
        el.querySelector("img").style.width=newSize+"px";
      else
        el.style.fontSize=newSize/5+"px";
    }
  });

  el.onmousedown=e=>{
    select(el);
    offsetX=e.offsetX; 
    offsetY=e.offsetY;
    document.onmousemove=e=>{
      el.style.left=(e.pageX-offsetX)+"px";
      el.style.top=(e.pageY-offsetY)+"px";
    };
    document.onmouseup=()=>document.onmousemove=null;
  };
}

function getDistance(t){ 
  return Math.hypot(
    t[0].clientX-t[1].clientX,
    t[0].clientY-t[1].clientY
  ); 
}

/* Style Controls */
function changeColor(){
  if(active && active.classList.contains("textBox")){
    active.style.color = colorPicker.value;
  }
}

function changeFont(){
  if(active?.classList.contains("textBox"))
    active.style.fontFamily=fontPicker.value;
}

function changeWeight(){
  if(active?.classList.contains("textBox"))
    active.style.fontWeight=weightPicker.value;
}

/* Delete */
function deleteElement(){ 
  if(active) active.remove(); 
}

/* ================= IMAGE DOWNLOAD ================= */

function downloadImage(){
  html2canvas(canvas,{scale:2}).then(canvasImage=>{
    const link=document.createElement("a");
    link.download="invitation.png";
    link.href=canvasImage.toDataURL("image/png");
    link.click();
  });
}

/* ===================== DRAFT SAVE SYSTEM ===================== */

function saveDraft(){

  const data={
    bg: canvas.style.backgroundImage,
    elements:[]
  };

  document.querySelectorAll(".textBox,.imgBox").forEach(el=>{
    const item={
      type: el.classList.contains("textBox")?"text":"image",
      html: el.innerHTML,
      top: el.style.top,
      left: el.style.left,
      fontSize: el.style.fontSize,
      color: el.style.color,
      fontFamily: el.style.fontFamily,
      fontWeight: el.style.fontWeight,
      width: el.querySelector("img")?.style.width
    };
    data.elements.push(item);
  });

  localStorage.setItem("invitationDraft", JSON.stringify(data));
  alert("Draft Saved ✅");
}

function loadDraft(){

  const saved=localStorage.getItem("invitationDraft");
  if(!saved) return alert("No Draft Found");

  const data=JSON.parse(saved);
  canvas.innerHTML="";
  canvas.style.backgroundImage=data.bg;

  data.elements.forEach(item=>{
    const el=document.createElement("div");
    el.className=item.type==="text"?"textBox":"imgBox";
    el.innerHTML=item.html;
    el.style.top=item.top;
    el.style.left=item.left;
    el.style.fontSize=item.fontSize;
    el.style.color=item.color;
    el.style.fontFamily=item.fontFamily;
    el.style.fontWeight=item.fontWeight;

    if(item.type==="image")
      el.querySelector("img").style.width=item.width;

    canvas.appendChild(el);
    setupElement(el);
  });

  alert("Draft Loaded ✅");
}

function clearDraft(){
  localStorage.removeItem("invitationDraft");
  alert("Draft Cleared");
}

</script>
</body>
</html>
