<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation Editor PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Marathi:wght@400;700&family=Noto+Sans+Devanagari:wght@300;400;700&family=Noto+Serif+Devanagari:wght@400;700&family=Yatra+One&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body{margin:0;font-family:'Noto Sans Devanagari';background:#eee;}

.toolbar{
  background:white;padding:10px;display:flex;gap:10px;
  overflow:auto;box-shadow:0 2px 10px rgba(0,0,0,.1);
}

button{padding:8px 12px;border:none;background:#e57373;color:white;cursor:pointer;}

.canvas{
  width:500px;height:700px;margin:20px auto;
  background:#fff;position:relative;border-radius:12px;
  overflow:hidden;background-size:cover;background-position:center;
}

.textBox,.imgBox{
  position:absolute;
  cursor:move;
  padding:4px;
  user-select:none;
}

.textBox{
  font-size:24px;
  color:#000;
  min-width:100px;
}

.imgBox img{ width:150px; }

.active{ outline:2px dashed red; }

.guideX,.guideY{
  position:absolute;background:red;pointer-events:none;display:none;
}
.guideX{width:100%;height:1px;}
.guideY{height:100%;width:1px;}
</style>
</head>

<body>

<div class="toolbar">
<input type="file" id="bgUpload" accept="image/*">
<button onclick="addText()">Add Text</button>
<input type="file" id="imgUpload" accept="image/*">

<input type="color" id="colorPicker" onchange="changeColor()">

<select id="fontPicker" onchange="changeFont()">
<option value="'Tiro Devanagari Marathi', serif">Traditional</option>
<option value="'Noto Serif Devanagari', serif">Wedding Classic</option>
<option value="'Yatra One', cursive">Decorative</option>
<option value="'Noto Sans Devanagari', sans-serif">Modern</option>
</select>

<input type="number" id="fontSize" placeholder="Font Size" onchange="changeFontSize()" style="width:90px">

<select onchange="changeAlignment(this.value)">
<option value="left">Left</option>
<option value="center">Center</option>
<option value="right">Right</option>
</select>

<select id="draftList"></select>
<button onclick="saveDraft()">Save</button>
<button onclick="loadDraft()">Load</button>
<button onclick="deleteDraft()">Delete Draft</button>

<button onclick="downloadImage()">Download</button>
</div>

<div id="canvas" class="canvas">
<div class="guideX" id="guideX"></div>
<div class="guideY" id="guideY"></div>
</div>

<script>

let active=null;
const canvas=document.getElementById("canvas");
const guideX=document.getElementById("guideX");
const guideY=document.getElementById("guideY");

/* ---------- SELECT ---------- */
function select(el){
  document.querySelectorAll(".textBox,.imgBox").forEach(e=>e.classList.remove("active"));
  active=el;
  el.classList.add("active");
}

/* ---------- ADD TEXT ---------- */
function addText(){
  const d=document.createElement("div");
  d.className="textBox";
  d.innerText="डबल क्लिक करून मजकूर बदला";
  d.style.top="100px";
  d.style.left="100px";
  d.style.color="#000";
  canvas.appendChild(d);
  setupElement(d);

  d.ondblclick=()=>{
    let t=prompt("Edit",d.innerText);
    if(t)d.innerText=t;
  };
}

/* ---------- IMAGE ---------- */
imgUpload.onchange=e=>{
  const r=new FileReader();
  r.onload=()=>{
    const box=document.createElement("div");
    box.className="imgBox";
    const img=document.createElement("img");
    img.src=r.result;
    box.appendChild(img);
    box.style.top="120px";
    box.style.left="120px";
    canvas.appendChild(box);
    setupElement(box);
  };
  r.readAsDataURL(e.target.files[0]);
};

/* ---------- BACKGROUND ---------- */
bgUpload.onchange=e=>{
  const r=new FileReader();
  r.onload=()=>canvas.style.backgroundImage=`url(${r.result})`;
  r.readAsDataURL(e.target.files[0]);
};

/* ---------- DRAG ---------- */
function setupElement(el){

  select(el);

  el.onmousedown=function(e){
    select(el);

    const rect=canvas.getBoundingClientRect();
    const elRect=el.getBoundingClientRect();

    let offsetX=e.clientX-elRect.left;
    let offsetY=e.clientY-elRect.top;

    function move(ev){
      let x=ev.clientX-rect.left-offsetX;
      let y=ev.clientY-rect.top-offsetY;
      el.style.left=x+"px";
      el.style.top=y+"px";
    }

    document.addEventListener("mousemove",move);
    document.addEventListener("mouseup",()=>{
      document.removeEventListener("mousemove",move);
    },{once:true});
  };
}

/* ---------- STYLE CONTROLS ---------- */
function changeColor(){
  if(active && active.classList.contains("textBox"))
    active.style.color=document.getElementById("colorPicker").value;
}

function changeFont(){
  if(active && active.classList.contains("textBox"))
    active.style.fontFamily=document.getElementById("fontPicker").value;
}

function changeFontSize(){
  if(active && active.classList.contains("textBox"))
    active.style.fontSize=document.getElementById("fontSize").value+"px";
}

function changeAlignment(val){
  if(active && active.classList.contains("textBox"))
    active.style.textAlign=val;
}

/* ---------- DOWNLOAD ---------- */
function downloadImage(){
  html2canvas(canvas).then(c=>{
    const link=document.createElement("a");
    link.download="invitation.png";
    link.href=c.toDataURL();
    link.click();
  });
}

/* ---------- MULTI DRAFT SYSTEM (FIXED) ---------- */

function saveDraft(){
  let name=prompt("Draft Name?");
  if(!name) return;

  const data={
    bg:canvas.style.backgroundImage,
    elements:[]
  };

  document.querySelectorAll(".textBox,.imgBox").forEach(el=>{
    data.elements.push({
      type:el.classList.contains("textBox")?"text":"image",
      html:el.innerHTML,
      top:el.style.top,
      left:el.style.left,
      color:el.style.color,
      fontSize:el.style.fontSize,
      fontFamily:el.style.fontFamily,
      textAlign:el.style.textAlign,
      width:el.querySelector("img")?.style.width
    });
  });

  localStorage.setItem("draft_"+name,JSON.stringify(data));
  loadDraftList();
  alert("Draft Saved");
}

function loadDraft(){
  const name=document.getElementById("draftList").value;
  if(!name) return alert("Select Draft");

  const saved=localStorage.getItem("draft_"+name);
  if(!saved) return alert("Draft Not Found");

  const data=JSON.parse(saved);

  canvas.innerHTML="";
  canvas.style.backgroundImage=data.bg;

  data.elements.forEach(item=>{
    const el=document.createElement("div");
    el.className=item.type==="text"?"textBox":"imgBox";
    el.innerHTML=item.html;
    el.style.top=item.top;
    el.style.left=item.left;
    el.style.color=item.color;
    el.style.fontSize=item.fontSize;
    el.style.fontFamily=item.fontFamily;
    el.style.textAlign=item.textAlign;

    if(item.type==="image")
      el.querySelector("img").style.width=item.width;

    canvas.appendChild(el);
    setupElement(el);
  });

  alert("Draft Loaded");
}

function deleteDraft(){
  const name=document.getElementById("draftList").value;
  if(!name) return;
  localStorage.removeItem("draft_"+name);
  loadDraftList();
}

function loadDraftList(){
  const select=document.getElementById("draftList");
  select.innerHTML="";
  for(let i=0;i<localStorage.length;i++){
    let key=localStorage.key(i);
    if(key.startsWith("draft_")){
      let option=document.createElement("option");
      option.value=key.replace("draft_","");
      option.textContent=key.replace("draft_","");
      select.appendChild(option);
    }
  }
}

loadDraftList();

</script>
</body>
</html>
