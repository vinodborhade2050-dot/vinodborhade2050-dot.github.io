<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Card Editor</title>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
@font-face{
  font-family: ganesha;
  src:url("fonts/ganesha.ttf");
}
@font-face{
  font-family: matarani;
  src:url("fonts/matarani.ttf");
}

body{margin:0;font-family:Arial;background:#eee;}

.controls{
  background:white;
  padding:10px;
  position:sticky;
  top:0;
  z-index:1000;
}

.controls input,select,button{
  width:100%;padding:10px;margin:5px 0;
}

.card{
  width:95%;
  max-width:400px;
  margin:20px auto;
  border:2px solid #ccc;
  position:relative;
  background-size:contain;
  background-repeat:no-repeat;
  background-position:center;
  background-color:white;
  overflow:hidden;
  aspect-ratio:2/3;
}

.textBox{
  position:absolute;
  cursor:move;
  font-weight:bold;
  user-select:none;
}

.selected{
  border:2px dashed red;
}
</style>
</head>

<body>

<div class="controls">

<input type="file" onchange="loadBackground(event)">
<input type="text" id="textInput" placeholder="Type Marathi text">

<select id="fontSelect">
<option value="ganesha">Ganesha</option>
<option value="matarani">Matarani</option>
<option value="Arial">Arial</option>
</select>

<input type="number" id="fontSize" value="30">

<button onclick="addText()">Add Text</button>
<button onclick="deleteText()">Delete Selected</button>
<button onclick="downloadCard()">Download</button>

</div>

<div id="card" class="card"></div>

<script>

let selected = null;

function loadBackground(e){
 let reader=new FileReader();
 reader.onload=function(){
   let img=new Image();
   img.onload=function(){
     card.style.aspectRatio=img.width+"/"+img.height;
     card.style.backgroundImage="url("+reader.result+")";
   }
   img.src=reader.result;
 }
 reader.readAsDataURL(e.target.files[0]);
}

function addText(){
 let div=document.createElement("div");
 div.className="textBox";
 div.innerText=textInput.value;
 div.style.fontFamily=fontSelect.value;
 div.style.fontSize=fontSize.value+"px";
 div.style.top="100px";
 div.style.left="100px";

 enableSelect(div);
 enableDrag(div);
 enablePinch(div);

 card.appendChild(div);
}

function enableSelect(el){
 el.onclick=function(e){
   e.stopPropagation();
   if(selected) selected.classList.remove("selected");
   selected=el;
   el.classList.add("selected");
 }
}

card.onclick=function(){
 if(selected) selected.classList.remove("selected");
 selected=null;
}

function deleteText(){
 if(selected){
   selected.remove();
   selected=null;
 }
}

function enableDrag(el){
 let startX,startY;

 el.addEventListener("touchstart",e=>{
   if(e.touches.length==1){
     startX=e.touches[0].clientX-el.offsetLeft;
     startY=e.touches[0].clientY-el.offsetTop;
   }
 });

 el.addEventListener("touchmove",e=>{
   if(e.touches.length==1 && selected===el){
     el.style.left=e.touches[0].clientX-startX+"px";
     el.style.top=e.touches[0].clientY-startY+"px";
   }
 });

 // Desktop
 el.onmousedown=function(e){
   startX=e.clientX-el.offsetLeft;
   startY=e.clientY-el.offsetTop;

   document.onmousemove=function(e){
     if(selected===el){
       el.style.left=e.clientX-startX+"px";
       el.style.top=e.clientY-startY+"px";
     }
   }

   document.onmouseup=function(){
     document.onmousemove=null;
   }
 }
}

function enablePinch(el){
 let initialDistance,initialSize;

 el.addEventListener("touchstart",e=>{
   if(e.touches.length==2){
     initialDistance=getDistance(e);
     initialSize=parseFloat(window.getComputedStyle(el).fontSize);
   }
 });

 el.addEventListener("touchmove",e=>{
   if(e.touches.length==2 && selected===el){
     let newDistance=getDistance(e);
     let scale=newDistance/initialDistance;
     el.style.fontSize=(initialSize*scale)+"px";
   }
 });
}

function getDistance(e){
 let dx=e.touches[0].clientX-e.touches[1].clientX;
 let dy=e.touches[0].clientY-e.touches[1].clientY;
 return Math.sqrt(dx*dx+dy*dy);
}

function downloadCard(){
 html2canvas(card).then(canvas=>{
   let link=document.createElement("a");
   link.download="card.png";
   link.href=canvas.toDataURL();
   link.click();
 });
}

</script>

</body>
</html>
