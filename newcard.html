<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<title>Invitation Card Designer</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Noto Sans Devanagari';
  background:#f5f5f5;
  text-align:center;
}

#canvas{
  width:800px;
  height:1100px;
  margin:auto;
  border:3px dashed #aaa;
  background-size:cover;
  position:relative;
  overflow:hidden;
}

.draggable{
  position:absolute;
  cursor:move;
  padding:5px;
  border:1px dashed transparent;
  user-select:none;
}

.draggable:hover{
  border-color:#333;
}

.resizer{
  width:12px;
  height:12px;
  background:black;
  position:absolute;
  right:-6px;
  bottom:-6px;
  cursor:se-resize;
}

.controls{
  margin:10px;
}
</style>
</head>

<body>

<h2>🎉 Invitation Card Designer</h2>

<div class="controls">
Upload Template:
<input type="file" id="bgUpload">

Upload Image:
<input type="file" id="imgUpload">

<button onclick="addText()">Add Text</button>

<br><br>

Font Size:
<input type="number" id="fontSize" value="30">

Color:
<input type="color" id="fontColor" value="#000000">

Weight:
<select id="fontWeight">
<option value="300">Light</option>
<option value="400">Normal</option>
<option value="600">Semi Bold</option>
<option value="700">Bold</option>
<option value="900">Extra Bold</option>
</select>

<button onclick="applyStyle()">Apply Style</button>

<br><br>

<button onclick="saveDraft()">💾 Save Draft</button>
<button onclick="loadDraft()">📂 Load Draft</button>
</div>

<div id="canvas"></div>

<script>
let selected=null;

// BACKGROUND UPLOAD
bgUpload.onchange = e=>{
  const reader = new FileReader();
  reader.onload = ev=>{
    canvas.style.backgroundImage=`url(${ev.target.result})`;
  }
  reader.readAsDataURL(e.target.files[0]);
}

// ADD TEXT
function addText(){
  const div=document.createElement("div");
  div.className="draggable";
  div.contentEditable=true;
  div.innerText="इथे मजकूर लिहा";
  div.style.fontSize="30px";
  div.style.color="#000000";

  makeDraggable(div);
  addResizer(div);

  canvas.appendChild(div);
}

// IMAGE UPLOAD
imgUpload.onchange=e=>{
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=document.createElement("img");
    img.src=ev.target.result;
    img.className="draggable";
    img.style.width="150px";

    makeDraggable(img);
    addResizer(img);

    canvas.appendChild(img);
  }
  reader.readAsDataURL(e.target.files[0]);
}

// STYLE APPLY FIXED
function applyStyle(){
  if(!selected) return;

  selected.style.fontSize=fontSize.value+"px";
  selected.style.color=fontColor.value;
  selected.style.fontWeight=fontWeight.value;
}

// DRAG LOGIC
function makeDraggable(el){
  el.onclick=()=> selected=el;

  let offsetX,offsetY;

  el.onmousedown=e=>{
    offsetX=e.offsetX;
    offsetY=e.offsetY;

    document.onmousemove=ev=>{
      el.style.left=(ev.pageX-canvas.offsetLeft-offsetX)+"px";
      el.style.top=(ev.pageY-canvas.offsetTop-offsetY)+"px";
    }

    document.onmouseup=()=> document.onmousemove=null;
  }
}

// RESIZE
function addResizer(el){
  const res=document.createElement("div");
  res.className="resizer";
  el.appendChild(res);

  res.onmousedown=e=>{
    e.stopPropagation();

    document.onmousemove=ev=>{
      el.style.width=ev.pageX-el.offsetLeft+"px";
    }

    document.onmouseup=()=> document.onmousemove=null;
  }
}

// SAVE MULTIPLE DRAFTS
function saveDraft(){
  const name=prompt("Enter Draft Name:");
  if(!name) return;

  localStorage.setItem("draft_"+name, canvas.innerHTML);
  alert("Draft Saved!");
}

// LOAD DRAFT
function loadDraft(){
  let drafts=[];
  for(let key in localStorage){
    if(key.startsWith("draft_")) drafts.push(key.replace("draft_",""));
  }

  const name=prompt("Available Drafts:\n"+drafts.join("\n")+"\n\nEnter name:");
  if(!name) return;

  canvas.innerHTML=localStorage.getItem("draft_"+name);

  // Reattach drag
  document.querySelectorAll(".draggable").forEach(el=>{
    makeDraggable(el);
    addResizer(el);
  });
}
</script>

</body>
</html>
