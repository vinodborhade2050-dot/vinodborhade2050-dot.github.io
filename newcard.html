<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Invitation Editor PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Marathi&family=Noto+Sans+Devanagari&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

body{
  margin:0;
  font-family:'Noto Sans Devanagari';
  background:#eee;
}

.toolbar{
  background:white;
  padding:10px;
  display:flex;
  gap:10px;
  overflow:auto;
  box-shadow:0 2px 10px rgba(0,0,0,.1);
}

button{
  padding:8px 12px;
  border:none;
  background:#e57373;
  color:white;
  cursor:pointer;
}

.canvas{
  width:500px;
  height:700px;
  margin:20px auto;
  background:#ddd;
  position:relative;
  border-radius:12px;
  overflow:hidden;
  background-size:cover;
  background-position:center;
  touch-action:none;
}

.textBox, .imgBox{
  position:absolute;
  cursor:move;
  border:1px dashed transparent;
}

.textBox{
  font-size:24px;
  color:#fff;
  padding:4px;
}

.imgBox img{
  width:120px;
  height:auto;
}

.active{
  border-color:red;
}

</style>
</head>

<body>

<div class="toolbar">

<input type="file" id="bgUpload" accept="image/*">
<button onclick="addText()">Add Text</button>
<input type="file" id="imgUpload" accept="image/*">

<input type="color" id="colorPicker" onchange="changeColor()">

<select id="fontPicker" onchange="changeFont()">
<option value="'Tiro Devanagari Marathi'">Traditional</option>
<option value="'Noto Sans Devanagari'">Modern</option>
</select>

<button onclick="deleteElement()">Delete</button>
<button onclick="downloadPDF()">Download</button>

</div>

<div id="canvas" class="canvas"></div>

<script>

let active=null;
let startDist=0;
let startSize=0;

/* Background Upload */
bgUpload.onchange=e=>{
  const r=new FileReader();
  r.onload=()=> canvas.style.backgroundImage=`url(${r.result})`;
  r.readAsDataURL(e.target.files[0]);
};

/* Add Text */
function addText(){
  const d=document.createElement("div");
  d.className="textBox";
  d.innerText="डबल क्लिक करून मजकूर बदला";
  d.style.top="100px";
  d.style.left="100px";

  canvas.appendChild(d);
  setupElement(d);

  d.ondblclick=()=>{
    let t=prompt("Edit Text",d.innerText);
    if(t) d.innerText=t;
  };
}

/* Upload Image Element */
imgUpload.onchange=e=>{
  const r=new FileReader();
  r.onload=()=>{
    const box=document.createElement("div");
    box.className="imgBox";

    const img=document.createElement("img");
    img.src=r.result;

    box.appendChild(img);
    box.style.top="120px";
    box.style.left="120px";

    canvas.appendChild(box);
    setupElement(box);
  };
  r.readAsDataURL(e.target.files[0]);
};

/* Setup drag + resize */
function setupElement(el){

  select(el);

  let offsetX,offsetY;

  el.addEventListener("touchstart",e=>{
    select(el);

    if(e.touches.length===1){
      offsetX=e.touches[0].clientX-el.offsetLeft;
      offsetY=e.touches[0].clientY-el.offsetTop;
    }

    if(e.touches.length===2){
      startDist=getDistance(e.touches);
      startSize=el.offsetWidth;
    }
  });

  el.addEventListener("touchmove",e=>{
    e.preventDefault();

    if(e.touches.length===1){
      el.style.left=(e.touches[0].clientX-offsetX)+"px";
      el.style.top=(e.touches[0].clientY-offsetY)+"px";
    }

    if(e.touches.length===2){
      let newDist=getDistance(e.touches);
      let newSize=startSize+(newDist-startDist);

      if(el.classList.contains("imgBox")){
        el.querySelector("img").style.width=newSize+"px";
      } else {
        el.style.fontSize=newSize/5+"px";
      }
    }
  });

  el.onmousedown=e=>{
    select(el);
    offsetX=e.offsetX;
    offsetY=e.offsetY;

    document.onmousemove=e=>{
      el.style.left=(e.pageX-offsetX)+"px";
      el.style.top=(e.pageY-offsetY)+"px";
    };

    document.onmouseup=()=>document.onmousemove=null;
  };
}

/* Select */
function select(el){
  document.querySelectorAll(".textBox,.imgBox")
  .forEach(e=>e.classList.remove("active"));
  active=el;
  el.classList.add("active");
}

/* Click select */
canvas.onclick=e=>{
  if(e.target.closest(".textBox,.imgBox")){
    select(e.target.closest(".textBox,.imgBox"));
  }
};

/* Distance helper */
function getDistance(t){
  return Math.sqrt(
    Math.pow(t[0].clientX-t[1].clientX,2)+
    Math.pow(t[0].clientY-t[1].clientY,2)
  );
}

/* Color */
function changeColor(){
  if(active && active.classList.contains("textBox"))
    active.style.color=colorPicker.value;
}

/* Font */
function changeFont(){
  if(active && active.classList.contains("textBox"))
    active.style.fontFamily=fontPicker.value;
}

/* Delete */
function deleteElement(){
  if(active) active.remove();
}

/* Download */
function downloadPDF(){
  html2pdf().from(canvas).save("invitation.pdf");
}

</script>
</body>
</html>
