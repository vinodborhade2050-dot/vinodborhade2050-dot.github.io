<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yearly Interest Investment Calculator</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    padding: 10px;
}

.container {
    max-width: 100%;
    background: #fff;
    padding: 12px;
    border-radius: 10px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
}

h2 {
    text-align: center;
    margin-bottom: 10px;
}

label {
    font-weight: bold;
    display: block;
    margin-top: 8px;
}

input {
    width: 100%;
    padding: 7px;
    margin-top: 4px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    margin-top: 12px;
    padding: 10px;
    font-size: 16px;
    background: #00796b;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
    font-size: 13px;
}

th, td {
    border: 1px solid #ddd;
    padding: 6px;
    text-align: right;
}

th {
    background: #e0f2f1;
}

td:first-child, th:first-child {
    text-align: center;
}

.summary {
    margin-top: 12px;
    background: #eef7f6;
    padding: 10px;
    border-radius: 8px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
<h2>Yearly Interest Investment</h2>

<label>Initial Monthly Amount (₹)</label>
<input type="number" id="monthly" value="5000">

<label>Number of Years</label>
<input type="number" id="years" value="10">

<label>Yearly Step-Up (₹ per month)</label>
<input type="number" id="stepup" value="1000">

<label>Annual Interest Rate (%)</label>
<input type="number" id="rate" value="10">

<button onclick="calculate()">Generate Table</button>

<div id="output"></div>
</div>

<script>
function calculate() {

    let monthly = Number(document.getElementById("monthly").value);
    let years = Number(document.getElementById("years").value);
    let stepup = Number(document.getElementById("stepup").value);
    let rate = Number(document.getElementById("rate").value) / 100;

    let totalInvested = 0;
    let balance = 0;

    let html = `
    <table>
        <tr>
            <th>Year</th>
            <th>Monthly (₹)</th>
            <th>Yearly Invested (₹)</th>
            <th>Interest (₹)</th>
            <th>End Balance (₹)</th>
        </tr>`;

    for (let y = 1; y <= years; y++) {

        let yearlyInvestment = monthly * 12;
        totalInvested += yearlyInvestment;

        balance += yearlyInvestment;
        let interest = balance * rate;
        balance += interest;

        html += `
        <tr>
            <td>${y}</td>
            <td>${monthly.toLocaleString()}</td>
            <td>${yearlyInvestment.toLocaleString()}</td>
            <td>${Math.round(interest).toLocaleString()}</td>
            <td>${Math.round(balance).toLocaleString()}</td>
        </tr>`;

        monthly += stepup; // yearly step-up
    }

    html += `</table>
    <div class="summary">
        Total Invested: ₹ ${totalInvested.toLocaleString()} <br>
        Final Value: ₹ ${Math.round(balance).toLocaleString()} <br>
        Total Gain: ₹ ${Math.round(balance - totalInvested).toLocaleString()}
    </div>`;

    document.getElementById("output").innerHTML = html;
}
</script>

</body>
</html>
