<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation Card Maker</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Noto Serif Devanagari', serif;
  background:#f6f4f1;
}

/* Header */
.header{
  background:#8b0000;
  color:white;
  padding:14px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
}

/* Category Menu */
.category-menu{
  background:white;
  display:flex;
  gap:15px;
  padding:10px;
  overflow-x:auto;
  border-bottom:1px solid #ddd;
}

.category-menu button{
  background:#eee;
  border:none;
  padding:8px 15px;
  border-radius:20px;
  font-size:14px;
  cursor:pointer;
}

.category-menu button.active{
  background:#8b0000;
  color:white;
}

/* Template Section */
.template-section{
  padding:10px;
  background:#fff;
  overflow-x:auto;
  display:flex;
  gap:10px;
  border-bottom:1px solid #ddd;
}

.template-card{
  min-width:100px;
  height:140px;
  background:#ddd;
  border-radius:10px;
  cursor:pointer;
  overflow:hidden;
  border:2px solid transparent;
}

.template-card img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.template-card:hover{
  border-color:#8b0000;
}

/* Toolbar */
.toolbar{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:10px;
  background:white;
  border-bottom:1px solid #ddd;
}

.tool-btn{
  min-width:85px;
  padding:8px;
  border:none;
  background:#8b0000;
  color:white;
  border-radius:8px;
  font-size:13px;
  cursor:pointer;
}

/* Canvas Area */
.editor-area{
  display:flex;
  justify-content:center;
  padding:15px;
}

.canvas-wrapper{
  background:white;
  padding:10px;
  border-radius:12px;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

#canvas{
  width:550px;
  height:800px;
  background:white;
  position:relative;
  overflow:hidden;
  border:1px solid #ccc;
}

/* Responsive */
@media(max-width:600px){
  #canvas{
    width:95vw;
    height:calc(95vw * 1.45);
  }
}

</style>
</head>
<body>

<div class="header">
  Invitation Card Maker
</div>

<!-- Category Menu -->
<div class="category-menu">
  <button class="active">Wedding Templates</button>
  <button>Birthday Templates</button>
  <button>Engagement</button>
  <button>Baby Shower</button>
</div>

<!-- Template Preview Scroll -->
<div class="template-section">

  <div class="template-card">
    <img src="https://picsum.photos/200/300?1">
  </div>

  <div class="template-card">
    <img src="https://picsum.photos/200/300?2">
  </div>

  <div class="template-card">
    <img src="https://picsum.photos/200/300?3">
  </div>

  <div class="template-card">
    <img src="https://picsum.photos/200/300?4">
  </div>

</div>

<!-- Design Tools -->
<div class="toolbar">
  <button class="tool-btn" onclick="addText()">Text</button>
  <button class="tool-btn" onclick="bgUpload.click()">Background</button>
  <button class="tool-btn" onclick="imgUpload.click()">Image</button>
  <button class="tool-btn" onclick="saveDraft()">Save</button>
  <button class="tool-btn" onclick="downloadImage()">Download</button>
</div>

<!-- Canvas -->
<div class="editor-area">
  <div class="canvas-wrapper">
    <div id="canvas"></div>
  </div>
</div>

<input type="file" id="bgUpload" hidden>
<input type="file" id="imgUpload" hidden>

<script>
function addText(){ alert("Attach text logic"); }
function saveDraft(){ alert("Attach save logic"); }
function downloadImage(){ alert("Attach download logic"); }
</script>

</body>
</html>
