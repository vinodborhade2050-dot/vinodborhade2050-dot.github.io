<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Invitation Maker</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Noto+Serif+Devanagari&family=Yatra+One&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#f7f3ef;
  font-family:'Noto Serif Devanagari', serif;
}

/* Header */
.header{
  background:#8b0000;
  color:white;
  padding:12px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
}

/* Toolbar */
.toolbar{
  background:white;
  padding:10px;
  display:flex;
  gap:10px;
  overflow-x:auto;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  z-index:100;
}

.tool-btn{
  min-width:90px;
  padding:8px;
  border-radius:8px;
  border:none;
  background:#8b0000;
  color:white;
  font-size:13px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.tool-btn span{
  font-size:18px;
}

/* Canvas Area */
.editor-area{
  display:flex;
  justify-content:center;
  padding:15px;
}

.canvas-wrapper{
  background:white;
  padding:10px;
  border-radius:12px;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

#canvas{
  width:550px;
  height:800px;
  background:white;
  position:relative;
  overflow:hidden;
  border:1px solid #ddd;
}

/* Responsive */
@media(max-width:600px){
  #canvas{
    width:95vw;
    height:calc(95vw * 1.45);
  }
}

</style>
</head>
<body>

<div class="header">
  Wedding Invitation Card Maker
</div>

<!-- Design Tools Above Canvas -->
<div class="toolbar">

  <button class="tool-btn" onclick="addText()">
    <span>✍</span>
    Text
  </button>

  <button class="tool-btn" onclick="document.getElementById('bgUpload').click()">
    <span>🖼</span>
    Background
  </button>

  <button class="tool-btn" onclick="document.getElementById('imgUpload').click()">
    <span>📷</span>
    Image
  </button>

  <button class="tool-btn" onclick="changeColor()">
    <span>🎨</span>
    Color
  </button>

  <button class="tool-btn" onclick="changeFont()">
    <span>🔤</span>
    Font
  </button>

  <button class="tool-btn" onclick="saveDraft()">
    <span>💾</span>
    Save
  </button>

  <button class="tool-btn" onclick="downloadImage()">
    <span>⬇</span>
    Download
  </button>

</div>

<!-- Canvas Section -->
<div class="editor-area">
  <div class="canvas-wrapper">
    <div id="canvas"></div>
  </div>
</div>

<input type="file" id="bgUpload" accept="image/*" hidden>
<input type="file" id="imgUpload" accept="image/*" hidden>

<script>
function addText(){ alert("Connect your addText logic"); }
function changeColor(){ alert("Connect color logic"); }
function changeFont(){ alert("Connect font logic"); }
function saveDraft(){ alert("Connect save logic"); }
function downloadImage(){ alert("Connect download logic"); }
</script>

</body>
</html>
