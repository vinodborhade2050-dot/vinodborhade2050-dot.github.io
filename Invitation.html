<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InviteCraft - Invitation Maker</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
body{
    font-family:'Poppins',sans-serif;
    margin:0;
    background:#f4f6fb;
}

/* Layout */
.container{
    display:flex;
    flex-wrap:wrap;
}

/* Sidebar */
.sidebar{
    flex:1;
    min-width:300px;
    background:white;
    padding:20px;
    box-shadow:2px 0 10px rgba(0,0,0,0.05);
}

.sidebar h2{
    margin-bottom:15px;
}

input{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    border-radius:5px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:12px;
    background:#e91e63;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:600;
}

/* Preview Area */
.preview-area{
    flex:2;
    padding:30px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.invitation{
    width:350px;
    height:500px;
    background:linear-gradient(135deg,#ffdde1,#ee9ca7);
    border-radius:15px;
    padding:30px;
    text-align:center;
    position:relative;
    color:#333;
    box-shadow:0 20px 40px rgba(0,0,0,0.15);
}

.invitation h1{
    font-family:'Great Vibes',cursive;
    font-size:32px;
}

.invitation p{
    margin:8px 0;
}

.footer-text{
    position:absolute;
    bottom:20px;
    width:100%;
}

/* Mobile */
@media(max-width:768px){
    .container{
        flex-direction:column;
    }
    .preview-area{
        padding:20px;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="sidebar">
    <h2>Fill Invitation Details</h2>

    <input type="text" id="groom" placeholder="Groom Name" oninput="updatePreview()">
    <input type="text" id="bride" placeholder="Bride Name" oninput="updatePreview()">
    <input type="text" id="date" placeholder="Wedding Date" oninput="updatePreview()">
    <input type="text" id="time" placeholder="Time" oninput="updatePreview()">
    <input type="text" id="venue" placeholder="Venue" oninput="updatePreview()">

    <button onclick="downloadImage()">Download Invitation</button>
</div>

<div class="preview-area">
    <div class="invitation" id="invitationCard">
        <h1 id="previewNames">Bride & Groom</h1>
        <p>Request the pleasure of your company</p>
        <p id="previewDate">Date</p>
        <p id="previewTime">Time</p>
        <p id="previewVenue">Venue</p>

        <div class="footer-text">
            <p>With Blessings</p>
        </div>
    </div>
</div>

</div>

<script>
function updatePreview(){
    document.getElementById("previewNames").innerText =
        document.getElementById("bride").value + " & " +
        document.getElementById("groom").value;

    document.getElementById("previewDate").innerText =
        document.getElementById("date").value;

    document.getElementById("previewTime").innerText =
        document.getElementById("time").value;

    document.getElementById("previewVenue").innerText =
        document.getElementById("venue").value;
}

function downloadImage(){
    html2canvas(document.getElementById("invitationCard")).then(canvas=>{
        let link = document.createElement("a");
        link.download = "invitation.png";
        link.href = canvas.toDataURL();
        link.click();
    });
}
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</body>
</html>
