<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Password Saver</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { font-family: Arial; background:#f4f4f4; padding:15px }
.card { background:#fff; padding:15px; margin-bottom:10px; border-radius:8px }
input, button { width:100%; padding:8px; margin:5px 0 }
button { background:#007bff; color:#fff; border:none; border-radius:5px }
.delete { background:#dc3545 }
.toggle { background:#6c757d }
</style>
</head>

<body>

<h2>🔐 Password Saver</h2>

<div class="card">
  <input id="title" placeholder="Title (e.g. Gmail)">
  <input id="user" placeholder="Username / ID">
  <input id="pass" placeholder="Password">
  <button onclick="save()">Save</button>
</div>

<div id="list"></div>

<script>
let passwords = JSON.parse(localStorage.getItem("passwords")) || [];

function save() {
  const t = title.value.trim();
  const u = user.value.trim();
  const p = pass.value.trim();

  if (!t || !u || !p) {
    alert("Fill all fields");
    return;
  }

  passwords.push({ t, u, p });
  localStorage.setItem("passwords", JSON.stringify(passwords));

  title.value = user.value = pass.value = "";
  render();
}

function del(i) {
  passwords.splice(i,1);
  localStorage.setItem("passwords", JSON.stringify(passwords));
  render();
}

function render() {
  list.innerHTML = "";
  passwords.forEach((x,i)=>{
    list.innerHTML += `
      <div class="card">
        <b>${x.t}</b><br>
        👤 ${x.u}<br>
        🔑 <span id="p${i}" style="display:none">${x.p}</span>
        <button class="toggle" onclick="toggle(${i})">Show / Hide</button>
        <button class="delete" onclick="del(${i})">Delete</button>
      </div>
    `;
  });
}

function toggle(i) {
  const el = document.getElementById("p"+i);
  el.style.display = el.style.display === "none" ? "inline" : "none";
}

render();
</script>

</body>
</html>
