<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loan Repayment Schedule</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    padding: 15px;
  }
  h2 {
    text-align: center;
  }
  .box {
    background: #fff;
    padding: 15px;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    max-width: 1000px;
    margin: auto;
  }
  label {
    font-weight: bold;
    display: block;
    margin-top: 10px;
  }
  input, button {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    font-size: 16px;
  }
  button {
    background: #007bff;
    color: #fff;
    border: none;
    border-radius: 6px;
    margin-top: 15px;
  }
  .summary {
    margin-top: 20px;
    background: #eef5ff;
    padding: 10px;
    border-radius: 6px;
    font-size: 15px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    font-size: 14px;
  }
  th, td {
    border: 1px solid #ccc;
    padding: 6px;
    text-align: right;
  }
  th {
    background: #007bff;
    color: white;
  }
  td:first-child, th:first-child {
    text-align: center;
  }
</style>
</head>

<body>

<div class="box">
<h2>Loan Repayment Schedule</h2>

<label>Outstanding Amount (₹)</label>
<input type="number" id="outstanding" placeholder="e.g. 994658">

<label>Interest Rate (% per annum)</label>
<input type="number" step="0.01" id="rate" placeholder="e.g. 7.65">

<label>EMI Amount (₹)</label>
<input type="number" id="emi" placeholder="e.g. 18000">

<label>Start Date</label>
<input type="date" id="startDate">

<button onclick="generateSchedule()">Generate Schedule</button>

<div id="summary"></div>
<div id="result"></div>
</div>

<script>
function generateSchedule() {

  let balance = parseFloat(document.getElementById("outstanding").value);
  let rate = parseFloat(document.getElementById("rate").value) / 12 / 100;
  let emi = parseFloat(document.getElementById("emi").value);
  let date = new Date(document.getElementById("startDate").value);

  if (!balance || !rate || !emi || isNaN(date)) {
    alert("Please fill all fields");
    return;
  }

  let totalInterest = 0;
  let totalPrincipal = 0;
  let month = 1;

  let table = `
  <table>
    <tr>
      <th>Month</th>
      <th>Date</th>
      <th>EMI (₹)</th>
      <th>Interest (₹)</th>
      <th>Principal (₹)</th>
      <th>Balance (₹)</th>
    </tr>`;

  while (balance > 0 && month <= 500) {

    let interest = Math.round(balance * rate);
    let principal = emi - interest;

    if (principal > balance) {
      principal = balance;
      emi = interest + principal;
    }

    balance -= principal;

    totalInterest += interest;
    totalPrincipal += principal;

    table += `
    <tr>
      <td>${month}</td>
      <td>${date.toLocaleDateString()}</td>
      <td>${emi}</td>
      <td>${interest}</td>
      <td>${principal}</td>
      <td>${Math.round(balance)}</td>
    </tr>`;

    date.setMonth(date.getMonth() + 1);
    month++;
  }

  table += `</table>`;

  document.getElementById("summary").innerHTML = `
  <div class="summary">
    <b>Total Months Pending:</b> ${month - 1}<br>
    <b>Total Principal Payable:</b> ₹${Math.round(totalPrincipal).toLocaleString()}<br>
    <b>Total Interest Payable:</b> ₹${Math.round(totalInterest).toLocaleString()}<br>
    <b>Total Amount Payable:</b> ₹${Math.round(totalPrincipal + totalInterest).toLocaleString()}
  </div>`;

  document.getElementById("result").innerHTML = table;
}
</script>

</body>
</html>
