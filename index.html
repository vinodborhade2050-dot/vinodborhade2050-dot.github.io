<!DOCTYPE html>
<html>
<head>
    <title>Loan Amortization Schedule</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px #ccc;
        }
        input {
            padding: 8px;
            margin: 8px 0;
            width: 100%;
        }
        button {
            padding: 10px;
            width: 100%;
            background: #2c7be5;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid #ccc;
        }
        th {
            background: #2c7be5;
            color: white;
            padding: 8px;
        }
        td {
            padding: 6px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Loan Amortization Schedule</h2>

    <label>Current Outstanding (₹)</label>
    <input type="number" id="outstanding">

    <label>Interest Rate (% per year)</label>
    <input type="number" id="interestRate" step="0.01">

    <label>EMI (₹)</label>
    <input type="number" id="emi">

    <label>EMI Deduction Start Date</label>
    <input type="date" id="startDate">

    <button onclick="generateSchedule()">Generate Schedule</button>

    <div id="tableContainer"></div>
</div>

<script>
function generateSchedule() {

    let P = parseFloat(document.getElementById("outstanding").value);
    let annualRate = parseFloat(document.getElementById("interestRate").value);
    let EMI = parseFloat(document.getElementById("emi").value);
    let startDate = new Date(document.getElementById("startDate").value);

    if (!P || !annualRate || !EMI || !startDate) {
        alert("Please fill all fields.");
        return;
    }

    let R = annualRate / 12 / 100;
    let month = 1;
    let tableHTML = `
        <table>
        <tr>
            <th>Month</th>
            <th>EMI Date</th>
            <th>EMI</th>
            <th>Interest</th>
            <th>Principal</th>
            <th>Outstanding</th>
        </tr>
    `;

    while (P > 0) {

        let interest = P * R;
        let principal = EMI - interest;

        if (principal > P) {
            principal = P;
            EMI = principal + interest;
        }

        P = P - principal;

        let emiDate = new Date(startDate);
        emiDate.setMonth(emiDate.getMonth() + month - 1);

        tableHTML += `
            <tr>
                <td>${month}</td>
                <td>${emiDate.toLocaleDateString()}</td>
                <td>${EMI.toFixed(2)}</td>
                <td>${interest.toFixed(2)}</td>
                <td>${principal.toFixed(2)}</td>
                <td>${P.toFixed(2)}</td>
            </tr>
        `;

        month++;

        if (month > 600) break; // safety break (50 years)
    }

    tableHTML += "</table>";

    document.getElementById("tableContainer").innerHTML = tableHTML;
}
</script>

</body>
</html>
