<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Daily Reducing Loan Calculator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
body { font-family: Arial; padding: 20px; }
input, button { padding: 6px; margin: 5px; }
table { border-collapse: collapse; margin-top: 20px; width: 100%; }
th, td { border: 1px solid #ccc; padding: 6px; text-align: right; }
th { background: #f0f0f0; }
</style>
</head>

<body>

<h2>Daily Reducing Loan Repayment Calculator</h2>

<label>Outstanding Principal:</label>
<input type="number" id="principal"><br>

<label>Annual Interest Rate (%):</label>
<input type="number" step="0.01" id="rate"><br>

<label>EMI Amount:</label>
<input type="number" id="emi"><br>

<label>EMI Date (1–28):</label>
<input type="number" id="emiDate"><br>

<label>Start Date:</label>
<input type="date" id="startDate"><br>

<label>Tenure (months to simulate):</label>
<input type="number" id="months"><br>

<button onclick="generateSchedule()">Generate Schedule</button>
<button onclick="downloadExcel()">Download Excel</button>

<table id="resultTable">
<thead>
<tr>
<th>Month</th>
<th>Opening Balance</th>
<th>Interest</th>
<th>Principal Paid</th>
<th>EMI</th>
<th>Closing Balance</th>
<th>Remaining Months</th>
<th>Remaining Years</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>
let scheduleData = [];

function daysInMonth(year, month) {
  return new Date(year, month + 1, 0).getDate();
}

function generateSchedule() {
  scheduleData = [];
  document.querySelector("#resultTable tbody").innerHTML = "";

  let principal = parseFloat(document.getElementById("principal").value);
  let rate = parseFloat(document.getElementById("rate").value) / 100;
  let emi = parseFloat(document.getElementById("emi").value);
  let emiDay = parseInt(document.getElementById("emiDate").value);
  let start = new Date(document.getElementById("startDate").value);
  let months = parseInt(document.getElementById("months").value);

  let avgPrincipalReduction = emi * 0.6; // rolling average estimate

  for (let m = 0; m < months && principal > 0; m++) {
    let year = start.getFullYear();
    let month = start.getMonth();
    let totalDays = daysInMonth(year, month);

    let interest = 0;
    let dailyRate = rate / 365;
    let opening = principal;

    for (let d = 1; d <= totalDays; d++) {
      interest += principal * dailyRate;

      if (d === emiDay && principal > 0) {
        let principalPaid = emi - interest;
        if (principalPaid < 0) principalPaid = 0;
        principal -= principalPaid;
        if (principal < 0) principal = 0;
      }
    }

    let principalPaid = emi - interest;
    if (principalPaid < 0) principalPaid = 0;

    avgPrincipalReduction = (avgPrincipalReduction + principalPaid) / 2;

    let remainingMonths = principal > 0
      ? Math.ceil(principal / avgPrincipalReduction)
      : 0;

    let remainingYears = (remainingMonths / 12).toFixed(2);

    scheduleData.push({
      Month: start.toLocaleString('default', { month: 'short', year: 'numeric' }),
      Opening: opening.toFixed(2),
      Interest: interest.toFixed(2),
      Principal: principalPaid.toFixed(2),
      EMI: emi.toFixed(2),
      Closing: principal.toFixed(2),
      Remaining_Months: remainingMonths,
      Remaining_Years: remainingYears
    });

    let row = `<tr>
      <td>${scheduleData[m].Month}</td>
      <td>${scheduleData[m].Opening}</td>
      <td>${scheduleData[m].Interest}</td>
      <td>${scheduleData[m].Principal}</td>
      <td>${scheduleData[m].EMI}</td>
      <td>${scheduleData[m].Closing}</td>
      <td>${remainingMonths}</td>
      <td>${remainingYears}</td>
    </tr>`;

    document.querySelector("#resultTable tbody").innerHTML += row;
    start.setMonth(start.getMonth() + 1);
  }
}

function downloadExcel() {
  let ws = XLSX.utils.json_to_sheet(scheduleData);
  let wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Repayment Schedule");
  XLSX.writeFile(wb, "Loan_Repayment_Schedule.xlsx");
}
</script>

</body>
</html>
