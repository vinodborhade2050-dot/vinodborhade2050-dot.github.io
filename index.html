<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Canfin Loan Schedule (Monthly Prepayment)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:Arial;background:#f4f6f8;padding:15px}
.box{background:#fff;padding:15px;border-radius:8px;max-width:1200px;margin:auto}
h2{text-align:center}
label{font-weight:bold;display:block;margin-top:10px}
input,button{width:100%;padding:10px;margin-top:5px;font-size:16px}
button{background:#007bff;color:#fff;border:none;border-radius:6px;margin-top:15px}
.summary{background:#eef5ff;padding:10px;border-radius:6px;margin-top:15px}
table{width:100%;border-collapse:collapse;margin-top:20px;font-size:14px}
th,td{border:1px solid #ccc;padding:6px;text-align:right}
th{background:#007bff;color:#fff}
td:first-child,th:first-child{text-align:center}
.prepay{color:green;font-weight:bold}
</style>
</head>

<body>
<div class="box">
<h2>Canfin Bank EMI Schedule (Daily Interest + Monthly Prepayment)</h2>

<label>Outstanding Amount (₹)</label>
<input type="number" id="outstanding">

<label>Interest Rate (% p.a.)</label>
<input type="number" step="0.01" id="rate">

<label>EMI Amount (₹)</label>
<input type="number" id="emi">

<label>First EMI Date</label>
<input type="date" id="startDate">

<label>Monthly Prepayment Amount</label>
<input type="number" id="monthlyPrepay" placeholder="e.g. 2000">

<button onclick="generateSchedule()">Generate Schedule</button>

<div id="summary"></div>
<div id="result"></div>
</div>

<script>
function daysBetween(d1, d2) {
  return (d2 - d1) / (1000 * 60 * 60 * 24);
}

function generateSchedule() {

  let balance = parseFloat(document.getElementById("outstanding").value);
  let annualRate = parseFloat(document.getElementById("rate").value) / 100;
  let emi = parseFloat(document.getElementById("emi").value);
  let monthlyPrepay = parseFloat(document.getElementById("monthlyPrepay").value) || 0;
  let emiDate = new Date(document.getElementById("startDate").value);

  if (!balance || !annualRate || !emi || isNaN(emiDate)) {
    alert("Please fill all required fields");
    return;
  }

  let prevDate = new Date(emiDate);
  prevDate.setMonth(prevDate.getMonth() - 1);

  let totalInterest = 0;
  let totalPrincipal = 0;
  let month = 1;

  let table = `<table>
  <tr>
    <th>Month</th>
    <th>Date</th>
    <th>Days</th>
    <th>EMI</th>
    <th>Interest</th>
    <th>Principal</th>
    <th>Monthly Prepay</th>
    <th>Balance</th>
  </tr>`;

  while (balance > 0 && month <= 600) {

    // Daily interest till EMI (10 AM)
    let days = daysBetween(prevDate, emiDate) + 0.3;
    let interest = Math.round(balance * annualRate * days / 365);
    let principal = emi - interest;

    if (principal > balance) {
      principal = balance;
      emi = interest + principal;
    }

    balance -= principal;
    totalInterest += interest;
    totalPrincipal += principal;

    // Apply monthly prepayment
    let prepayApplied = 0;
    if (monthlyPrepay > 0 && balance > 0) {
      prepayApplied = Math.min(monthlyPrepay, balance);
      balance -= prepayApplied;
      totalPrincipal += prepayApplied;
    }

    table += `<tr>
      <td>${month}</td>
      <td>${emiDate.toLocaleDateString()}</td>
      <td>${days.toFixed(1)}</td>
      <td>${emi}</td>
      <td>${interest}</td>
      <td>${principal}</td>
      <td class="prepay">${prepayApplied || "-"}</td>
      <td>${Math.round(balance)}</td>
    </tr>`;

    prevDate = new Date(emiDate);
    emiDate.setMonth(emiDate.getMonth() + 1);
    month++;
  }

  table += `</table>`;

  document.getElementById("summary").innerHTML = `
    <div class="summary">
      <b>Total Months Pending:</b> ${month - 1}<br>
      <b>Total Principal Paid:</b> ₹${Math.round(totalPrincipal).toLocaleString()}<br>
      <b>Total Interest Paid:</b> ₹${Math.round(totalInterest).toLocaleString()}<br>
      <b>Total Amount Paid:</b> ₹${Math.round(totalPrincipal + totalInterest).toLocaleString()}
    </div>`;

  document.getElementById("result").innerHTML = table;
}
</script>

</body>
</html>
