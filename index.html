<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Daily Reducing Loan Calculator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body { font-family: system-ui, Arial; background:#f4f6f8; padding:15px; }
.container { max-width:1100px; margin:auto; background:#fff; padding:20px; border-radius:10px; }
h2 { text-align:center; }
.form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; }
input,button { padding:8px; width:100%; }
button { background:#2563eb; color:#fff; border:none; border-radius:6px; cursor:pointer; }
table { width:100%; border-collapse:collapse; margin-top:20px; font-size:13px; }
th,td { border:1px solid #ddd; padding:6px; text-align:right; }
th { background:#e5e7eb; }
</style>
</head>

<body>
<div class="container">
<h2>Daily Reducing Loan Calculator (Bank Exact)</h2>

<div class="form-grid">
  <input id="principal" type="number" value="1056418">
  <input id="rate" type="number" step="0.01" value="7.65">
  <input id="emi" type="number" value="18000">
  <input id="emiDate" type="number" value="15">
  <input id="startMonth" type="month" value="2025-05">
</div>

<br>
<button onclick="generate()">Generate Schedule</button>
<button onclick="downloadExcel()">Download Excel</button>

<table>
<thead>
<tr>
<th>Month</th>
<th>Opening</th>
<th>Interest</th>
<th>Principal</th>
<th>EMI</th>
<th>Closing</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<script>
let excelData = [];

function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }

function generate(){
  excelData=[];
  tbody.innerHTML="";

  let principal=+principalInput.value;
  let rate=+rateInput.value/100;
  let emi=+emiInput.value;
  let emiDay=+emiDateInput.value;

  let [year,month]=startMonth.value.split("-").map(Number);
  month--; // JS month

  let dailyRate=rate/365;

  for(let i=0;i<360 && principal>0;i++){
    let opening=principal;
    let interest=0;
    let totalDays=daysInMonth(year,month);

    // 🔥 BEFORE EMI (1 → EMI-1)
    for(let d=1; d<emiDay; d++){
      interest+=Math.round(principal*dailyRate*100)/100;
    }

    // EMI DAY INTEREST
    interest+=Math.round(principal*dailyRate*100)/100;

    // EMI APPLIED
    let principalPaid=emi-interest;
    principal-=principalPaid;
    if(principal<0) principal=0;

    // 🔥 AFTER EMI (EMI+1 → month end)
    for(let d=emiDay+1; d<=totalDays; d++){
      interest+=Math.round(principal*dailyRate*100)/100;
    }

    excelData.push({
      Month:new Date(year,month).toLocaleString("default",{month:"short",year:"numeric"}),
      Opening:opening.toFixed(2),
      Interest:interest.toFixed(2),
      Principal:principalPaid.toFixed(2),
      EMI:emi.toFixed(2),
      Closing:principal.toFixed(2)
    });

    tbody.innerHTML+=`
      <tr>
        <td>${excelData.at(-1).Month}</td>
        <td>${opening.toFixed(2)}</td>
        <td>${interest.toFixed(2)}</td>
        <td>${principalPaid.toFixed(2)}</td>
        <td>${emi.toFixed(2)}</td>
        <td>${principal.toFixed(2)}</td>
      </tr>`;

    month++;
    if(month>11){ month=0; year++; }
  }
}

const principalInput=principal;
const rateInput=rate;
const emiInput=emi;
const emiDateInput=emiDate;
const startMonth=document.getElementById("startMonth");

function downloadExcel(){
  let ws=XLSX.utils.json_to_sheet(excelData);
  let wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Loan");
  XLSX.writeFile(wb,"Loan_Schedule.xlsx");
}
</script>
</body>
</html>
