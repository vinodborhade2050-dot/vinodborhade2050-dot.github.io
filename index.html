<!DOCTYPE html>
<html>
<head>
    <title>Loan Statement Calculator</title>
    <style>
        body { font-family: Arial; background:#f4f6f9; padding:20px; }
        .container { max-width:1000px; background:white; padding:20px; border-radius:8px; }
        input, button { padding:8px; margin:6px 0; width:100%; }
        button { background:#2c7be5; color:white; border:none; cursor:pointer; }
        table { width:100%; border-collapse:collapse; margin-top:20px; }
        th, td { border:1px solid #ccc; padding:6px; text-align:center; }
        th { background:#2c7be5; color:white; }
        .summary { margin-top:20px; padding:15px; background:#e9f2ff; }
    </style>
</head>
<body>

<div class="container">
    <h2>Loan Statement Generator</h2>

    <label>Loan Amount (₹)</label>
    <input type="number" id="loanAmount">

    <label>Interest Rate (% per year)</label>
    <input type="number" id="interestRate" step="0.01">

    <label>EMI (₹)</label>
    <input type="number" id="emi">

    <label>EMI Start Date</label>
    <input type="date" id="startDate">

    <button onclick="generateSchedule()">Generate Schedule</button>

    <label>Select EMI Date to Check Outstanding</label>
    <input type="date" id="checkDate" onchange="calculateOutstanding()">

    <div id="summary" class="summary" style="display:none;"></div>

    <div id="tableContainer"></div>
</div>

<script>
let schedule = [];

function generateSchedule() {

    schedule = [];

    let P = parseFloat(document.getElementById("loanAmount").value);
    let annualRate = parseFloat(document.getElementById("interestRate").value);
    let EMI = parseFloat(document.getElementById("emi").value);
    let startDate = new Date(document.getElementById("startDate").value);

    if (!P || !annualRate || !EMI || !startDate) {
        alert("Please fill all fields.");
        return;
    }

    let R = annualRate / 12 / 100;
    let month = 1;
    let totalInterest = 0;
    let totalPrincipal = 0;

    let tableHTML = `
        <table>
        <tr>
            <th>Month</th>
            <th>EMI Date</th>
            <th>EMI</th>
            <th>Interest</th>
            <th>Principal</th>
            <th>Outstanding</th>
        </tr>
    `;

    while (P > 0) {

        let interest = P * R;
        let principal = EMI - interest;

        if (principal > P) {
            principal = P;
            EMI = principal + interest;
        }

        P -= principal;
        totalInterest += interest;
        totalPrincipal += principal;

        let emiDate = new Date(startDate);
        emiDate.setMonth(emiDate.getMonth() + month - 1);

        schedule.push({
            month,
            emiDate: new Date(emiDate),
            emi: EMI,
            interest,
            principal,
            outstanding: P,
            totalInterest,
            totalPrincipal
        });

        tableHTML += `
            <tr>
                <td>${month}</td>
                <td>${emiDate.toLocaleDateString()}</td>
                <td>${EMI.toFixed(2)}</td>
                <td>${interest.toFixed(2)}</td>
                <td>${principal.toFixed(2)}</td>
                <td>${P.toFixed(2)}</td>
            </tr>
        `;

        month++;
        if (month > 600) break;
    }

    tableHTML += "</table>";
    document.getElementById("tableContainer").innerHTML = tableHTML;
}

function calculateOutstanding() {

    let selectedDate = new Date(document.getElementById("checkDate").value);
    if (!selectedDate || schedule.length === 0) return;

    let record = schedule.find(s =>
        s.emiDate.getFullYear() === selectedDate.getFullYear() &&
        s.emiDate.getMonth() === selectedDate.getMonth()
    );

    if (!record) {
        alert("No EMI found for selected date.");
        return;
    }

    document.getElementById("summary").style.display = "block";
    document.getElementById("summary").innerHTML = `
        <b>Outstanding on ${record.emiDate.toLocaleDateString()}:</b> ₹ ${record.outstanding.toFixed(2)}<br><br>
        <b>Total Principal Paid Till Date:</b> ₹ ${record.totalPrincipal.toFixed(2)}<br><br>
        <b>Total Interest Paid Till Date:</b> ₹ ${record.totalInterest.toFixed(2)}
    `;
}
</script>

</body>
</html>
