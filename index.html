<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Important Dates Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
    }

    h2 {
      text-align: center;
    }

    .input-box {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="date"] {
      padding: 8px;
      font-size: 16px;
    }

    button {
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
    }

    .list {
      max-width: 500px;
      margin: auto;
    }

    .item {
      display: flex;
      align-items: center;
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .circle {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #007bff;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      margin-right: 15px;
      flex-shrink: 0;
    }

    .date-text {
      font-size: 16px;
      color: #333;
    }

    .small {
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h2>📅 Important Dates Tracker</h2>

  <div class="input-box">
    <input type="date" id="dateInput">
    <button onclick="saveDate()">Save</button>
  </div>

  <div class="list" id="dateList"></div>

<script>
  const STORAGE_KEY = "importantDates";

  function getSavedDates() {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  }

  function saveDate() {
    const dateValue = document.getElementById("dateInput").value;
    if (!dateValue) {
      alert("Please select a date");
      return;
    }

    const dates = getSavedDates();
    dates.push({ date: dateValue });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(dates));

    document.getElementById("dateInput").value = "";
    renderDates();
  }

  function daysPassed(fromDate) {
    const start = new Date(fromDate);
    const today = new Date();

    start.setHours(0,0,0,0);
    today.setHours(0,0,0,0);

    const diff = Math.floor((today - start) / (1000 * 60 * 60 * 24));
    return diff + 1; // reset to 1 on saved date
  }

  function renderDates() {
    const list = document.getElementById("dateList");
    list.innerHTML = "";

    const dates = getSavedDates();

    dates.forEach(item => {
      const dayCount = daysPassed(item.date);

      const div = document.createElement("div");
      div.className = "item";

      div.innerHTML = `
        <div class="circle">${dayCount}</div>
        <div>
          <div class="date-text"><b>${item.date}</b></div>
          <div class="small">Days passed</div>
        </div>
      `;

      list.appendChild(div);
    });
  }

  // refresh counts on load
  renderDates();
</script>

</body>
</html>
