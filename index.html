<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GPay Transaction Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
  background: #f2f4f7;
}

h2, h3 {
  margin-bottom: 12px;
}

.card {
  background: #ffffff;
  padding: 16px;
  border-radius: 12px;
  margin-bottom: 16px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.06);
}

input {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
  font-weight: 600;
}

.pay {
  background: #1a73e8;
  color: white;
}

.success { background: #34a853; color: white; margin-bottom: 8px; }
.fail { background: #ea4335; color: white; margin-bottom: 8px; }
.return { background: #fbbc05; color: black; }

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 520px;
}

th {
  background: #f1f3f4;
}

th, td {
  padding: 10px;
  border: 1px solid #ddd;
  text-align: center;
  font-size: 14px;
}

.status-success { color: #34a853; font-weight: 600; }
.status-failed { color: #ea4335; font-weight: 600; }
.status-returned { color: #f57c00; font-weight: 600; }

</style>
</head>

<body>

<h2>Send Money via GPay</h2>

<div class="card">
  <input id="upi" placeholder="Receiver UPI ID (e.g. abc@okhdfc)">
  <input id="amount" type="number" placeholder="Amount">
  <button class="pay" onclick="pay()">Pay with GPay</button>
</div>

<div class="card" id="statusCard" style="display:none;">
  <h3>Confirm Transaction</h3>
  <button class="success" onclick="saveStatus('SUCCESS')">Success</button>
  <button class="fail" onclick="saveStatus('FAILED')">Failed</button>
  <button class="return" onclick="saveStatus('RETURNED')">Returned</button>
</div>

<div class="card">
  <h3>Transaction History</h3>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>UPI</th>
          <th>Amount</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="history"></tbody>
    </table>
  </div>
</div>

<script>
let currentTxn = null;

function pay() {
  const upi = document.getElementById('upi').value.trim();
  const amount = document.getElementById('amount').value;

  if (!upi || !amount) {
    alert("Enter UPI ID and Amount");
    return;
  }

  currentTxn = {
    date: new Date().toLocaleString(),
    upi,
    amount,
    status: "PENDING"
  };

  const url = `upi://pay?pa=${upi}&am=${amount}&cu=INR`;
  window.location.href = url;

  document.getElementById('statusCard').style.display = "block";
}

function saveStatus(status) {
  currentTxn.status = status;

  const txns = JSON.parse(localStorage.getItem("transactions") || "[]");
  txns.push(currentTxn);
  localStorage.setItem("transactions", JSON.stringify(txns));

  document.getElementById('statusCard').style.display = "none";
  loadHistory();
}

function loadHistory() {
  const txns = JSON.parse(localStorage.getItem("transactions") || "[]");
  const tbody = document.getElementById("history");
  tbody.innerHTML = "";

  txns.forEach(t => {
    let cls =
      t.status === "SUCCESS" ? "status-success" :
      t.status === "FAILED" ? "status-failed" :
      "status-returned";

    tbody.innerHTML += `
      <tr>
        <td>${t.date}</td>
        <td>${t.upi}</td>
        <td>₹${t.amount}</td>
        <td class="${cls}">${t.status}</td>
      </tr>`;
  });
}

loadHistory();
</script>

</body>
</html>
