<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Monthly Investment Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
    }
    .card {
      max-width: 450px;
      margin: auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #2c3e50;
    }
    select, input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: #fff;
    }
    .save { background: #1e88e5; }
    .delete { background: #e53935; }

    .entry {
      background: #f1f3f4;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Investment Tracker</h2>

  <select id="month">
    <option value="">Select Month</option>
    <option>January</option><option>February</option><option>March</option>
    <option>April</option><option>May</option><option>June</option>
    <option>July</option><option>August</option><option>September</option>
    <option>October</option><option>November</option><option>December</option>
  </select>

  <select id="year"></select>

  <input type="number" id="amount" placeholder="Investment Amount (₹)">

  <button class="save" onclick="saveInvestment()">Save
<script>
  window.onload = function () {

    const yearSelect = document.getElementById("year");
    const currentYear = new Date().getFullYear();

    yearSelect.innerHTML = '<option value="">Select Year</option>';

    for (let y = currentYear - 5; y <= currentYear + 5; y++) {
      const option = document.createElement("option");
      option.value = y;
      option.text = y;
      yearSelect.appendChild(option);
    }

    loadList();
  };

  function getData() {
    return JSON.parse(localStorage.getItem("investments")) || {};
  }

  function saveData(data) {
    localStorage.setItem("investments", JSON.stringify(data));
  }

  function saveInvestment() {
    const month = document.getElementById("month").value;
    const year = document.getElementById("year").value;
    const amount = document.getElementById("amount").value;

    if (!month || !year || amount <= 0) {
      alert("Please select month, year and valid amount");
      return;
    }

    const key = `${month}-${year}`;
    const data = getData();
    data[key] = amount;
    saveData(data);

    document.getElementById("amount").value = "";
    loadList();
  }

  function deleteInvestment(key) {
    const data = getData();
    delete data[key];
    saveData(data);
    loadList();
  }

  function loadList() {
    const data = getData();
    const list = document.getElementById("list");
    list.innerHTML = "";

    for (let key in data) {
      list.innerHTML += `
        <div class="entry">
          <div>${key} : ₹${data[key]}</div>
          <button class="delete" onclick="deleteInvestment('${key}')">X</button>
        </div>
      `;
    }
  }
</script>
