<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Monthly Savings Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
    }
    .card {
      max-width: 400px;
      margin: auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #2c3e50;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .save {
      background: #1e88e5;
      color: #fff;
    }
    .delete {
      background: #e53935;
      color: #fff;
    }
    .saved {
      margin-top: 15px;
      text-align: center;
      color: green;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Monthly Savings</h2>

    <label>Enter Monthly Saving Amount (₹)</label>
    <input type="number" id="savingAmount" placeholder="e.g. 10000">

    <button class="save" onclick="saveAmount()">Save / Update</button>
    <button class="delete" onclick="deleteAmount()">Delete</button>

    <div class="saved" id="savedMsg"></div>
  </div>

  <script>
    // Load saved value
    window.onload = function () {
      let savedAmount = localStorage.getItem("monthlySaving");
      if (savedAmount) {
        document.getElementById("savingAmount").value = savedAmount;
        document.getElementById("savedMsg").innerText =
          "Saved Amount: ₹" + savedAmount;
      }
    };

    function saveAmount() {
      let amount = document.getElementById("savingAmount").value;

      if (amount === "" || amount <= 0) {
        alert("Please enter a valid amount");
        return;
      }

      localStorage.setItem("monthlySaving", amount);
      document.getElementById("savedMsg").innerText =
        "Saved Amount Updated: ₹" + amount;
    }

    function deleteAmount() {
      if (confirm("Are you sure you want to delete the saved amount?")) {
        localStorage.removeItem("monthlySaving");
        document.getElementById("savingAmount").value = "";
        document.getElementById("savedMsg").innerText =
          "Saved amount deleted";
      }
    }
  </script>

</body>
</html>
