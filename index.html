<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Canfin Bank Loan Schedule</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    padding: 15px;
  }
  h2 {
    text-align: center;
  }
  .box {
    background: #fff;
    padding: 15px;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    max-width: 1100px;
    margin: auto;
  }
  label {
    font-weight: bold;
    margin-top: 10px;
    display: block;
  }
  input, button {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    font-size: 16px;
  }
  button {
    background: #007bff;
    color: white;
    border: none;
    border-radius: 6px;
    margin-top: 15px;
  }
  .summary {
    background: #eef5ff;
    padding: 10px;
    margin-top: 15px;
    border-radius: 6px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    font-size: 14px;
  }
  th, td {
    border: 1px solid #ccc;
    padding: 6px;
    text-align: right;
  }
  th {
    background: #007bff;
    color: #fff;
  }
  td:first-child, th:first-child {
    text-align: center;
  }
</style>
</head>

<body>

<div class="box">
<h2>Canfin Bank EMI Schedule (Daily Interest)</h2>

<label>Outstanding Amount (₹)</label>
<input type="number" id="outstanding" placeholder="e.g. 1051960">

<label>Interest Rate (% p.a.)</label>
<input type="number" step="0.01" id="rate" placeholder="e.g. 7.65">

<label>EMI Amount (₹)</label>
<input type="number" id="emi" placeholder="e.g. 18000">

<label>First EMI Date</label>
<input type="date" id="startDate">

<button onclick="generateSchedule()">Generate Schedule</button>

<div id="summary"></div>
<div id="result"></div>
</div>

<script>
function daysBetween(d1, d2) {
  const msPerDay = 1000 * 60 * 60 * 24;
  return (d2 - d1) / msPerDay;
}

function generateSchedule() {

  let balance = parseFloat(document.getElementById("outstanding").value);
  let annualRate = parseFloat(document.getElementById("rate").value) / 100;
  let emi = parseFloat(document.getElementById("emi").value);
  let emiDate = new Date(document.getElementById("startDate").value);

  if (!balance || !annualRate || !emi || isNaN(emiDate)) {
    alert("Please fill all fields");
    return;
  }

  let prevEmiDate = new Date(emiDate);
  prevEmiDate.setMonth(prevEmiDate.getMonth() - 1);

  let totalInterest = 0;
  let totalPrincipal = 0;
  let month = 1;

  let table = `
  <table>
    <tr>
      <th>Month</th>
      <th>EMI Date</th>
      <th>Days</th>
      <th>EMI (₹)</th>
      <th>Interest (₹)</th>
      <th>Principal (₹)</th>
      <th>Balance (₹)</th>
    </tr>`;

  while (balance > 0 && month <= 500) {

    // Days between EMIs + partial EMI day (10 AM ≈ 0.3 day)
    let days = daysBetween(prevEmiDate, emiDate) + 0.3;

    let interest = Math.round(balance * annualRate * days / 365);
    let principal = emi - interest;

    if (principal > balance) {
      principal = balance;
      emi = interest + principal;
    }

    balance -= principal;

    totalInterest += interest;
    totalPrincipal += principal;

    table += `
    <tr>
      <td>${month}</td>
      <td>${emiDate.toLocaleDateString()}</td>
      <td>${days.toFixed(1)}</td>
      <td>${emi}</td>
      <td>${interest}</td>
      <td>${principal}</td>
      <td>${Math.round(balance)}</td>
    </tr>`;

    prevEmiDate = new Date(emiDate);
    emiDate.setMonth(emiDate.getMonth() + 1);
    month++;
  }

  table += `</table>`;

  document.getElementById("summary").innerHTML = `
    <div class="summary">
      <b>Total Months Pending:</b> ${month - 1}<br>
      <b>Total Principal Payable:</b> ₹${Math.round(totalPrincipal).toLocaleString()}<br>
      <b>Total Interest Payable:</b> ₹${Math.round(totalInterest).toLocaleString()}<br>
      <b>Total Amount Payable:</b> ₹${Math.round(totalPrincipal + totalInterest).toLocaleString()}
    </div>`;

  document.getElementById("result").innerHTML = table;
}
</script>

</body>
</html>
