<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Monthly Investment Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
    }
    .card {
      max-width: 450px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2 { text-align: center; margin-bottom: 10px; }
    select, input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background: #1e88e5;
      color: #fff;
      cursor: pointer;
    }
    .entry {
      background: #f1f3f4;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .delete {
      background: #e53935;
      padding: 6px 10px;
      border-radius: 4px;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    .total {
      text-align: center;
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      color: #1e88e5;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Investment Tracker</h2>

  <select id="month">
    <option value="">Select Month</option>
    <option>January</option><option>February</option><option>March</option>
    <option>April</option><option>May</option><option>June</option>
    <option>July</option><option>August</option><option>September</option>
    <option>October</option><option>November</option><option>December</option>
  </select>

  <select id="year"></select>

  <input type="number" id="amount" placeholder="Investment Amount (₹)">

  <button onclick="saveInvestment()">Save / Update</button>

  <div class="total" id="total">Total Invested: ₹0</div>

  <div id="list"></div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    populateYears();
    renderList();
  });

  function populateYears() {
    const yearSelect = document.getElementById("year");
    const currentYear = new Date().getFullYear();
    yearSelect.innerHTML = '<option value="">Select Year</option>';
    for (let y = currentYear - 5; y <= currentYear + 5; y++) {
      const opt = document.createElement("option");
      opt.value = y;
      opt.textContent = y;
      yearSelect.appendChild(opt);
    }
  }

  function getData() {
    return JSON.parse(localStorage.getItem("investments")) || {};
  }

  function setData(data) {
    localStorage.setItem("investments", JSON.stringify(data));
  }

  function saveInvestment() {
    const month = document.getElementById("month").value;
    const year = document.getElementById("year").value;
    const amount = parseFloat(document.getElementById("amount").value);

    if (!month || !year || isNaN(amount) || amount <= 0) {
      alert("Please select month, year and valid amount");
      return;
    }

    const key = `${year}-${month}`;
    const data = getData();
    data[key] = amount;
    setData(data);

    document.getElementById("amount").value = "";
    renderList();
  }

  function deleteInvestment(key) {
    const data = getData();
    delete data[key];
    setData(data);
    renderList();
  }

  function renderList() {
    const list = document.getElementById("list");
    const totalDiv = document.getElementById("total");
    const data = getData();
    list.innerHTML = "";

    const keys = Object.keys(data).sort();
    if (keys.length === 0) {
      totalDiv.textContent = "Total Invested: ₹0";
      list.innerHTML = "<p style='text-align:center;color:#777'>No investments added</p>";
      return;
    }

    let total = 0;
    keys.forEach(key => {
      const [year, month] = key.split("-");
      const amount = data[key];
      total += Number(amount);

      const div = document.createElement("div");
      div.className = "entry";
      div.innerHTML = `
        <div>
          <strong>${month} ${year}</strong><br>
          ₹${Number(amount).toLocaleString("en-IN")}
        </div>
        <button class="delete" onclick="deleteInvestment('${key}')">Delete</button>
      `;
      list.appendChild(div);
    });

    totalDiv.textContent = `Total Invested: ₹${total.toLocaleString("en-IN")}`;
  }
</script>

</body>
</html>
