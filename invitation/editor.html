<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
body{
    font-family:'Poppins',sans-serif;
    margin:0;
    background:#f5f7fb;
}

.container{
    padding:20px;
    max-width:900px;
    margin:auto;
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
    margin-bottom:25px;
}

h2{
    margin-bottom:15px;
}

input{
    width:100%;
    padding:10px;
    margin-bottom:12px;
    border-radius:8px;
    border:1px solid #ddd;
}

button{
    padding:10px 20px;
    border:none;
    border-radius:25px;
    background:#e91e63;
    color:white;
    cursor:pointer;
}

.preview{
    display:none;
    text-align:center;
}

.invitation{
    width:100%;
    max-width:350px;
    margin:auto;
    padding:30px;
    border-radius:20px;
    background:linear-gradient(135deg,#ffdde1,#ee9ca7);
    box-shadow:0 20px 40px rgba(0,0,0,0.15);
}

.invitation h3{
    font-family:'Great Vibes';
    font-size:28px;
}

.price-box{
    display:none;
    text-align:center;
}

.price{
    font-size:22px;
    font-weight:600;
    color:#e91e63;
}

.locked{
    background:gray;
}@media(max-width:768px){

    

}
</style>
</head>
<body>

<div class="container">
<nav>
    <div class="logo">InviteCraft</div>

    <div class="nav-right">
        <a href="index.html">Home</a>
        <a href="templates.html">Templates</a>
        <a href="#" class="btn">Upgrade</a>
    </div>
</nav>
<!-- STEP 1 -->
<div class="card" id="formStep">
    <h2>Step 1: Fill Invitation Details</h2>

    <input type="text" id="bride" placeholder="Bride Name">
    <input type="text" id="groom" placeholder="Groom Name">
    <input type="text" id="date" placeholder="Wedding Date">
    <input type="text" id="venue" placeholder="Venue">

    <button onclick="generatePreview()">Generate Preview</button>
</div>

<!-- STEP 2 -->
<div class="card preview" id="previewStep">
    <h2>Step 2: Preview</h2>

    <div class="invitation" id="card">
        <h3 id="names"></h3>
        <p id="dateText"></p>
        <p id="venueText"></p>
    </div>
</div>

<!-- STEP 3 -->
<div class="card price-box" id="priceStep">
    <h2>Step 3: Unlock & Download</h2>
    <p class="price">Premium Template Price: ₹199</p>

    <button onclick="makePayment()">Pay & Unlock</button>
    <br><br>
    <button id="downloadBtn" class="locked" disabled onclick="downloadCard()">Download</button>
</div>

</div>

<script>

function generatePreview(){

    let bride = document.getElementById("bride").value;
    let groom = document.getElementById("groom").value;
    let date = document.getElementById("date").value;
    let venue = document.getElementById("venue").value;

    if(!bride || !groom || !date || !venue){
        alert("Please fill all fields");
        return;
    }

    document.getElementById("names").innerText = bride + " & " + groom;
    document.getElementById("dateText").innerText = date;
    document.getElementById("venueText").innerText = venue;

    document.getElementById("previewStep").style.display="block";
    document.getElementById("priceStep").style.display="block";
}

function makePayment(){
    alert("Payment Successful (Simulation)");
    let btn = document.getElementById("downloadBtn");
    btn.disabled = false;
    btn.classList.remove("locked");
}

function downloadCard(){
    alert("Download feature can be integrated using html2canvas library.");
}

</script>

</body>
</html>
