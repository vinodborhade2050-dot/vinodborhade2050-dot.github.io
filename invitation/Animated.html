<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Invitation Video</title>

<style>
body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    overflow:hidden;
    background: linear-gradient(135deg,#ff9a9e,#fad0c4);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
    color:white;
}

.video-container{
    width:100%;
    max-width:400px;
    padding:20px;
}

h1,h2,p{
    opacity:0;
    transform:translateY(30px);
    animation: fadeUp 1s ease forwards;
}

h1{ animation-delay:1s; font-size:28px;}
h2{ animation-delay:3s; font-size:22px;}
p{ animation-delay:5s; font-size:16px;}

.date{
    animation-delay:7s;
    font-weight:bold;
    font-size:18px;
}

@keyframes fadeUp{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.heart{
    position:absolute;
    width:15px;
    height:15px;
    background:red;
    transform:rotate(45deg);
    animation: float 6s linear infinite;
}

.heart::before,
.heart::after{
    content:'';
    position:absolute;
    width:15px;
    height:15px;
    background:red;
    border-radius:50%;
}

.heart::before{ top:-8px; left:0;}
.heart::after{ left:-8px; top:0;}

@keyframes float{
    0%{ bottom:-10px; opacity:1;}
    100%{ bottom:100%; opacity:0;}
}

button{
    margin-top:20px;
    padding:10px 20px;
    border:none;
    border-radius:20px;
    background:white;
    color:#ff6b81;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="video-container">
    <h1>💍 You're Invited 💍</h1>
    <h2>Rahul ❤️ Priya</h2>
    <p>Request the pleasure of your company</p>
    <p class="date">12 December 2026 | Mumbai</p>
    <button onclick="restart()">Replay</button>
</div>

<script>
function createHeart(){
    const heart=document.createElement("div");
    heart.classList.add("heart");
    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(Math.random()*3+3)+"s";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),6000);
}
setInterval(createHeart,500);

function restart(){
    location.reload();
}
</script>

</body>
</html>
