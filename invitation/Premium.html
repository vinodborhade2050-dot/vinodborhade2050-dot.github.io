<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Premium Wedding Invitation 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:'Poppins',sans-serif;
    background:black;
    color:white;
}

/* EDIT PANEL */
.editor{
    position:fixed;
    left:0;
    top:0;
    width:300px;
    height:100%;
    background:#111;
    padding:20px;
    z-index:10;
}

.editor input, .editor textarea{
    width:100%;
    margin-bottom:10px;
    padding:8px;
    background:#222;
    border:none;
    color:white;
}

.editor button{
    width:100%;
    padding:10px;
    margin-top:5px;
    background:gold;
    border:none;
    cursor:pointer;
    font-weight:bold;
}

/* VIDEO AREA */
.video{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    background:radial-gradient(circle at center,#3a0ca3,#000);
}

/* PARTICLES */
.video::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:url("https://www.transparenttextures.com/patterns/stardust.png");
    opacity:0.2;
    animation:moveBg 20s linear infinite;
}

@keyframes moveBg{
    from{background-position:0 0;}
    to{background-position:1000px 1000px;}
}

/* SCENES */
.scene{
    position:absolute;
    text-align:center;
    opacity:0;
    transition:opacity 1.5s ease;
    width:100%;
}

.active{
    opacity:1;
}

/* TEXT STYLES */
.title{
    font-family:'Playfair Display',serif;
    font-size:60px;
    letter-spacing:3px;
    text-shadow:0 0 20px gold;
}

.subtitle{
    font-size:24px;
    margin-top:20px;
}

.names{
    font-family:'Playfair Display',serif;
    font-size:70px;
    text-shadow:0 0 25px pink;
}

.details{
    font-size:28px;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="editor">
    <h3>Edit Invitation</h3>
    <input id="groom" value="Rahul">
    <input id="bride" value="Sneha">
    <input id="date" value="20 April 2026">
    <input id="place" value="Mumbai">
    <textarea id="msg">Together with our families</textarea>
    <button onclick="updateData()">Update</button>
    <button onclick="startRec()">Record Video</button>
    <button onclick="stopRec()">Stop & Download</button>
</div>

<div class="video" id="recordArea">

    <div class="scene active" id="scene1">
        <div class="title">You're Invited</div>
        <div class="subtitle" id="msgText">Together with our families</div>
    </div>

    <div class="scene" id="scene2">
        <div class="names" id="namesText">Rahul ❤️ Sneha</div>
    </div>

    <div class="scene" id="scene3">
        <div class="details" id="dateText">20 April 2026</div>
        <div class="details" id="placeText">Mumbai</div>
    </div>

</div>

<script>
function updateData(){
    let groom=document.getElementById("groom").value;
    let bride=document.getElementById("bride").value;
    let date=document.getElementById("date").value;
    let place=document.getElementById("place").value;
    let msg=document.getElementById("msg").value;

    document.getElementById("namesText").innerText=groom+" ❤️ "+bride;
    document.getElementById("dateText").innerText=date;
    document.getElementById("placeText").innerText=place;
    document.getElementById("msgText").innerText=msg;
}

/* SCENE ANIMATION LOOP */
let current=1;
setInterval(()=>{
    document.getElementById("scene"+current).classList.remove("active");
    current++;
    if(current>3) current=1;
    document.getElementById("scene"+current).classList.add("active");
},4000);

/* RECORDING */
let recorder, chunks=[];

async function startRec(){
    const stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});
    recorder=new MediaRecorder(stream);

    recorder.ondataavailable=e=>chunks.push(e.data);

    recorder.onstop=()=>{
        const blob=new Blob(chunks,{type:"video/webm"});
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a");
        a.href=url;
        a.download="premium_invitation.webm";
        a.click();
        chunks=[];
    }

    recorder.start();
}

function stopRec(){
    recorder.stop();
}
</script>

</body>
</html>
