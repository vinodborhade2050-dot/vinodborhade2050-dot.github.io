<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Wedding Editor 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:#f3f4f6;
    overflow:hidden;
}

/* ===== TOOLBAR ===== */
.toolbar{
    position:fixed;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    background:white;
    padding:10px 15px;
    border-radius:40px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
    display:flex;
    gap:10px;
    z-index:1000;
}

.toolbar select, .toolbar button{
    padding:6px 12px;
    border-radius:20px;
    border:1px solid #ddd;
}

.toolbar button{
    background:#8b5cf6;
    color:white;
    border:none;
}

/* ===== PREVIEW ===== */
.preview{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ede9fe,#fbcfe8);
}

.card{
    width:90%;
    max-width:420px;
    aspect-ratio:9/16;
    background:linear-gradient(135deg,#1e1b4b,#312e81);
    border-radius:25px;
    position:relative;
    overflow:hidden;
    color:white;
}

/* TEXT ELEMENT */
.text-element{
    position:absolute;
    cursor:move;
    user-select:none;
}

/* ANIMATIONS */
.fade{animation:fadeIn 1s forwards;}
.zoom{animation:zoomIn 1s forwards;}
.slide{animation:slideUp 1s forwards;}

@keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
}
@keyframes zoomIn{
    from{opacity:0;transform:scale(0.6);}
    to{opacity:1;transform:scale(1);}
}
@keyframes slideUp{
    from{opacity:0;transform:translateY(50px);}
    to{opacity:1;transform:translateY(0);}
}
</style>
</head>
<body>

<div class="toolbar">
    <select id="animationSelect">
        <option value="fade">Fade</option>
        <option value="zoom">Zoom</option>
        <option value="slide">Slide</option>
    </select>

    <button onclick="addText()">Add Text</button>
    <button onclick="startRec()">Record</button>
    <button onclick="stopRec()">Stop</button>
</div>

<div class="preview" id="recordArea">
    <div class="card" id="card"></div>
</div>

<script>

/* ===== DATA MODEL ===== */
let elements = [];
let selectedElement = null;

/* ===== ADD TEXT ===== */
function addText(){
    const id = "el" + Date.now();
    const element = {
        id:id,
        text:"Edit Text",
        x:100,
        y:100,
        animation:"fade"
    };

    elements.push(element);
    renderElement(element);
}

/* ===== RENDER ELEMENT ===== */
function renderElement(data){
    const div = document.createElement("div");
    div.className = "text-element " + data.animation;
    div.innerText = data.text;
    div.style.left = data.x + "px";
    div.style.top = data.y + "px";
    div.id = data.id;

    div.onclick = function(){
        selectedElement = data;
        document.getElementById("animationSelect").value = data.animation;
    };

    enableDrag(div, data);
    document.getElementById("card").appendChild(div);
}

/* ===== DRAG SYSTEM ===== */
function enableDrag(el, data){
    let offsetX, offsetY;

    el.onmousedown = function(e){
        offsetX = e.offsetX;
        offsetY = e.offsetY;

        document.onmousemove = function(e){
            data.x = e.clientX - el.parentElement.getBoundingClientRect().left - offsetX;
            data.y = e.clientY - el.parentElement.getBoundingClientRect().top - offsetY;

            el.style.left = data.x + "px";
            el.style.top = data.y + "px";
        };

        document.onmouseup = function(){
            document.onmousemove = null;
        };
    };
}

/* ===== ANIMATION CHANGE ===== */
document.getElementById("animationSelect").addEventListener("change", function(){
    if(!selectedElement) return;

    selectedElement.animation = this.value;

    const el = document.getElementById(selectedElement.id);
    el.className = "text-element " + this.value;
});

/* ===== RECORD ===== */
let recorder, chunks=[];

async function startRec(){
    const stream = await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = ()=>{
        const blob = new Blob(chunks,{type:"video/webm"});
        const url = URL.createObjectURL(blob);
        const a=document.createElement("a");
        a.href=url;
        a.download="smart_invitation.webm";
        a.click();
        chunks=[];
    }
    recorder.start();
}

function stopRec(){
    if(recorder) recorder.stop();
}

</script>

</body>
</html>
