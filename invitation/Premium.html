<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timeline Wedding Editor 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:#111;
    color:white;
}

/* VIDEO AREA */
.video-container{
    position:relative;
    width:100%;
    max-width:420px;
    margin:auto;
    aspect-ratio:9/16;
    overflow:hidden;
    background:black;
}

video{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* TEXT ELEMENT */
.text-element{
    position:absolute;
    padding:5px 10px;
    cursor:move;
}

.selected{
    border:2px dashed red;
}

/* TOOLBAR */
.toolbar{
    display:flex;
    gap:10px;
    padding:10px;
    background:#222;
    position:sticky;
    top:0;
    z-index:10;
}

.toolbar button, .toolbar select{
    padding:6px 10px;
}

/* TIMELINE */
.timeline{
    padding:10px;
    background:#1a1a1a;
}

.timeline input{
    width:100%;
}
</style>
</head>
<body>

<div class="toolbar">
    <select id="animationSelect">
        <option value="fade">Fade</option>
        <option value="zoom">Zoom</option>
        <option value="slide">Slide</option>
    </select>

    <button onclick="addText()">Add Text At Current Time</button>
</div>

<div class="video-container" id="videoContainer">
    <video id="bgVideo" controls>
        <!-- Replace with your wedding background video -->
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
    </video>
</div>

<div class="timeline">
    <input type="range" id="timeSlider" min="0" value="0" step="0.1">
</div>

<script>

let elements = [];
let selectedElement = null;

const video = document.getElementById("bgVideo");
const slider = document.getElementById("timeSlider");
const container = document.getElementById("videoContainer");

/* ===== Sync Slider With Video ===== */
video.addEventListener("loadedmetadata", function(){
    slider.max = video.duration;
});

video.addEventListener("timeupdate", function(){
    slider.value = video.currentTime;
    updateVisibility();
});

slider.addEventListener("input", function(){
    video.currentTime = slider.value;
});

/* ===== ADD TEXT ===== */
function addText(){
    const id = "el" + Date.now();
    const start = video.currentTime;
    const end = start + 3; // default 3 seconds

    const data = {
        id,
        text:"Edit me",
        x:100,
        y:200,
        startTime:start,
        endTime:end,
        animation:"fade"
    };

    elements.push(data);
    createElement(data);
}

/* ===== CREATE ELEMENT ===== */
function createElement(data){
    const div = document.createElement("div");
    div.className = "text-element";
    div.innerText = data.text;
    div.style.left = data.x+"px";
    div.style.top = data.y+"px";
    div.id = data.id;

    div.onclick = function(e){
        e.stopPropagation();
        selectElement(div, data);
    };

    div.ondblclick = function(){
        let newText = prompt("Edit Text", data.text);
        if(newText){
            data.text = newText;
            div.innerText = newText;
        }
    };

    enableDrag(div, data);
    container.appendChild(div);
}

/* ===== DRAG ===== */
function enableDrag(el, data){
    el.onmousedown = function(e){
        selectElement(el, data);

        let offsetX = e.offsetX;
        let offsetY = e.offsetY;

        document.onmousemove = function(e){
            data.x = e.offsetX;
            data.y = e.offsetY;
            el.style.left = data.x+"px";
            el.style.top = data.y+"px";
        };

        document.onmouseup = function(){
            document.onmousemove=null;
        };
    };
}

/* ===== SELECT ===== */
function selectElement(div, data){
    document.querySelectorAll(".text-element").forEach(el=>{
        el.classList.remove("selected");
    });

    div.classList.add("selected");
    selectedElement = data;
}

/* ===== SHOW/HIDE BASED ON TIME ===== */
function updateVisibility(){
    const current = video.currentTime;

    elements.forEach(el=>{
        const div = document.getElementById(el.id);

        if(current >= el.startTime && current <= el.endTime){
            div.style.display="block";
        }else{
            div.style.display="none";
        }
    });
}

</script>

</body>
</html>
