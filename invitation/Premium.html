<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Wedding Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:'Poppins',sans-serif;
    background:#000;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* MAIN CARD */
.invitation{
    width:90%;
    max-width:400px;
    aspect-ratio:9/16;
    background:#111;
    border-radius:20px;
    position:relative;
    overflow:hidden;
    box-shadow:0 0 40px rgba(255,215,0,0.3);
}

/* GOLD BORDER */
.invitation::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:20px;
    padding:2px;
    background:linear-gradient(45deg,gold,#ffcc70,#ffd700);
    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
}

/* CURTAIN */
.curtain{
    position:absolute;
    width:50%;
    height:100%;
    background:linear-gradient(135deg,#3a0d0d,#6e0e0a);
    z-index:5;
    transition:2s ease;
}

.left{left:0;}
.right{right:0;}

.open .left{transform:translateX(-100%);}
.open .right{transform:translateX(100%);}

/* CONTENT */
.content{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    padding:20px;
    opacity:0;
    transition:2s ease 1.5s;
}

.open .content{
    opacity:1;
}

/* TEXT STYLE */
.title{
    font-family:'Cinzel',serif;
    font-size:22px;
    letter-spacing:3px;
    margin-bottom:15px;
}

.names{
    font-family:'Cinzel',serif;
    font-size:32px;
    color:gold;
    margin-bottom:15px;
    animation:zoomName 3s ease forwards;
}

.details{
    font-size:16px;
    margin:5px 0;
}

@keyframes zoomName{
    from{transform:scale(0.5);opacity:0;}
    to{transform:scale(1);opacity:1;}
}

/* BUTTON */
.controls{
    position:absolute;
    bottom:10px;
    width:100%;
    text-align:center;
    z-index:10;
}

button{
    padding:8px 15px;
    border:none;
    background:gold;
    border-radius:20px;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="invitation" id="invite">

    <div class="curtain left"></div>
    <div class="curtain right"></div>

    <div class="content">
        <div class="title">You're Invited</div>
        <div class="names">Rahul ❤️ Sneha</div>
        <div class="details">Together with our families</div>
        <div class="details">20 April 2026</div>
        <div class="details">Mumbai</div>
    </div>

    <div class="controls">
        <button onclick="openInvite()">Open Invitation</button>
    </div>

</div>

<script>
function openInvite(){
    document.getElementById("invite").classList.add("open");
}
</script>

</body>
</html>
